# ============================================================
# COTIZA — docker-compose
# Servicios base: postgres + api (Go).
# Servicios de apoyo (migration, pgadmin) usan el profile "tools"
# para no levantarse automáticamente en cada "docker compose up".
# ============================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: cotiza_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cotiza_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-cotiza}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cotiza_pgdata:/var/lib/postgresql/data
      # Los .sql en /docker-entrypoint-initdb.d se ejecutan en orden
      # SOLO la primera vez que se crea el volumen (base nueva).
      - ./api-go/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cotiza_admin} -d ${POSTGRES_DB:-cotiza}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cotiza_net

  api:
    build:
      context: ./api-go
      dockerfile: Dockerfile
    container_name: cotiza_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cotiza_admin}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-cotiza}?sslmode=disable
      PORT: "8080"
      ENV: ${ENV:-development}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      # El propio Go sirve los estáticos del frontend (ver internal/handlers).
      - ./frontend:/app/static:ro
    networks:
      - cotiza_net

  # --- Herramientas de apoyo (no se inician con "docker compose up") ---
  # Uso: docker compose --profile tools run --rm migration
  migration:
    build:
      context: ./migration-python
      dockerfile: Dockerfile
    container_name: cotiza_migration
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cotiza_admin}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-cotiza}
    volumes:
      - ./migration-python/data:/app/data:ro
    profiles: ["tools"]
    networks:
      - cotiza_net

  # Uso: docker compose --profile tools up pgadmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cotiza_pgadmin
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cotiza.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    profiles: ["tools"]
    networks:
      - cotiza_net

volumes:
  cotiza_pgdata:

networks:
  cotiza_net:
    driver: bridge
