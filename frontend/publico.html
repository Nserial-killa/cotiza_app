<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vista previa de propuesta | Exceltec</title>
  <style>
    :root{color-scheme:light;--navy:#0d2b52;--navy-2:#174f91;--blue:#246df5;--accent:#9ec5ff;--ink:#12233d;--muted:#65758b;--line:#dbe3ee;--surface:#fff;--background:#f3f6fa;--body-font:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--title-font:var(--body-font)}
    *{box-sizing:border-box}
    body{margin:0;background:var(--background);color:var(--ink);font-family:var(--body-font);line-height:1.5;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    h1,h2,h3{font-family:var(--title-font)}
    .shell{width:min(980px,calc(100% - 32px));margin:32px auto 56px}
    .brand{display:flex;align-items:center;gap:12px;color:#fff}
    .brand-mark{display:grid;width:38px;height:38px;place-items:center;border:2px solid #fff;border-radius:50%;font-size:22px;font-weight:800}
    .brand strong{display:block;font-size:22px;line-height:1}.brand small{display:block;margin-top:4px;font-size:10px;letter-spacing:.08em;opacity:.8}
    .hero{overflow:hidden;border-radius:20px;background:linear-gradient(135deg,var(--navy),var(--navy-2));box-shadow:0 18px 45px rgba(20,46,83,.16)}
    .hero-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:26px 32px;border-bottom:1px solid rgba(255,255,255,.15)}
    .brand-name{font-size:20px;line-height:1.15;overflow-wrap:anywhere}
    .brand-logo{display:inline-flex;align-items:center;padding:6px 10px;border-radius:10px;background:#fff}
    .brand-logo img{display:block;width:auto;max-width:220px;object-fit:contain}
    .brand-logo.size-pequeno img{height:26px}.brand-logo.size-mediano img{height:38px}.brand-logo.size-grande img{height:54px;max-width:280px}
    .hero-note{display:flex;align-items:center;gap:10px;color:#dceafe;font-size:12px;text-align:right}
    .confidential{padding:4px 9px;border:1px solid rgba(255,255,255,.55);border-radius:999px;color:#fff;font-size:10px;font-weight:800;letter-spacing:.12em}
    .hero-body{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:end;padding:38px 32px;color:#fff}
    .eyebrow{margin:0 0 7px;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(30px,5vw,48px);letter-spacing:-.04em}.client{margin:10px 0 0;color:#dceafe;font-size:17px}
    .total{text-align:right}.total span{display:block;color:#bcd5f7;font-size:12px;font-weight:700;text-transform:uppercase}.total strong{display:block;margin-top:3px;font-size:clamp(30px,5vw,45px);white-space:nowrap}
    .meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0 28px}
    .meta div,.section{border:1px solid var(--line);background:var(--surface);box-shadow:0 8px 22px rgba(21,44,76,.05)}
    .meta div{padding:16px 18px;border-radius:12px}.meta span{display:block;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase}.meta strong{display:block;margin-top:3px;font-size:14px}
    .sections{display:grid;gap:16px}.section{overflow:hidden;border-radius:15px}.section h2{margin:0;padding:18px 22px;border-bottom:1px solid var(--line);border-left:4px solid var(--blue);color:var(--navy);font-size:18px}
    .fields{margin:0}.field-row{display:grid;grid-template-columns:minmax(180px,.8fr) minmax(0,1.4fr);gap:28px;padding:15px 22px;border-top:1px solid #edf1f6}.field-row:first-child{border-top:0}
    dt{color:var(--muted);font-size:13px;font-weight:700}dd{margin:0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
    .empty{padding:20px 22px;color:var(--muted)}
    .status{display:grid;min-height:66vh;place-items:center;text-align:center}.status-card{width:min(520px,100%);padding:42px 30px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 15px 42px rgba(21,44,76,.08)}
    .status-icon{display:grid;width:54px;height:54px;margin:0 auto 18px;place-items:center;border-radius:50%;background:#eaf1ff;color:var(--blue);font-size:24px;font-weight:800}.status h1{font-size:24px}.status p{margin:10px 0 0;color:var(--muted)}
    .block-title{margin:0;padding:16px 22px 0;font-size:15px;color:var(--navy)}
    .rich{padding:15px 22px}.rich p{margin:0 0 8px;white-space:pre-wrap}.rich p:last-child{margin-bottom:0}.rich ul{margin:0 0 8px;padding-left:22px}.rich li{margin:2px 0}
    .heading{margin:0;padding:18px 22px 4px;font-size:20px;letter-spacing:-.01em;color:var(--navy)}
    .summary{margin:15px 22px;padding:14px 18px;border-left:4px solid var(--blue);border-radius:8px;background:#f2f7ff}.summary .rich{padding:0}
    .cover{padding:34px 22px 26px;text-align:center}.cover h3{margin:0;font-size:clamp(24px,4vw,34px);letter-spacing:-.03em;color:var(--navy)}.cover .rich{max-width:620px;margin:0 auto;padding:10px 0 0;color:var(--muted);text-align:left}
    .pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 28px;margin:0;padding:15px 22px}.pairs div{min-width:0;padding-bottom:10px;border-bottom:1px solid #edf1f6}
    .pairs dt{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}.pairs dd{margin:3px 0 0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
    .data-table{width:100%;border-collapse:collapse}.data-table th{padding:10px 12px;border-bottom:2px solid var(--line);text-align:left;font-size:12px}.data-table td{padding:10px 12px;border-bottom:1px solid #edf1f6;font-size:14px;vertical-align:top}
    .data-table .num{text-align:right;white-space:nowrap}.data-table tr.chosen td{background:#f2f7ff;font-weight:600}.table-wrap{overflow-x:auto;padding:4px 10px 10px}
    .image{display:block;max-width:100%;height:auto;margin:15px auto;border-radius:10px}
    .signature{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;padding:30px 22px 22px}.signature span{display:block;padding-top:8px;border-top:1px solid var(--ink);color:var(--muted);font-size:12px;text-align:center}
    .page-break{height:0}
    footer{margin-top:28px;color:var(--muted);font-size:12px;text-align:center}
    @media print{body{background:#fff}.page-break{break-after:page}.section{box-shadow:none;break-inside:avoid-page}}
    [hidden]{display:none!important}
    @media(max-width:680px){.shell{margin-top:16px}.hero-top,.hero-body{padding:22px}.hero-body{grid-template-columns:1fr}.total{text-align:left}.meta{grid-template-columns:1fr}.field-row{grid-template-columns:1fr;gap:5px}.pairs,.signature{grid-template-columns:1fr}}
  </style>
  <style id="estiloPagina"></style>
</head>
<body>
  <main class="shell">
    <section id="estado" class="status" aria-live="polite">
      <div class="status-card"><div class="status-icon">E</div><h1 id="estadoTitulo">Cargando propuesta…</h1><p id="estadoTexto">Estamos preparando la información.</p></div>
    </section>
    <div id="propuesta" hidden>
      <header class="hero">
        <div class="hero-top"><div id="marca" class="brand"><span class="brand-mark">e</span><span><strong>Exceltec</strong><small>BUSINESS SOLUTIONS</small></span></div><div class="hero-note"><span id="textoEncabezado" hidden></span><span id="marcaConfidencial" class="confidential" hidden>CONFIDENCIAL</span></div></div>
        <div class="hero-body"><div><p class="eyebrow">Propuesta comercial</p><h1 id="codigoOferta"></h1><p id="cliente" class="client"></p></div><div class="total"><span>Precio total</span><strong id="precioTotal"></strong></div></div>
      </header>
      <section class="meta" aria-label="Datos de la propuesta">
        <div><span>Empresa</span><strong id="empresa"></strong></div>
        <div><span>Cotizador</span><strong id="cotizador"></strong></div>
        <div><span>Tipo de propuesta</span><strong id="tipoPropuesta"></strong></div>
      </section>
      <div id="secciones" class="sections"></div>
      <footer id="pie">Documento de vista previa generado por Exceltec Business Solutions.</footer>
    </div>
  </main>
  <script>
    (function(){
      "use strict";
      var estado=document.getElementById("estado"),propuesta=document.getElementById("propuesta");
      function texto(valor){
        if(valor===null||valor===undefined||valor==="")return "—";
        if(typeof valor==="boolean")return valor?"Sí":"No";
        if(Array.isArray(valor))return valor.map(texto).join(", ");
        if(typeof valor==="object")return Object.keys(valor).map(function(k){return k+": "+texto(valor[k]);}).join(" · ");
        return String(valor);
      }
      function poner(id,valor){document.getElementById(id).textContent=texto(valor);}
      function dinero(valor,moneda){
        var numero=Number(valor||0);var simbolo=texto(moneda||"US$");
        return simbolo+" "+numero.toLocaleString("es-CR",{minimumFractionDigits:2,maximumFractionDigits:2});
      }
      function mostrarError(){
        document.getElementById("estadoTitulo").textContent="Este enlace no es válido o ya venció.";
        document.getElementById("estadoTexto").textContent="Solicite un enlace nuevo a la persona que le compartió la propuesta.";
      }
      function nodo(etiqueta,clase,contenido){
        var el=document.createElement(etiqueta);if(clase)el.className=clase;
        if(contenido!==undefined)el.textContent=contenido;return el;
      }
      // Texto enriquecido de la plantilla: las líneas que empiezan con "• "
      // (botón "+ Agregar viñeta" del editor) son viñetas; el resto, párrafos.
      function textoEnriquecido(contenido){
        var caja=nodo("div","rich"),parrafo=[],lista=null;
        function cerrarParrafo(){if(parrafo.length){caja.appendChild(nodo("p","",parrafo.join("\n")));parrafo=[];}}
        String(contenido||"").split("\n").forEach(function(linea){
          var vineta=/^\s*•\s?(.*)$/.exec(linea);
          if(vineta){cerrarParrafo();if(!lista){lista=nodo("ul");caja.appendChild(lista);}lista.appendChild(nodo("li","",vineta[1]));return;}
          lista=null;
          if(linea.trim()==="")cerrarParrafo();else parrafo.push(linea);
        });
        cerrarParrafo();
        return caja;
      }
      // Pares Etiqueta/Valor (Datos del cliente, Grupo de información,
      // Condiciones comerciales, Portada, Firma) en grilla de 2 columnas.
      function grillaPares(campos){
        var lista=nodo("dl","pairs");
        (Array.isArray(campos)?campos:[]).forEach(function(campo){
          var par=document.createElement("div");
          par.append(nodo("dt","",texto(campo.etiqueta)),nodo("dd","",texto(campo.valor)));
          lista.appendChild(par);
        });
        return lista;
      }
      function tabla(columnas,filas,numericas){
        var envoltorio=nodo("div","table-wrap"),t=nodo("table","data-table"),trh=document.createElement("tr");
        columnas.forEach(function(c,i){var th=nodo("th",numericas&&numericas[i]?"num":"",texto(c));trh.appendChild(th);});
        var thead=document.createElement("thead");thead.appendChild(trh);t.appendChild(thead);
        var tbody=document.createElement("tbody");
        filas.forEach(function(fila){
          var tr=document.createElement("tr");if(fila.clase)tr.className=fila.clase;
          (fila.celdas||fila).forEach(function(valor,i){tr.appendChild(nodo("td",numericas&&numericas[i]?"num":"",texto(valor)));});
          tbody.appendChild(tr);
        });
        t.appendChild(tbody);envoltorio.appendChild(t);return envoltorio;
      }
      function conTitulo(bloque,cuerpo){
        var caja=document.createElement("div");
        if(bloque.titulo)caja.appendChild(nodo("h3","block-title",bloque.titulo));
        caja.appendChild(cuerpo);return caja;
      }
      function renderBloque(bloque){
        var tipo=bloque.tipo_bloque;
        if(tipo==="SALTO_PAGINA"){var salto=nodo("div","page-break");salto.setAttribute("aria-hidden","true");return salto;}
        if(tipo==="CAMPO_VINCULADO"){
          var lista=document.createElement("dl");lista.className="fields";
          var fila=document.createElement("div");fila.className="field-row";
          var dt=document.createElement("dt"),dd=document.createElement("dd");
          dt.textContent=texto(bloque.titulo||"Dato");dd.textContent=texto(bloque.valor);
          fila.append(dt,dd);lista.appendChild(fila);
          return lista;
        }
        if(tipo==="PORTADA"){
          var portada=nodo("div","cover");
          if(bloque.titulo)portada.appendChild(nodo("h3","",bloque.titulo));
          if(bloque.contenido)portada.appendChild(textoEnriquecido(bloque.contenido));
          var envoltorioPortada=document.createElement("div");envoltorioPortada.appendChild(portada);
          if(Array.isArray(bloque.campos)&&bloque.campos.length)envoltorioPortada.appendChild(grillaPares(bloque.campos));
          return envoltorioPortada;
        }
        if(tipo==="ENCABEZADO")return nodo("h3","heading",texto(bloque.titulo||bloque.contenido));
        if(tipo==="RESUMEN_EJECUTIVO"){var resumen=nodo("div","summary");resumen.appendChild(textoEnriquecido(bloque.contenido));return conTitulo(bloque,resumen);}
        if(tipo==="IMAGEN"){
          var url=String(bloque.contenido||"").trim();
          if(/^https?:\/\//i.test(url)){var img=nodo("img","image");img.src=url;img.alt=bloque.titulo||"Imagen de la propuesta";img.loading="lazy";return img;}
          return textoEnriquecido(url);
        }
        if(tipo==="DATOS_CLIENTE"||tipo==="GRUPO_INFORMACION"||tipo==="CONDICIONES_COMERCIALES"){
          var pares=document.createElement("div");
          if(bloque.contenido)pares.appendChild(textoEnriquecido(bloque.contenido));
          pares.appendChild(grillaPares(bloque.campos));
          return conTitulo(bloque,pares);
        }
        if(tipo==="FIRMA_ACEPTACION"){
          var firma=document.createElement("div");
          if(bloque.contenido)firma.appendChild(textoEnriquecido(bloque.contenido));
          if(Array.isArray(bloque.campos)&&bloque.campos.length)firma.appendChild(grillaPares(bloque.campos));
          var espacio=nodo("div","signature");espacio.append(nodo("span","","Firma"),nodo("span","","Fecha"));firma.appendChild(espacio);
          return conTitulo(bloque,firma);
        }
        if(tipo==="LISTA_PRECIOS"){
          var items=Array.isArray(bloque.items)?bloque.items:[];
          if(!items.length)return conTitulo(bloque,nodo("p","empty","Sin precios para mostrar."));
          var conCantidad=items.some(function(i){return i.cantidad!==undefined&&i.cantidad!==null;});
          var columnasLista=["Código","Nombre","Descripción","Precio"].concat(conCantidad?["Cantidad"]:[]);
          var filasLista=items.map(function(i){
            var celdas=[i.codigo,i.nombre,i.descripcion,dinero(i.precio,i.moneda)+(i.unidad_cobro?" / "+i.unidad_cobro:"")];
            if(conCantidad)celdas.push(i.cantidad);
            return {celdas:celdas,clase:i.seleccionado?"chosen":""};
          });
          return conTitulo(bloque,tabla(columnasLista,filasLista,[false,false,false,true,true]));
        }
        if(tipo==="TABLA_INVERSION"||tipo==="TABLA_DATOS"||tipo==="OPCIONES_PROPUESTA"){
          var columnas=Array.isArray(bloque.columnas)?bloque.columnas:[];
          var filas=Array.isArray(bloque.filas)?bloque.filas:[];
          if(!filas.length)return conTitulo(bloque,nodo("p","empty","Sin datos para mostrar en esta tabla."));
          return conTitulo(bloque,tabla(columnas,filas.map(function(f){return Array.isArray(f)?f:[];})));
        }
        // TEXTO y heredados (LISTA, CONDICIONES): contenido libre.
        return textoEnriquecido(bloque.contenido);
      }
      function renderPlantilla(plantilla,contenedor){
        var secciones=Array.isArray(plantilla.secciones)?plantilla.secciones:[];
        secciones.forEach(function(seccion){
          var bloques=Array.isArray(seccion.bloques)?seccion.bloques:[];
          if(!bloques.length)return; // Sección vacía (todos sus bloques quedaron ocultos por condición) no se muestra.
          var section=document.createElement("section");section.className="section";
          var titulo=document.createElement("h2");titulo.textContent=texto(seccion.titulo||"Sección");section.appendChild(titulo);
          bloques.forEach(function(bloque){section.appendChild(renderBloque(bloque));});
          contenedor.appendChild(section);
        });
        if(!secciones.some(function(s){return Array.isArray(s.bloques)&&s.bloques.length;})){
          var vacia=document.createElement("section");vacia.className="section empty";vacia.textContent="Esta propuesta todavía no contiene secciones para mostrar.";contenedor.appendChild(vacia);
        }
      }
      function renderTabsCrudas(tabs,contenedor){
        tabs.forEach(function(tab){
          var section=document.createElement("section");section.className="section";var titulo=document.createElement("h2");titulo.textContent=texto(tab.nombre||"Sección");section.appendChild(titulo);
          var elementos=Array.isArray(tab.elementos)?tab.elementos:[];
          if(!elementos.length){var vacio=document.createElement("p");vacio.className="empty";vacio.textContent="No hay información registrada en esta sección.";section.appendChild(vacio);}
          else{var lista=document.createElement("dl");lista.className="fields";elementos.forEach(function(elemento){var fila=document.createElement("div");fila.className="field-row";var dt=document.createElement("dt"),dd=document.createElement("dd");dt.textContent=texto(elemento.etiqueta||"Información");dd.textContent=texto(elemento.valor);fila.append(dt,dd);lista.appendChild(fila);});section.appendChild(lista);}
          contenedor.appendChild(section);
        });
        if(!tabs.length){var vacia=document.createElement("section");vacia.className="section empty";vacia.textContent="Esta propuesta todavía no contiene secciones para mostrar.";contenedor.appendChild(vacia);}
      }
      // Estilo de la plantilla (paso 4 del Diseñador), ya resuelto por el
      // backend: la plantilla fijada al generar el enlace trae el SUYO. Sin
      // plantilla (tabs crudas) queda la cabecera por defecto de arriba. Este
      // mismo HTML es el PDF (imprimir → guardar como PDF), así que @page
      // lleva formato, márgenes, numeración, pie y marca de confidencial.
      var HEX=/^#[0-9A-Fa-f]{6}$/;
      function fuenteCSS(nombre){return '"'+String(nombre).replace(/["\;{}<>]/g,"")+'", Inter, ui-sans-serif, -apple-system, "Segoe UI", sans-serif';}
      function cadenaCSS(valor){return '"'+String(valor).replace(/\\/g,"\\\\").replace(/"/g,'\\"').replace(/[\r\n]+/g," ")+'"';}
      function aplicarMarca(estilo){
        var marca=document.getElementById("marca");marca.textContent="";
        var nombre=nodo("strong","brand-name",estilo.organizacion_nombre||"Exceltec Business Solutions");
        function mostrarNombre(){if(!nombre.parentNode)marca.appendChild(nombre);}
        var tamano={PEQUENO:"pequeno",MEDIANO:"mediano",GRANDE:"grande"}[estilo.logo_tamano]||"mediano";
        if(estilo.logo_url&&/^https:\/\//i.test(estilo.logo_url)){
          var caja=nodo("span","brand-logo size-"+tamano),img=document.createElement("img");
          img.alt=estilo.organizacion_nombre||"Logo";img.src=estilo.logo_url;
          // Un logo que no carga no deja un hueco roto: se reemplaza por el nombre.
          img.onerror=function(){if(caja.parentNode)caja.parentNode.removeChild(caja);mostrarNombre();};
          caja.appendChild(img);marca.appendChild(caja);
          if(estilo.mostrar_organizacion)mostrarNombre();
        }else{mostrarNombre();}
      }
      function aplicarEstilo(estilo){
        var raiz=document.documentElement.style;
        var colores={"--navy":estilo.color_primario,"--navy-2":estilo.color_secundario,"--blue":estilo.color_acento,"--accent":estilo.color_acento,"--ink":estilo.color_texto,"--background":estilo.color_fondo};
        Object.keys(colores).forEach(function(v){if(HEX.test(colores[v]||""))raiz.setProperty(v,colores[v]);});
        if(estilo.fuente_texto)raiz.setProperty("--body-font",fuenteCSS(estilo.fuente_texto));
        if(estilo.fuente_titulos)raiz.setProperty("--title-font",fuenteCSS(estilo.fuente_titulos));
        aplicarMarca(estilo);
        var encabezado=document.getElementById("textoEncabezado");
        encabezado.textContent=estilo.texto_encabezado||"";encabezado.hidden=!estilo.texto_encabezado;
        document.getElementById("marcaConfidencial").hidden=!estilo.marca_confidencial;
        document.getElementById("pie").textContent=estilo.texto_pie||("Documento generado por "+(estilo.organizacion_nombre||"Exceltec Business Solutions")+".");
        var tamanoPagina={CARTA:"letter",A4:"A4"}[estilo.formato_pagina]||"letter";
        var margen={COMPACTO:"12mm",NORMAL:"18mm",AMPLIO:"25mm"}[estilo.espaciado_pagina]||"18mm";
        var cajas=[];
        if(estilo.texto_pie)cajas.push("@bottom-left{content:"+cadenaCSS(estilo.texto_pie)+";font-size:9pt;color:#65758b}");
        if(estilo.numerar_paginas)cajas.push('@bottom-right{content:"Página " counter(page) " de " counter(pages);font-size:9pt;color:#65758b}');
        if(estilo.marca_confidencial)cajas.push('@top-right{content:"CONFIDENCIAL";font-size:9pt;font-weight:700;letter-spacing:.12em;color:#b42318}');
        document.getElementById("estiloPagina").textContent="@page{size:"+tamanoPagina+";margin:"+margen+";"+cajas.join("")+"}";
      }
      function render(data){
        poner("codigoOferta",data.codigo_oferta||"Propuesta");poner("cliente",data.cliente);poner("empresa",data.empresa||data.cliente);
        poner("cotizador",data.cotizador_nombre);poner("tipoPropuesta",data.tipo_propuesta);document.getElementById("precioTotal").textContent=dinero(data.total_precio,data.moneda);
        var contenedor=document.getElementById("secciones");contenedor.textContent="";
        var marcaTitulo="Exceltec";
        if(data.plantilla&&typeof data.plantilla==="object"){
          if(data.plantilla.estilo&&typeof data.plantilla.estilo==="object"){aplicarEstilo(data.plantilla.estilo);marcaTitulo=data.plantilla.estilo.organizacion_nombre||marcaTitulo;}
          renderPlantilla(data.plantilla,contenedor);
        }
        else{renderTabsCrudas(Array.isArray(data.tabs)?data.tabs:[],contenedor);}
        estado.hidden=true;propuesta.hidden=false;document.title=texto(data.codigo_oferta||"Propuesta")+" | "+marcaTitulo;
      }
      var token=new URLSearchParams(window.location.search).get("token");
      if(!token){mostrarError();return;}
      fetch("/api/publico/cotizacion/"+encodeURIComponent(token),{method:"GET",credentials:"omit",headers:{Accept:"application/json"}})
        .then(function(resp){return resp.json().catch(function(){return null;}).then(function(data){if(!resp.ok||!data||!data.ok)throw new Error("invalid");return data;});})
        .then(render).catch(mostrarError);
    })();
  </script>
</body>
</html>
