<section id="section-clientes" class="section cli-page">
  <div class="topbar sol-topbar">
    <div>
      <span class="sol-eyebrow">GESTIÓN COMERCIAL</span>
      <h1>Clientes</h1>
      <p>Base de clientes vinculada a cotizaciones.</p>
    </div>
    <button id="btnNuevoCliente" class="btn btn-primary" type="button">+ Nuevo cliente</button>
  </div>

  <div class="card cli-card">
    <div class="cli-filters">
      <div class="field"><label for="cliFiltroBusqueda">Búsqueda</label><input id="cliFiltroBusqueda" class="input" placeholder="Nombre comercial o razón social"></div>
      <div class="field"><label for="cliFiltroEstado">Estado</label><select id="cliFiltroEstado" class="select"><option value="">Todos</option><option value="Activo">Activo</option><option value="Inactivo">Inactivo</option></select></div>
      <button id="btnBuscarClientes" class="btn btn-primary cli-filter-button" type="button">Aplicar filtros</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Nombre comercial</th><th>Razón social</th><th>Estado</th><th>Origen</th><th>Cotizaciones</th><th>Creado</th><th></th></tr>
        </thead>
        <tbody id="clientesBody"><tr><td colspan="7">Cargando clientes...</td></tr></tbody>
      </table>
    </div>
  </div>
</section>

<script>
(function(){
  "use strict";

  const estado = { clientes: [] };

  function core(){ return window.__cotizaCore || {}; }
  function porId(id){ return document.getElementById(id); }
  function escapar(valor){
    const fn = core().escapeHtml;
    return fn ? fn(String(valor == null ? "" : valor)) : String(valor == null ? "" : valor);
  }
  function toast(mensaje){ if(core().mostrarToast) core().mostrarToast(mensaje); }

  async function solicitar(url, opciones){
    const fetchSeguro = core().fetchAutenticado;
    if(!fetchSeguro) throw new Error("La sesión todavía no está disponible.");
    const resp = await fetchSeguro(url, opciones || {});
    let data = null;
    try{ data = await resp.json(); }catch(error){ data = null; }
    if(!resp.ok || !data || !data.ok){
      throw new Error((data && data.error) || "No fue posible completar la solicitud.");
    }
    return data;
  }

  function parametrosFiltros(){
    const params = new URLSearchParams();
    const busqueda = porId("cliFiltroBusqueda") ? porId("cliFiltroBusqueda").value.trim() : "";
    const filtroEstado = porId("cliFiltroEstado") ? porId("cliFiltroEstado").value : "";
    if(busqueda) params.set("busqueda", busqueda);
    if(filtroEstado) params.set("estado", filtroEstado);
    const qs = params.toString();
    return qs ? "?" + qs : "";
  }

  function fecha(valor){
    if(!valor) return "—";
    const fechaValor = new Date(valor);
    if(Number.isNaN(fechaValor.getTime())) return String(valor).slice(0, 10);
    return fechaValor.toLocaleDateString("es-CR", {year:"numeric", month:"short", day:"numeric"});
  }

  function renderListado(){
    const tbody = porId("clientesBody");
    if(!tbody) return;
    if(!estado.clientes.length){
      tbody.innerHTML = '<tr><td colspan="7">No hay clientes para los filtros seleccionados.</td></tr>';
      return;
    }
    tbody.innerHTML = estado.clientes.map(function(c){
      return '<tr>'
        + '<td>'+escapar(c.nombre_comercial)+'</td>'
        + '<td>'+escapar(c.razon_social || "—")+'</td>'
        + '<td>'+escapar(c.estado)+'</td>'
        + '<td>'+escapar(c.origen || "—")+'</td>'
        + '<td>'+escapar(c.total_cotizaciones)+'</td>'
        + '<td>'+escapar(fecha(c.fecha_creacion))+'</td>'
        + '<td><button class="mini" type="button" data-editar="'+escapar(c.cliente_id)+'">Editar</button></td>'
        + '</tr>';
    }).join("");
    tbody.querySelectorAll("[data-editar]").forEach(function(btn){
      btn.addEventListener("click", function(){
        abrirModalCliente(estado.clientes.find(function(c){ return c.cliente_id === btn.dataset.editar; }));
      });
    });
  }

  async function cargarListado(){
    const tbody = porId("clientesBody");
    if(tbody) tbody.innerHTML = '<tr><td colspan="7">Cargando clientes...</td></tr>';
    try{
      const data = await solicitar("/api/clientes/gestion" + parametrosFiltros());
      estado.clientes = data.clientes || [];
      renderListado();
    }catch(error){
      if(tbody) tbody.innerHTML = '<tr><td colspan="7">'+escapar(error.message)+'</td></tr>';
      toast(error.message);
    }
  }

  function abrirModalCliente(cliente){
    if(porId("clienteIdOriginal")) porId("clienteIdOriginal").value = cliente ? cliente.cliente_id : "";
    if(porId("modalClienteTitulo")) porId("modalClienteTitulo").textContent = cliente ? "Editar cliente" : "Nuevo cliente";
    if(porId("clienteNombreComercial")) porId("clienteNombreComercial").value = cliente ? (cliente.nombre_comercial || "") : "";
    if(porId("clienteRazonSocial")) porId("clienteRazonSocial").value = cliente ? (cliente.razon_social || "") : "";
    if(porId("clienteEstado")) porId("clienteEstado").value = cliente ? cliente.estado : "Activo";
    if(porId("clienteMensaje")) porId("clienteMensaje").textContent = "";
    if(porId("modalCliente")) porId("modalCliente").classList.add("open");
  }

  function cerrarModalCliente(){
    if(porId("modalCliente")) porId("modalCliente").classList.remove("open");
  }

  async function guardarCliente(){
    const id = porId("clienteIdOriginal") ? porId("clienteIdOriginal").value : "";
    const nombreComercial = porId("clienteNombreComercial") ? porId("clienteNombreComercial").value.trim() : "";
    const razonSocial = porId("clienteRazonSocial") ? porId("clienteRazonSocial").value.trim() : "";
    const estadoSel = porId("clienteEstado") ? porId("clienteEstado").value : "Activo";
    if(!nombreComercial){
      if(porId("clienteMensaje")) porId("clienteMensaje").textContent = "Debe indicar el nombre comercial.";
      return;
    }
    const boton = porId("btnGuardarCliente");
    if(boton) boton.disabled = true;
    try{
      if(id){
        await solicitar("/api/clientes/"+encodeURIComponent(id), {method:"PATCH", headers:{"Content-Type":"application/json"}, body: JSON.stringify({nombre_comercial: nombreComercial, razon_social: razonSocial, estado: estadoSel})});
      }else{
        await solicitar("/api/clientes", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({nombre_comercial: nombreComercial, razon_social: razonSocial})});
      }
      cerrarModalCliente();
      toast(id ? "Cliente actualizado." : "Cliente creado.");
      await cargarListado();
    }catch(error){
      if(porId("clienteMensaje")) porId("clienteMensaje").textContent = error.message;
    }finally{
      if(boton) boton.disabled = false;
    }
  }

  function enlazar(){
    if(porId("btnNuevoCliente")) porId("btnNuevoCliente").addEventListener("click", function(){ abrirModalCliente(null); });
    if(porId("btnCerrarModalCliente")) porId("btnCerrarModalCliente").addEventListener("click", cerrarModalCliente);
    if(porId("btnCancelarCliente")) porId("btnCancelarCliente").addEventListener("click", cerrarModalCliente);
    if(porId("btnGuardarCliente")) porId("btnGuardarCliente").addEventListener("click", guardarCliente);
    if(porId("btnBuscarClientes")) porId("btnBuscarClientes").addEventListener("click", cargarListado);
    let temporizador = null;
    if(porId("cliFiltroBusqueda")) porId("cliFiltroBusqueda").addEventListener("input", function(){ clearTimeout(temporizador); temporizador = setTimeout(cargarListado, 350); });
    if(porId("cliFiltroEstado")) porId("cliFiltroEstado").addEventListener("change", cargarListado);
    const modalEl = porId("modalCliente");
    if(modalEl) modalEl.addEventListener("click", function(e){ if(e.target && e.target.id === "modalCliente") cerrarModalCliente(); });
  }

  // Cotiza_Modals se ensambla después de este archivo en index.html, así
  // que el modal #modalCliente todavía no existe cuando este <script>
  // corre — a diferencia de Cotiza_Solicitudes (cuyo panel de detalle es
  // propio, sin depender de otro include posterior), acá hay que esperar
  // a que el documento completo esté listo antes de enlazar el modal.
  document.addEventListener("DOMContentLoaded", enlazar);

  window.CotizaClientes = { mostrarListado: cargarListado };
})();
</script>
