
<script>
(function(core){
  core = core || {};
  const state = core.state || (window.state || {});
  const byId = core.byId || function(id){ return document.getElementById(id); };
  const bind = core.bind || function(id, ev, fn){ const el = byId(id); if(el) el.addEventListener(ev, fn); };
  const mostrarToast = core.mostrarToast || function(texto){ console.log(texto || ""); };
  const escapeHtml = core.escapeHtml || function(value){
    return String(value === undefined || value === null ? "" : value)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");
  };
  const normalizarTextoBusquedaParam_ = core.normalizarTextoBusquedaParam_ || function(value){
    return String(value || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
  };
  // Sprint 3: fetch con el header Authorization puesto solo desde
  // cotiza_scripts.html (window.__cotizaCore.fetchAutenticado). Si por
  // lo que sea no est\u00e1 disponible, cae a fetch normal \u2014 mejor una
  // petici\u00f3n sin token que una pantalla rota.
  const fetchAutenticado = core.fetchAutenticado || fetch;
  const actualizarEstadoCotizadorDesigner = core.actualizarEstadoCotizadorDesigner || function(estado, version, validacion){
    const set = function(id, val){ const el = byId(id); if(el) el.textContent = val || ""; };
    set("designerCotizadorEstado", estado);
    set("designerCotizadorVersion", version);
    set("designerCotizadorValidacion", validacion);
  };

      function getCotizadorFase1State_(){
        state.cotizadorFase1 = state.cotizadorFase1 || {
          cargado:false,
          cotizadores:[],
          tabs:[],
          elementos:[],
          relaciones:[],
          catalogoValores:[],
          catalogosDefinicion:[],
          camposModelo:[],
          reglasModelo:[],
          tablaColumnasActual:[],
          campoReglasTemp:[],
          calculadoOperandosTemp:[],
          listaPreciosItemsActual:[],
          listaPreciosItemEditId:"",
          seccionesReutilizables:[],
          cargandoSeccionesReutilizables:false,
          cotizadorId:"",
          tabId:"",
          elementoId:"",
          props:"seccion",
          modoVista:"diseno",
          reglasCotizador:[],
          reglaCotizadorSeleccionadaId:""
        };
        return state.cotizadorFase1;
      }

      function rowsFromRespuestaFase1_(res){
        if(!res) return [];
        if(Array.isArray(res)) return res;
        if(Array.isArray(res.data)) return res.data;
        if(Array.isArray(res.filas)) return res.filas;
        if(Array.isArray(res.rows)) return res.rows;
        if(res.resultado) return rowsFromRespuestaFase1_(res.resultado);
        return [];
      }

      function isOkRespuestaFase1_(res){
        return !!(res && (res.ok === true || res.success === true));
      }

      function guardarModuloParametrosFase1_(modulo, payload, onOk, onFail){
        payload = payload || {};
        payload.modulo = modulo;
        if(!window.google || !google.script || !google.script.run){
          if(onFail) onFail(new Error("google.script.run no disponible."));
          return;
        }
        google.script.run
          .withSuccessHandler(function(res){
            if(!isOkRespuestaFase1_(res)){
              if(onFail) onFail(new Error((res && (res.message || res.mensaje || res.error)) || "No se pudo guardar."), res);
              return;
            }
            if(onOk) onOk(res);
          })
          .withFailureHandler(function(err){
            if(onFail) onFail(err);
          })
          .webGuardarModuloParametro(payload);
      }

      function cambiarEstadoModuloParametrosFase1_(modulo, payload, onOk, onFail){
        payload = payload || {};
        payload.modulo = modulo;
        if(!window.google || !google.script || !google.script.run){
          if(onFail) onFail(new Error("google.script.run no disponible."));
          return;
        }
        google.script.run
          .withSuccessHandler(function(res){
            if(!isOkRespuestaFase1_(res)){
              if(onFail) onFail(new Error((res && (res.message || res.mensaje || res.error)) || "No se pudo actualizar estado."), res);
              return;
            }
            if(onOk) onOk(res);
          })
          .withFailureHandler(function(err){ if(onFail) onFail(err); })
          .webCambiarEstadoModuloParametro(payload);
      }


      function listarTabsCotizadorApiFase1_(payload, onOk, onFail){
        payload = payload || {};
        const calculadoraId = String(payload.calculadora_id || payload.cotizador_id || "").trim();
        fetchAutenticado("/api/cotizador/tabs?calculadora_id=" + encodeURIComponent(calculadoraId), {headers:{"Accept":"application/json"}})
          .then(function(resp){ return resp.json().then(function(data){ if(!resp.ok || !data.ok) throw new Error(data.error || "No se pudieron cargar las secciones."); return data; }); })
          .then(function(res){ if(onOk) onOk(res); })
          .catch(function(err){ if(onFail) onFail(err); });
      }
      function guardarTabCotizadorApiFase1_(payload, onOk, onFail){
        payload = payload || {};
        fetchAutenticado("/api/cotizador/tabs", {
          method:"POST", headers:{"Accept":"application/json","Content-Type":"application/json"},
          body:JSON.stringify(payload.registro || payload)
        }).then(function(resp){ return resp.json().then(function(data){ if(!resp.ok || !data.ok) throw new Error(data.error || "No se pudo guardar la sección."); return data; }); })
          .then(function(res){ if(onOk) onOk(res); })
          .catch(function(err){ if(onFail) onFail(err); });
      }

      function listarElementosCotizadorApiFase1_(tabId, onOk, onFail){
        fetchAutenticado("/api/cotizador/elementos?tab_id=" + encodeURIComponent(String(tabId || "")), {headers:{"Accept":"application/json"}})
          .then(function(resp){ return resp.json().then(function(data){ if(!resp.ok || !data.ok) throw new Error(data.error || "No se pudieron cargar los elementos."); return data; }); })
          .then(function(res){ if(onOk) onOk(res); })
          .catch(function(err){ if(onFail) onFail(err); });
      }

      function guardarElementoCotizadorApiFase1_(registro, onOk, onFail){
        fetchAutenticado("/api/cotizador/elementos", {
          method:"POST", headers:{"Accept":"application/json","Content-Type":"application/json"}, body:JSON.stringify(registro || {})
        }).then(function(resp){ return resp.json().then(function(data){ if(!resp.ok || !data.ok) throw new Error(data.error || "No se pudo guardar el elemento."); return data; }); })
          .then(function(res){ if(onOk) onOk(res); })
          .catch(function(err){ if(onFail) onFail(err); });
      }

      function cargarSeccionesReutilizablesCotizadorFase1_(onOk){
        const st = getCotizadorFase1State_();
        const cont = byId("designerCotizadorSeccionesAdicionalesLista");
        if(!st.cotizadorId){ st.seccionesReutilizables=[]; renderSeccionesReutilizablesCotizadorFase1_(); if(onOk) onOk(); return; }
        if(st.cargandoSeccionesReutilizables) return;
        st.cargandoSeccionesReutilizables = true;
        if(cont) cont.innerHTML = '<div class="cotizador-mini-empty">Cargando secciones reutilizables...</div>';
        fetchAutenticado("/api/cotizador/secciones-reutilizables?calculadora_id=" + encodeURIComponent(st.cotizadorId), {headers:{"Accept":"application/json"}})
          .then(function(resp){ return resp.json().then(function(data){ if(!resp.ok || !data.ok) throw new Error(data.error || "No se pudieron cargar las secciones reutilizables."); return data; }); })
          .then(function(data){ st.seccionesReutilizables = Array.isArray(data.secciones) ? data.secciones : rowsFromRespuestaFase1_(data); renderSeccionesReutilizablesCotizadorFase1_(); if(onOk) onOk(); })
          .catch(function(err){ st.seccionesReutilizables=[]; if(cont) cont.innerHTML='<div class="cotizador-mini-empty">'+escapeHtml((err&&err.message)||"No se pudieron cargar las secciones.")+'</div>'; })
          .finally(function(){ st.cargandoSeccionesReutilizables=false; });
      }

      function renderSeccionesReutilizablesCotizadorFase1_(){
        const st = getCotizadorFase1State_();
        const cont = byId("designerCotizadorSeccionesAdicionalesLista");
        if(!cont) return;
        const secciones = Array.isArray(st.seccionesReutilizables) ? st.seccionesReutilizables : [];
        if(!secciones.length){ cont.innerHTML='<div class="cotizador-mini-empty">No hay secciones reutilizables de otros cotizadores.</div>'; return; }
        cont.innerHTML = secciones.map(function(s){
          const id=String(s.tab_id||"").trim();
          return '<label class="cotizador-seccion-reutilizable"><input type="checkbox" data-seccion-reutilizable="'+escapeHtml(id)+'" '+(s.asociada?'checked':'')+'>'
            +'<span><strong>'+escapeHtml(s.nombre||id)+'</strong><small>'+escapeHtml(s.calculadora_origen||s.calculadora_origen_id||"Cotizador de origen")+'</small></span></label>';
        }).join("");
      }

      function sincronizarSeccionesAdicionalesCotizadorFase1_(elementoId, onOk, onFail){
        const st = getCotizadorFase1State_();
        const seleccionadas = Array.from(document.querySelectorAll('[data-seccion-reutilizable]:checked')).map(function(chk){ return String(chk.getAttribute("data-seccion-reutilizable")||"").trim().toUpperCase(); });
        const seleccion = {};
        seleccionadas.forEach(function(id){ seleccion[id]=true; });
        const operaciones = [];
        (st.seccionesReutilizables||[]).forEach(function(s){
          const tabId=String(s.tab_id||"").trim().toUpperCase();
          if(s.asociada && !seleccion[tabId]) operaciones.push({metodo:"DELETE", elemento:String(s.elemento_asociacion_id||elementoId), tabId:tabId});
        });
        const nuevas = seleccionadas.filter(function(id){ return !(st.seccionesReutilizables||[]).some(function(s){ return String(s.tab_id||"").trim().toUpperCase()===id && s.asociada; }); });
        if(nuevas.length) operaciones.push({metodo:"POST", elemento:elementoId, tabIds:nuevas});
        let indice=0;
        function siguiente(){
          if(indice>=operaciones.length){ if(onOk) onOk(); return; }
          const op=operaciones[indice++];
          const url="/api/cotizador/elementos/"+encodeURIComponent(op.elemento)+"/secciones"+(op.metodo==="DELETE"?"/"+encodeURIComponent(op.tabId):"");
          const opciones={method:op.metodo,headers:{"Accept":"application/json"}};
          if(op.metodo==="POST"){ opciones.headers["Content-Type"]="application/json"; opciones.body=JSON.stringify({tab_ids:op.tabIds}); }
          fetchAutenticado(url,opciones).then(function(resp){ return resp.json().then(function(data){ if(!resp.ok||!data.ok) throw new Error(data.error||"No se pudo actualizar la asociación."); }); }).then(siguiente).catch(function(err){ if(onFail) onFail(err); });
        }
        siguiente();
      }

      function normalizarAlcanceSeccionCotizadorFase1_(value){
        return String(value || "PROPIO").trim().toUpperCase() === "REUTILIZABLE" ? "REUTILIZABLE" : "PROPIO";
      }

      function bindDesignerCotizadorEventos(){
        if(window.__cotizaDesignerCotizadorFase1Bound) return;
        window.__cotizaDesignerCotizadorFase1Bound = true;

        bind("designerCotizadorActualFiltro","change",function(){
          const st = getCotizadorFase1State_();
          st.cotizadorId = String(byId("designerCotizadorActualFiltro") ? byId("designerCotizadorActualFiltro").value : "").trim().toUpperCase();
          st.tabId = "";
          st.elementoId = "";
          actualizarEstadoDesdeCotizadorSeleccionadoFase1_();
          st.cargado = false;
          st.tabs = [];
          st.elementos = [];
          st.seccionesReutilizables = [];
          st.relaciones = [];
          renderCotizadorFase1_();
          cargarDatosCotizadorFase1_(true);
          cargarReglasCotizadorFase1_();
        });
        bind("btnDesignerNuevaSeccionCotizador","click",nuevoTabCotizadorFase1_);
        bind("btnDesignerGuardarSeccionCotizador","click",guardarTabCotizadorFase1_);
        bind("btnDesignerEliminarSeccionCotizador","click",eliminarTabCotizadorFase1_);
        bind("btnDesignerCerrarPropsCotizador","click",function(){ toggleDesignerPropsCotizadorFase1_(true); });
        bind("designerCotizadorPropsTab","click",function(){ toggleDesignerPropsCotizadorFase1_(false); });
        bind("btnDesignerNuevoComponenteCotizador","click",nuevoComponenteCotizadorFase1_);
        bind("btnDesignerModoDisenoCotizador","click",function(){ setModoVistaCotizadorFase1_("diseno"); });
        bind("btnDesignerModoPreviewCotizador","click",function(){ setModoVistaCotizadorFase1_("preview"); });
        bind("btnDesignerGuardarComponenteCotizador","click",guardarComponenteCotizadorFase1_);
        bind("btnDesignerEliminarComponenteCotizador","click",eliminarComponenteCotizadorFase1_);
        bind("btnDesignerVolverSeccionCotizador","click",cerrarModalComponenteCotizadorFase1_);
        bind("btnCerrarModalDesignerComponente","click",cerrarModalComponenteCotizadorFase1_);
        bind("btnDesignerAplicabilidadSeccion","click",abrirAplicabilidadSeccionCotizadorFase1_);
        bind("btnCerrarModalDesignerAplicabilidad","click",cerrarAplicabilidadSeccionCotizadorFase1_);
        bind("btnCancelarDesignerAplicabilidad","click",cerrarAplicabilidadSeccionCotizadorFase1_);
        bind("btnGuardarDesignerAplicabilidad","click",guardarAplicabilidadSeccionCotizadorFase1_);
        bind("designerBuscarAplicabilidadServicio","input",renderAplicabilidadSeccionCotizadorFase1_);
        bind("designerBuscarAplicabilidadOferta","input",renderAplicabilidadSeccionCotizadorFase1_);
        bind("designerBuscarEstructuraCotizador","input",renderTabsCotizadorFase1_);
        bind("designerCotizadorElementoTipo","change",actualizarPropiedadesPorTipoComponenteCotizadorFase1_);
        bind("designerCotizadorCampoTipoCampo","change",actualizarOpcionesFechaCampoCotizadorFase1_);
        bind("designerCotizadorCampoCatalogoId","change",actualizarMensajeCatalogoHijoCotizadorFase1_);
        bind("btnDesignerAgregarColumnaTabla","click",agregarColumnaTablaCotizadorFase1_);
        bind("btnDesignerAgregarColumnaPropiaTabla","click",agregarColumnaPropiaTablaCotizadorFase1_);
        bind("designerCotizadorTablaModoCampoExistente","change",actualizarModoColumnaTablaCotizadorFase1_);
        bind("designerCotizadorTablaModoColumnaPropia","change",actualizarModoColumnaTablaCotizadorFase1_);
        bind("btnDesignerAgregarReglaCampo","click",agregarReglaCampoCotizadorFase1_);
        bind("btnDesignerAgregarReglaCampoCatalogo","click",agregarReglaCampoCatalogoCotizadorFase1_);
        bind("btnDesignerAgregarCampoCatalogoHijo","click",agregarCampoCatalogoHijoCotizadorFase1_);
        bind("btnDesignerAgregarOperandoCalculado","click",agregarOperandoCalculadoCotizadorFase1_);
        bind("designerCotizadorCalculadoOperacion","change",actualizarFormulaPreviewCalculadoCotizadorFase1_);
        bind("btnDesignerAgregarItemListaPrecios","click",guardarItemListaPreciosCotizadorFase1_);
        bind("btnDesignerCancelarEdicionItemListaPrecios","click",cancelarEdicionItemListaPreciosCotizadorFase1_);
        bind("btnDesignerNuevaReglaCotizador","click",nuevaReglaCotizadorFase1_);
        bind("btnDesignerGuardarRegla","click",guardarReglaCotizadorFase1_);
        bind("btnDesignerEliminarRegla","click",eliminarReglaCotizadorFase1_);
        bind("btnDesignerCancelarRegla","click",cancelarReglaCotizadorFase1_);
        bind("designerReglaOperador","change",actualizarVisibilidadCamposFormularioReglaFase1_);
        bind("designerReglaAccion","change",actualizarVisibilidadCamposFormularioReglaFase1_);
        bind("btnDesignerGuardarCotizador","click",function(){
          mostrarToast("Guarde cada sección o componente desde el panel de propiedades.");
        });
        bind("btnDesignerValidarCotizador","click",function(){
          const st = getCotizadorFase1State_();
          if(!window.CotizaApp || typeof window.CotizaApp.validarCotizador !== "function"){
            mostrarToast("No fue posible validar el cotizador.");
            return;
          }
          window.CotizaApp.validarCotizador(st.cotizadorId);
        });
        bind("btnDesignerPublicarCotizador","click",function(){
          const st = getCotizadorFase1State_();
          if(!window.CotizaApp || typeof window.CotizaApp.compilarCotizador !== "function"){
            mostrarToast("No fue posible publicar el cotizador.");
            return;
          }
          window.CotizaApp.compilarCotizador(st.cotizadorId);
        });
        const modal = byId("modalDesignerAplicabilidadSeccion");
        if(modal){
          modal.addEventListener("click",function(e){
            if(e.target && e.target.id === "modalDesignerAplicabilidadSeccion") cerrarAplicabilidadSeccionCotizadorFase1_();
          });
        }
      }

      function toggleDesignerPropsCotizadorFase1_(colapsar){
        const panel = byId("designerCotizadorProps");
        const ws = byId("designerCotizadorWorkspace");
        if(!panel || !ws) return;
        panel.classList.toggle("collapsed", !!colapsar);
        ws.classList.toggle("props-collapsed", !!colapsar);
        const st = getCotizadorFase1State_();
        st.propsCotizadorColapsadas = !!colapsar;
      }

      function inicializarCotizadorFase1(force){
        const st = getCotizadorFase1State_();
        if(st.cargado && !force){
          renderCotizadorFase1_();
          return;
        }
        if(byId("designerCotizadorTabsLista")) byId("designerCotizadorTabsLista").innerHTML = '<div class="designer-empty">Cargando secciones...</div>';
        cargarCotizadoresFase1_(function(){ cargarDatosCotizadorFase1_(true); cargarReglasCotizadorFase1_(); });
      }

          function cargarCotizadoresFase1_(done){
          console.log("[DEBUG] cargarCotizadoresFase1_ se está llamando");
          fetchAutenticado("/api/calculadoras").then(function(resp){
        console.log("[DEBUG] respuesta HTTP status:", resp.status);
        if(!resp.ok) throw new Error("HTTP " + resp.status);
        return resp.json();
        }).then(function(res){
        console.log("[DEBUG] JSON recibido:", res);
        const st = getCotizadorFase1State_();
        st.cotizadores = (res && res.calculadoras ? res.calculadoras : []).map(function(c){
          return { calculadora_id: c.calculadora_id, nombre: c.nombre_calculadora, nombre_calculadora: c.nombre_calculadora };
        });
        console.log("[DEBUG] st.cotizadores queda en:", st.cotizadores);
        renderCotizadoresSelectFase1_();
        if(done) done();
        }).catch(function(error){
        console.log("[DEBUG] ERROR atrapado:", error);
        const st = getCotizadorFase1State_();
        st.cotizadores = [];
        mostrarToast("No fue posible cargar los cotizadores: " + (error && error.message ? error.message : "error desconocido"));
        renderCotizadoresSelectFase1_();
        if(done) done();
        });
     }

      // Antes usaba runModuloParametrosFase1_ (mecanismo viejo de Apps
      // Script que google.script.run no resuelve más), y su onFail
      // dejaba st.catalogosDefinicion vacío en silencio — el selector
      // de "Campo con catálogo" salía vacío aunque el catálogo
      // existiera. Mismo patrón de arreglo que cargarCotizadoresFase1_:
      // llamar al endpoint real, y si falla, avisar con un toast y
      // dejar la lista vacía (nunca inventar catálogos de ejemplo).
      function cargarCatalogosDefinicionFase1_(done){
        fetchAutenticado("/api/catalogos/designer").then(function(resp){
          if(!resp.ok) throw new Error("HTTP " + resp.status);
          return resp.json();
        }).then(function(res){
          const st = getCotizadorFase1State_();
          st.catalogosDefinicion = (res && Array.isArray(res.catalogos)) ? res.catalogos : [];
          if(done) done();
        }).catch(function(error){
          const st = getCotizadorFase1State_();
          st.catalogosDefinicion = [];
          mostrarToast("No fue posible cargar los catálogos: " + (error && error.message ? error.message : "error desconocido"));
          if(done) done();
        });
      }

      // Mismo mecanismo viejo que catalogos_definicion, mismo arreglo:
      // /api/catalogos/designer?modo=valores_catalogo&catalogo_id=X ya
      // existe y ya lo usa el resto del Diseñador de Catálogos, pero
      // es por-catálogo — no hay un solo endpoint que traiga "todos los
      // valores de todos los catálogos" de una vez. Por eso primero se
      // pide la lista de catálogos activos y después se piden sus
      // valores en paralelo; si algún catálogo puntual falla, ese
      // catálogo queda sin valores (no rompe el resto), y solo si falla
      // la primera llamada (o todas) se avisa con un toast y se deja
      // la lista completa vacía — nunca datos inventados.
      function cargarValoresCatalogosFase1_(done){
        fetchAutenticado("/api/catalogos/designer").then(function(resp){
          if(!resp.ok) throw new Error("HTTP " + resp.status);
          return resp.json();
        }).then(function(res){
          const catalogos = (res && Array.isArray(res.catalogos)) ? res.catalogos : [];
          return Promise.all(catalogos.map(function(cat){
            const catalogoId = String(cat.catalogo_id || "").trim();
            if(!catalogoId) return [];
            return fetchAutenticado("/api/catalogos/designer?modo=valores_catalogo&catalogo_id=" + encodeURIComponent(catalogoId))
              .then(function(resp2){
                if(!resp2.ok) throw new Error("HTTP " + resp2.status);
                return resp2.json();
              }).then(function(res2){
                return (res2 && Array.isArray(res2.valores)) ? res2.valores : [];
              }).catch(function(){ return []; });
          }));
        }).then(function(listasPorCatalogo){
          const st = getCotizadorFase1State_();
          st.catalogoValores = [].concat.apply([], listasPorCatalogo);
          if(done) done();
        }).catch(function(error){
          const st = getCotizadorFase1State_();
          st.catalogoValores = [];
          mostrarToast("No fue posible cargar los valores de catálogo: " + (error && error.message ? error.message : "error desconocido"));
          if(done) done();
        });
      }

      // tabs_cotizador_relaciones, campos_modelo y reglas (asignada a un
      // campo puntual) usaban el mismo runModuloParametrosFase1_ muerto
      // que los dos de arriba, pero a diferencia de esos, acá NO hay un
      // endpoint real que alimente esto todavía — no es el mismo bug,
      // es funcionalidad que nunca se construyó:
      //  - tabs_cotizador_relaciones es "Aplicabilidad de sección" (qué
      //    tipos de servicio/oferta aplican a una sección del
      //    cotizador). No existe tabla ni endpoint para esto — la única
      //    tabla de relaciones del esquema es catalogo_relaciones
      //    (0001_init_schema.sql), y es un concepto distinto: padre-
      //    hijo entre VALORES de catálogo, no entre tabs y tipos.
      //  - reglas acá significa "qué reglas se le asignan a un campo
      //    puntual del cotizador" (reglas_cotizador). GET /api/reglas
      //    es el catálogo GLOBAL de reglas (ver el comentario al inicio
      //    de reglas.go: "cómo se aplican a un elemento del cotizador es
      //    reglas_cotizador, una tabla y sprint aparte") — no trae
      //    ninguna relación con un cotizador ni un campo. Además,
      //    "Agregar regla al campo" en este archivo nunca tuvo un POST
      //    detrás (campoReglasTemp es puramente local): poblar el
      //    selector con el catálogo global daría la falsa impresión de
      //    que ya se puede asignar y guardar, cuando no hay dónde
      //    guardarlo.
      //  - campos_modelo (consumida solo por
      //    getCampoModeloByIdCotizadorFase1_, que a su vez no tiene
      //    NINGÚN llamador en todo este archivo) quedó de un intento
      //    vestigial de Campo Calculado/Tabla referenciando "modelos de
      //    campo" — los tipos de campo complejos que CLAUDE.md
      //    documenta como fuera de alcance de este sprint.
      // Los tres quedan en lista vacía a propósito, con un aviso en vez
      // de romper o inventar datos — mismo criterio que arriba — hasta
      // que exista la funcionalidad real en un sprint futuro.
      function cargarPendientesDisenadorCotizadorFase1_(done){
        const st = getCotizadorFase1State_();
        st.relaciones = [];
        st.camposModelo = [];
        st.reglasModelo = [];
        mostrarToast("Aplicabilidad de secciones y reglas por campo: pendientes de un sprint futuro.");
        done(); done(); done();
      }

      // ---------------------------------------------------------
      // Reglas de este cotizador (reglas_cotizador, migración 0024):
      // condición sobre un campo -> acción sobre uno o más campos
      // objetivo, CRUD real contra /api/cotizador/reglas. Es la pieza
      // que el comentario de arriba (cargarPendientesDisenadorCotizadorFase1_)
      // documentaba como pendiente — sigue siendo un mecanismo DISTINTO
      // del catálogo global de reglas.go y del selector "Reglas"
      // vestigial de cada Campo (campoReglasTemp, sin guardado real
      // detrás, no tocado acá). Alcance a propósito simple: el campo
      // condición y los campos objetivo se eligen entre los elementos
      // de la SECCIÓN (tab) actualmente abierta en el Diseñador — el
      // backend permite cruzar secciones de la misma calculadora, pero
      // el selector no lo expone para no complicar esta pantalla.
      // ---------------------------------------------------------

      const OPERADORES_SIN_VALOR_COMPARACION_REGLA = {ESTA_VACIO:true, NO_ESTA_VACIO:true};
      const ACCIONES_SIN_CAMPOS_OBJETIVO_REGLA = {BLOQUEAR_GUARDADO:true};
      const ETIQUETAS_OPERADOR_REGLA = {
        IGUAL_A: "es igual a", DISTINTO_DE: "es distinto de", MAYOR_QUE: "es mayor que",
        MENOR_QUE: "es menor que", MAYOR_O_IGUAL_QUE: "es mayor o igual que",
        MENOR_O_IGUAL_QUE: "es menor o igual que", ESTA_VACIO: "está vacío", NO_ESTA_VACIO: "no está vacío"
      };
      const ETIQUETAS_ACCION_REGLA = {
        OCULTAR: "ocultar", MOSTRAR: "mostrar", DESHABILITAR: "deshabilitar", HABILITAR: "habilitar",
        PONER_EN_CERO: "poner en cero", EXIGIR_MINIMO: "exigir mínimo", CAMPO_REQUERIDO: "marcar requerido",
        BLOQUEAR_GUARDADO: "bloquear el guardado"
      };

      function cargarReglasCotizadorFase1_(){
        const st = getCotizadorFase1State_();
        const cont = byId("cotizadorReglasLista");
        if(!st.cotizadorId){
          st.reglasCotizador = [];
          if(cont) cont.innerHTML = '<div class="designer-empty">Seleccione un cotizador.</div>';
          return;
        }
        if(cont) cont.innerHTML = '<div class="designer-empty">Cargando reglas...</div>';
        fetchAutenticado("/api/cotizador/reglas?calculadora_id=" + encodeURIComponent(st.cotizadorId))
          .then(function(resp){
            if(!resp.ok) throw new Error("HTTP " + resp.status);
            return resp.json();
          })
          .then(function(res){
            st.reglasCotizador = (res && Array.isArray(res.reglas)) ? res.reglas : [];
            renderReglasCotizadorListaFase1_();
          })
          .catch(function(error){
            st.reglasCotizador = [];
            if(cont) cont.innerHTML = '<div class="designer-empty">No fue posible cargar las reglas.</div>';
            mostrarToast("No fue posible cargar las reglas del cotizador: " + (error && error.message ? error.message : "error desconocido"));
          });
      }

      function labelElementoPorIdReglaCotizadorFase1_(elementoId){
        const st = getCotizadorFase1State_();
        const el = (st.elementos || []).find(function(e){ return String(e.elemento_id || "") === String(elementoId || ""); });
        return el ? labelElementoCampoCotizadorFase1_(el) : String(elementoId || "");
      }

      function descripcionReglaCotizadorFase1_(r){
        const condicion = labelElementoPorIdReglaCotizadorFase1_(r.campo_condicion_id) + " " + (ETIQUETAS_OPERADOR_REGLA[r.operador] || r.operador) +
          (OPERADORES_SIN_VALOR_COMPARACION_REGLA[r.operador] ? "" : (' "' + (r.valor_comparacion || "") + '"'));
        const objetivos = (r.campos_objetivo || []).map(labelElementoPorIdReglaCotizadorFase1_).join(", ");
        const accion = ETIQUETAS_ACCION_REGLA[r.accion] || r.accion;
        return "Si " + condicion + " → " + accion + (objetivos ? " (" + objetivos + ")" : "");
      }

      function renderReglasCotizadorListaFase1_(){
        const st = getCotizadorFase1State_();
        const cont = byId("cotizadorReglasLista");
        if(!cont) return;
        if(!st.reglasCotizador.length){
          cont.innerHTML = '<div class="designer-empty">Este cotizador todavía no tiene reglas.</div>';
          return;
        }
        cont.innerHTML = st.reglasCotizador.map(function(r){
          return '<div class="cotizador-rule-card' + (r.activo ? '' : ' inactive') + '" data-regla-id="' + escapeHtml(r.regla_id) + '">' +
            '<div class="cotizador-rule-card-icon" aria-hidden="true">' + (r.accion === "BLOQUEAR_GUARDADO" ? "⛔" : "ƒ") + '</div>' +
            '<div class="cotizador-rule-card-main"><strong>' + escapeHtml(r.nombre || r.regla_id) + '</strong><small>' + escapeHtml(descripcionReglaCotizadorFase1_(r)) + '</small></div>' +
            '<div class="cotizador-rule-card-meta">' +
              '<span class="cotizador-rule-pill' + (r.activo ? ' info' : '') + '">' + (r.activo ? "Activa" : "Inactiva") + '</span>' +
              (r.accion === "BLOQUEAR_GUARDADO" || r.accion === "CAMPO_REQUERIDO" ? '<span class="cotizador-rule-pill block">Validación</span>' : '') +
              '<button type="button" class="btn btn-ghost btn-mini" data-editar-regla-cotizador="' + escapeHtml(r.regla_id) + '">Editar</button>' +
            '</div></div>';
        }).join("");
        cont.querySelectorAll("[data-editar-regla-cotizador]").forEach(function(btn){
          btn.addEventListener("click", function(){ seleccionarReglaCotizadorFase1_(btn.getAttribute("data-editar-regla-cotizador")); });
        });
      }

      function llenarSelectsReglaCotizadorFase1_(seleccionActual){
        const st = getCotizadorFase1State_();
        const elementos = (st.elementos || []).slice().sort(function(a,b){ return numeroOrdenCotizadorFase1_(a.orden)-numeroOrdenCotizadorFase1_(b.orden); });
        const condicionSel = byId("designerReglaCampoCondicion");
        if(condicionSel){
          condicionSel.innerHTML = '<option value="">Seleccione...</option>' + elementos.map(function(el){
            return '<option value="' + escapeHtml(el.elemento_id) + '">' + escapeHtml(labelElementoCampoCotizadorFase1_(el)) + '</option>';
          }).join("");
        }
        const objetivoSel = byId("designerReglaCamposObjetivo");
        if(objetivoSel){
          const seleccionados = (seleccionActual && seleccionActual.campos_objetivo) || [];
          objetivoSel.innerHTML = elementos.map(function(el){
            const sel = seleccionados.indexOf(el.elemento_id) >= 0 ? " selected" : "";
            return '<option value="' + escapeHtml(el.elemento_id) + '"' + sel + '>' + escapeHtml(labelElementoCampoCotizadorFase1_(el)) + '</option>';
          }).join("");
        }
      }

      function actualizarVisibilidadCamposFormularioReglaFase1_(){
        const operador = byId("designerReglaOperador") ? byId("designerReglaOperador").value : "";
        const accion = byId("designerReglaAccion") ? byId("designerReglaAccion").value : "";
        toggleHidden("designerReglaValorComparacionWrap", !!OPERADORES_SIN_VALOR_COMPARACION_REGLA[operador]);
        toggleHidden("designerReglaValorAccionWrap", accion !== "EXIGIR_MINIMO");
        toggleHidden("designerReglaCamposObjetivoWrap", !!ACCIONES_SIN_CAMPOS_OBJETIVO_REGLA[accion]);
      }

      function mostrarFormularioReglaCotizadorFase1_(mostrar){
        const form = byId("cotizadorReglaForm");
        if(form) form.classList.toggle("hidden", !mostrar);
      }

      function nuevaReglaCotizadorFase1_(){
        const st = getCotizadorFase1State_();
        if(!st.cotizadorId){ mostrarToast("Seleccione un cotizador."); return; }
        if(!st.tabId){ mostrarToast("Seleccione primero una sección: los campos disponibles salen de ahí."); return; }
        st.reglaCotizadorSeleccionadaId = "";
        if(byId("designerReglaIdOriginal")) byId("designerReglaIdOriginal").value = "";
        if(byId("designerReglaNombre")) byId("designerReglaNombre").value = "";
        if(byId("designerReglaOperador")) byId("designerReglaOperador").value = "IGUAL_A";
        if(byId("designerReglaValorComparacion")) byId("designerReglaValorComparacion").value = "";
        if(byId("designerReglaAccion")) byId("designerReglaAccion").value = "OCULTAR";
        if(byId("designerReglaValorAccion")) byId("designerReglaValorAccion").value = "";
        if(byId("designerReglaMensaje")) byId("designerReglaMensaje").value = "";
        if(byId("designerReglaActivo")) byId("designerReglaActivo").checked = true;
        llenarSelectsReglaCotizadorFase1_(null);
        actualizarVisibilidadCamposFormularioReglaFase1_();
        toggleHidden("btnDesignerEliminarRegla", true);
        mostrarFormularioReglaCotizadorFase1_(true);
      }

      function seleccionarReglaCotizadorFase1_(reglaId){
        const st = getCotizadorFase1State_();
        const r = st.reglasCotizador.find(function(x){ return String(x.regla_id) === String(reglaId); });
        if(!r) return;
        st.reglaCotizadorSeleccionadaId = r.regla_id;
        if(byId("designerReglaIdOriginal")) byId("designerReglaIdOriginal").value = r.regla_id;
        if(byId("designerReglaNombre")) byId("designerReglaNombre").value = r.nombre || "";
        llenarSelectsReglaCotizadorFase1_(r);
        if(byId("designerReglaCampoCondicion")) byId("designerReglaCampoCondicion").value = r.campo_condicion_id || "";
        if(byId("designerReglaOperador")) byId("designerReglaOperador").value = r.operador || "IGUAL_A";
        if(byId("designerReglaValorComparacion")) byId("designerReglaValorComparacion").value = r.valor_comparacion || "";
        if(byId("designerReglaAccion")) byId("designerReglaAccion").value = r.accion || "OCULTAR";
        if(byId("designerReglaValorAccion")) byId("designerReglaValorAccion").value = r.valor_accion || "";
        if(byId("designerReglaMensaje")) byId("designerReglaMensaje").value = r.mensaje || "";
        if(byId("designerReglaActivo")) byId("designerReglaActivo").checked = !!r.activo;
        actualizarVisibilidadCamposFormularioReglaFase1_();
        toggleHidden("btnDesignerEliminarRegla", false);
        mostrarFormularioReglaCotizadorFase1_(true);
        renderReglasCotizadorListaFase1_();
      }

      function cancelarReglaCotizadorFase1_(){
        getCotizadorFase1State_().reglaCotizadorSeleccionadaId = "";
        mostrarFormularioReglaCotizadorFase1_(false);
      }

      function valoresSeleccionadosMultiSelectFase1_(select){
        if(!select) return [];
        return Array.prototype.slice.call(select.selectedOptions || []).map(function(opt){ return opt.value; });
      }

      function guardarReglaCotizadorFase1_(){
        const st = getCotizadorFase1State_();
        const idOriginal = byId("designerReglaIdOriginal") ? byId("designerReglaIdOriginal").value.trim() : "";
        const campoCondicion = byId("designerReglaCampoCondicion") ? byId("designerReglaCampoCondicion").value : "";
        const operador = byId("designerReglaOperador") ? byId("designerReglaOperador").value : "";
        const accion = byId("designerReglaAccion") ? byId("designerReglaAccion").value : "";
        if(!campoCondicion){ mostrarToast("Debe elegir el campo condición."); return; }
        const valorComparacion = byId("designerReglaValorComparacion") ? byId("designerReglaValorComparacion").value.trim() : "";
        if(!OPERADORES_SIN_VALOR_COMPARACION_REGLA[operador] && !valorComparacion){ mostrarToast("Debe indicar el valor de comparación."); return; }
        const camposObjetivo = ACCIONES_SIN_CAMPOS_OBJETIVO_REGLA[accion] ? [] : valoresSeleccionadosMultiSelectFase1_(byId("designerReglaCamposObjetivo"));
        if(!ACCIONES_SIN_CAMPOS_OBJETIVO_REGLA[accion] && !camposObjetivo.length){ mostrarToast("Debe elegir al menos un campo objetivo."); return; }
        const valorAccion = byId("designerReglaValorAccion") ? byId("designerReglaValorAccion").value.trim() : "";
        if(accion === "EXIGIR_MINIMO" && !valorAccion){ mostrarToast("Debe indicar el valor mínimo."); return; }

        const reglaId = idOriginal || ("RC-" + st.cotizadorId + "-" + Date.now().toString(36).toUpperCase());
        const payload = {
          regla_id: reglaId, calculadora_id: st.cotizadorId,
          nombre: byId("designerReglaNombre") ? byId("designerReglaNombre").value.trim() : "",
          campo_condicion_id: campoCondicion, operador: operador, valor_comparacion: valorComparacion,
          accion: accion, campos_objetivo: camposObjetivo, valor_accion: valorAccion,
          mensaje: byId("designerReglaMensaje") ? byId("designerReglaMensaje").value.trim() : "",
          activo: byId("designerReglaActivo") ? byId("designerReglaActivo").checked : true
        };

        fetchAutenticado("/api/cotizador/reglas", {
          method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(payload)
        }).then(function(resp){
          return resp.json().catch(function(){ return null; }).then(function(res){ return {resp:resp, res:res}; });
        }).then(function(pair){
          if(!pair.resp.ok || !pair.res || !pair.res.ok){
            throw new Error((pair.res && pair.res.error) || "No fue posible guardar la regla.");
          }
          mostrarToast(pair.res.mensaje || "Regla guardada.");
          mostrarFormularioReglaCotizadorFase1_(false);
          cargarReglasCotizadorFase1_();
        }).catch(function(error){
          mostrarToast(error && error.message ? error.message : "No fue posible guardar la regla.");
        });
      }

      function eliminarReglaCotizadorFase1_(){
        const st = getCotizadorFase1State_();
        const reglaId = st.reglaCotizadorSeleccionadaId;
        if(!reglaId) return;
        if(!window.confirm('¿Eliminar la regla "' + reglaId + '"? Esta acción no se puede deshacer.')) return;
        fetchAutenticado("/api/cotizador/reglas/" + encodeURIComponent(reglaId), {method:"DELETE"})
          .then(function(resp){ return resp.json().catch(function(){ return null; }).then(function(res){ return {resp:resp, res:res}; }); })
          .then(function(pair){
            if(!pair.resp.ok || !pair.res || !pair.res.ok) throw new Error((pair.res && pair.res.error) || "No fue posible eliminar la regla.");
            mostrarToast(pair.res.mensaje || "Regla eliminada.");
            mostrarFormularioReglaCotizadorFase1_(false);
            cargarReglasCotizadorFase1_();
          }).catch(function(error){
            mostrarToast(error && error.message ? error.message : "No fue posible eliminar la regla.");
          });
      }

      function renderCotizadoresSelectFase1_(){
        const st = getCotizadorFase1State_();
        const sel = byId("designerCotizadorActualFiltro");
        if(!sel) return;
        sel.innerHTML = "";
        st.cotizadores.forEach(function(c, idx){
          const id = String(c.cotizador_id || c.calculadora_id || c.id || c.codigo || "").trim().toUpperCase();
          const nombre = String(c.nombre_calculadora || c.nombre_cotizador || c.nombre || c.label || id || "Cotizador").trim();
          if(!id) return;
          const opt = document.createElement("option");
          opt.value = id;
          opt.textContent = nombre;
          sel.appendChild(opt);
          if(!st.cotizadorId && idx === 0) st.cotizadorId = id;
        });
        if(st.cotizadorId) sel.value = st.cotizadorId;
        if(!sel.value && sel.options.length){ st.cotizadorId = sel.options[0].value; sel.value = st.cotizadorId; }
        actualizarEstadoDesdeCotizadorSeleccionadoFase1_();
      }

      function actualizarEstadoDesdeCotizadorSeleccionadoFase1_(){
        const st = getCotizadorFase1State_();
        const cotizadorId = String(st.cotizadorId || (byId("designerCotizadorActualFiltro") ? byId("designerCotizadorActualFiltro").value : "")).trim().toUpperCase();
        const c = (st.cotizadores || []).find(function(x){
          return String(x.cotizador_id || x.calculadora_id || x.id || x.codigo || "").trim().toUpperCase() === cotizadorId;
        }) || {};
        const estado = String(c.estado || c.estado_configuracion || c.status || "Borrador").trim() || "Borrador";
        const version = String(c.version_actual || c.ultima_version || c.version || c.version_configuracion || "Sin publicar").trim() || "Sin publicar";
        const validacion = String(c.validacion || c.estado_validacion || c.resultado_validacion || "Pendiente").trim() || "Pendiente";
        actualizarEstadoCotizadorDesigner(estado, version, validacion);
      }

      function cargarDatosCotizadorFase1_(force){
        const st = getCotizadorFase1State_();
        st.cotizadorId = String(st.cotizadorId || (byId("designerCotizadorActualFiltro") ? byId("designerCotizadorActualFiltro").value : "")).trim().toUpperCase();
        if(!st.cotizadorId){ renderCotizadorFase1_(); return; }
        let pendientes = 7;
        function done(){ pendientes--; if(pendientes<=0){ st.cargado=true; renderCotizadorFase1_(); } }
        function fail(err){ mostrarToast("No se pudo cargar una parte del cotizador: " + ((err && err.message) || err || "Error")); done(); }
        listarTabsCotizadorApiFase1_({calculadora_id:st.cotizadorId}, function(res){
          st.tabs = rowsFromRespuestaFase1_(res);
          const tabs = tabsActivosCotizadorFase1_();
          if(!st.tabId || !tabs.some(function(tab){ return String(tab.tab_id || "").trim().toUpperCase() === st.tabId; })){
            st.tabId = tabs.length ? String(tabs[0].tab_id || "").trim().toUpperCase() : "";
          }
          done();
          if(!st.tabId){ st.elementos = []; done(); return; }
          listarElementosCotizadorApiFase1_(st.tabId, function(elementosRes){
            st.elementos = rowsFromRespuestaFase1_(elementosRes).map(normalizarElementoCotizadorFase1_);
            done();
          }, function(err){ st.elementos = []; fail(err); });
        }, fail);
        cargarValoresCatalogosFase1_(done);
        cargarCatalogosDefinicionFase1_(done);
        cargarPendientesDisenadorCotizadorFase1_(done);
      }

      function renderCotizadorFase1_(){
        renderCotizadoresSelectFase1_();
        llenarSelectCamposYReglasCotizadorFase1_();
        renderTabsCotizadorFase1_();
        renderComponentesCotizadorFase1_();
        actualizarPropiedadesPorTipoComponenteCotizadorFase1_();
        cargarResumenAplicabilidadSeccionCotizadorFase1_();
      }

      function normalizarActivoCotizadorFase1_(v){ return v === true || String(v || "").trim().toUpperCase() === "SI" || String(v || "").trim().toUpperCase() === "TRUE" || String(v || "").trim().toUpperCase() === "ACTIVO" || String(v || "").trim() === "1"; }
      function numeroOrdenCotizadorFase1_(v){ const n = Number(v); return isNaN(n) ? 9999 : n; }
      function alcanceTabCotizadorFase1_(tab){
        const alcance = String((tab && (tab.alcance || tab.tipo_alcance || tab.reutilizacion)) || "PROPIO").trim().toUpperCase();
        return alcance === "REUTILIZABLE" ? "REUTILIZABLE" : "PROPIO";
      }
      function tabAplicaACotizadorFase1_(tab){
        const st = getCotizadorFase1State_();
        const cot = String((tab && (tab.cotizador_id || tab.calculadora_id)) || "").trim().toUpperCase();
        return tab && (tab.es_propia === false || tab.solo_lectura === true || !cot || cot === st.cotizadorId);
      }

      function tabsActivosCotizadorFase1_(){
        const st = getCotizadorFase1State_();
        return (st.tabs || []).filter(function(t){
          return tabAplicaACotizadorFase1_(t) && normalizarActivoCotizadorFase1_(t.activo);
        }).sort(function(a,b){ return numeroOrdenCotizadorFase1_(a.orden) - numeroOrdenCotizadorFase1_(b.orden); });
      }

      function renderTabsCotizadorFase1_(){
        const st = getCotizadorFase1State_();
        const cont = byId("designerCotizadorTabsLista");
        if(!cont) return;
        const q = normalizarTextoBusquedaParam_(byId("designerBuscarEstructuraCotizador") ? byId("designerBuscarEstructuraCotizador").value || "" : "");
        const tabs = tabsActivosCotizadorFase1_().filter(function(t){
          if(!q) return true;
          return normalizarTextoBusquedaParam_([t.tab_id,t.nombre_tab,t.descripcion].join(" ")).indexOf(q)>=0;
        });
        if(!tabs.length){
          cont.innerHTML = '<div class="designer-empty">No hay secciones para este cotizador. Use + Sección.</div>';
          st.tabId = "";
          renderComponentesCotizadorFase1_();
          limpiarPropsSeccionCotizadorFase1_();
          return;
        }
        if(!st.tabId || !tabs.some(function(t){ return String(t.tab_id).toUpperCase() === st.tabId; })){
          st.tabId = String(tabs[0].tab_id || "").trim().toUpperCase();
        }
        cont.innerHTML = tabs.map(function(t, idx){
          const id = String(t.tab_id || "").trim().toUpperCase();
          const nombre = String(t.nombre_tab || id).trim();
          const desc = String(t.descripcion || "").trim();
          const alcance = alcanceTabCotizadorFase1_(t);
          const asociada = t.es_propia === false || t.solo_lectura === true;
          const active = id === st.tabId ? " active selected" : "";
          const alcanceTxt = asociada ? "Asociada" : (alcance === "REUTILIZABLE" ? "Reutilizable" : "Propio");
          const origen = asociada ? String(t.calculadora_origen_id || t.calculadora_id || "").trim() : "";
          const quitar = asociada && t.elemento_asociacion_id ? '<span class="cotizador-associated-remove" role="button" tabindex="0" data-desasociar-tab="'+escapeHtml(id)+'" data-desasociar-elemento="'+escapeHtml(t.elemento_asociacion_id)+'">Quitar</span>' : '';
          return '<button class="cotizador-tree-item'+active+(asociada?' is-associated':'')+'" type="button" data-tab-id="'+escapeHtml(id)+'">'
            + '<span class="cotizador-tree-dot">'+escapeHtml(String(numeroOrdenCotizadorFase1_(t.orden) === 9999 ? idx+1 : t.orden))+'</span>'
            + '<div class="cotizador-tree-main"><strong>'+escapeHtml(nombre)+'</strong><small>'+escapeHtml(asociada ? ("Desde "+origen+(desc?" · "+desc:"")) : (desc || id))+'</small></div>'
            + '<span class="cotizador-tree-actions">'+escapeHtml(alcanceTxt)+quitar+'</span></button>';
        }).join("");
        cont.querySelectorAll("[data-tab-id]").forEach(function(btn){
          btn.addEventListener("click",function(){ seleccionarTabCotizadorFase1_(btn.getAttribute("data-tab-id")); });
        });
        cont.querySelectorAll("[data-desasociar-tab]").forEach(function(btn){
          btn.addEventListener("click",function(e){ e.preventDefault(); e.stopPropagation(); desasociarTabCotizadorFase1_(btn.getAttribute("data-desasociar-elemento"),btn.getAttribute("data-desasociar-tab")); });
        });
        cargarPropsSeccionCotizadorFase1_();
      }

      function getTabActualCotizadorFase1_(){
        const st = getCotizadorFase1State_();
        return (st.tabs || []).find(function(t){ return String(t.tab_id || "").trim().toUpperCase() === st.tabId; }) || null;
      }

      function tabSoloLecturaCotizadorFase1_(tab){
        tab = tab || getTabActualCotizadorFase1_();
        return !!(tab && (tab.es_propia === false || tab.solo_lectura === true));
      }

      function desasociarTabCotizadorFase1_(elementoId, tabId){
        if(!elementoId || !tabId) return;
        if(!window.confirm("¿Quitar esta sección asociada? La sección original y su contenido no se eliminarán.")) return;
        fetchAutenticado("/api/cotizador/elementos/"+encodeURIComponent(elementoId)+"/secciones/"+encodeURIComponent(tabId), {method:"DELETE",headers:{"Accept":"application/json"}})
          .then(function(resp){ return resp.json().then(function(data){ if(!resp.ok||!data.ok) throw new Error(data.error||"No se pudo quitar la sección."); return data; }); })
          .then(function(){ const st=getCotizadorFase1State_(); st.tabId=""; st.elementoId=""; mostrarToast("Sección desasociada. La original permanece intacta."); cargarDatosCotizadorFase1_(true); })
          .catch(function(err){ mostrarToast((err&&err.message)||"No se pudo quitar la sección."); });
      }

      function seleccionarTabCotizadorFase1_(tabId){
        const st = getCotizadorFase1State_();
        st.tabId = String(tabId || "").trim().toUpperCase();
        st.elementoId = "";
        st.elementos = [];
        const tabSeleccionada = getTabActualCotizadorFase1_();
        if(tabSeleccionada && (tabSeleccionada.es_propia === false || tabSeleccionada.solo_lectura === true)) st.modoVista = "preview";
        renderTabsCotizadorFase1_();
        renderComponentesCotizadorFase1_();
        listarElementosCotizadorApiFase1_(st.tabId, function(res){
          st.elementos = rowsFromRespuestaFase1_(res).map(normalizarElementoCotizadorFase1_);
          renderComponentesCotizadorFase1_();
        }, function(err){ mostrarToast("No se pudieron cargar los elementos: " + ((err && err.message) || err)); });
        mostrarPropsSeccionCotizadorFase1_();
      }

      function normalizarElementoCotizadorFase1_(elemento){
        elemento = elemento || {};
        const cfg = parseConfigElementoCotizadorFase1_(elemento.configuracion || elemento.config_json);
        elemento.tipo_elemento = elemento.tipo_elemento || elemento.tipo;
        elemento.config_json = cfg;
        elemento.nombre_elemento = elemento.nombre_elemento || cfg.nombre_elemento || "";
        elemento.descripcion = elemento.descripcion || cfg.descripcion || "";
        if(!elemento.catalogo_id && cfg.catalogo_id) elemento.catalogo_id = cfg.catalogo_id;
        return elemento;
      }

      function elementosDeTabCotizadorFase1_(){
        const st = getCotizadorFase1State_();
        return (st.elementos || []).filter(function(e){
          return String(e.tab_id || "").trim().toUpperCase() === st.tabId && normalizarActivoCotizadorFase1_(e.activo);
        }).sort(function(a,b){ return numeroOrdenCotizadorFase1_(a.orden) - numeroOrdenCotizadorFase1_(b.orden); });
      }

      function setModoVistaCotizadorFase1_(modo){
        const st = getCotizadorFase1State_();
        if(modo !== "preview" && tabSoloLecturaCotizadorFase1_()){
          mostrarToast("La sección asociada es de solo lectura. Edítela desde su cotizador de origen.");
          modo = "preview";
        }
        st.modoVista = modo === "preview" ? "preview" : "diseno";
        actualizarBotonesModoVistaCotizadorFase1_();
        renderComponentesCotizadorFase1_();
      }

      function actualizarBotonesModoVistaCotizadorFase1_(){
        const st = getCotizadorFase1State_();
        const soloLectura = tabSoloLecturaCotizadorFase1_();
        const esPreview = st.modoVista === "preview" || soloLectura;
        if(soloLectura) st.modoVista = "preview";
        if(byId("btnDesignerModoDisenoCotizador")) byId("btnDesignerModoDisenoCotizador").classList.toggle("active", !esPreview);
        if(byId("btnDesignerModoDisenoCotizador")) byId("btnDesignerModoDisenoCotizador").disabled = soloLectura;
        if(byId("btnDesignerModoPreviewCotizador")) byId("btnDesignerModoPreviewCotizador").classList.toggle("active", esPreview);
        if(byId("btnDesignerNuevoComponenteCotizador")){
          byId("btnDesignerNuevoComponenteCotizador").classList.toggle("hidden", esPreview);
          byId("btnDesignerNuevoComponenteCotizador").disabled = esPreview || soloLectura || !getTabActualCotizadorFase1_();
        }
      }

      function renderComponentesCotizadorFase1_(){
        const st = getCotizadorFase1State_();
        const cont = byId("designerCotizadorComponentesLista");
        const tab = getTabActualCotizadorFase1_();
        actualizarBotonesModoVistaCotizadorFase1_();
        if(byId("designerCotizadorCanvasTitulo")) byId("designerCotizadorCanvasTitulo").textContent = tab ? ((st.modoVista === "preview" ? "Vista previa: " : "Componentes: ") + (tab.nombre_tab || tab.tab_id)) : "Componentes de la sección";
        if(byId("designerCotizadorCanvasSubtitulo")) byId("designerCotizadorCanvasSubtitulo").textContent = tab ? (st.modoVista === "preview" ? "Representación visual de la sección según los componentes configurados." : (tab.descripcion || "Agregue componentes visuales básicos a esta sección.")) : "Seleccione o cree una sección.";
        if(!cont) return;
        if(!tab){
          cont.innerHTML = '<div class="designer-empty">Seleccione una sección para cargar sus componentes.</div>';
          return;
        }
        const els = elementosDeTabCotizadorFase1_();
        llenarComponentePadreOptionsCotizadorFase1_(els);
        if(st.modoVista === "preview"){
          renderVistaPreviaCotizadorFase1_(cont, tab, els);
          return;
        }
        if(!els.length){
          cont.innerHTML = '<div class="designer-empty">Esta sección no tiene componentes. Use + Nuevo componente.</div>';
          return;
        }
        cont.innerHTML = renderComponentesDisenoAgrupadosCotizadorFase1_(els);
        cont.querySelectorAll("[data-elemento-id]").forEach(function(btn){
          btn.addEventListener("click",function(e){
            if(tabSoloLecturaCotizadorFase1_()) return;
            e.stopPropagation();
            seleccionarComponenteCotizadorFase1_(btn.getAttribute("data-elemento-id"));
          });
        });
      }

      function renderComponentesDisenoAgrupadosCotizadorFase1_(els){
        const hijosPorPadre = {};
        const ids = {};
        (els || []).forEach(function(e){
          const id = String(e.elemento_id || "").trim();
          if(id) ids[id] = true;
        });
        (els || []).forEach(function(e){
          const padre = String(e.componente_padre_id || "").trim();
          if(padre){
            hijosPorPadre[padre] = hijosPorPadre[padre] || [];
            hijosPorPadre[padre].push(e);
          }
        });
        Object.keys(hijosPorPadre).forEach(function(k){
          hijosPorPadre[k].sort(function(a,b){ return numeroOrdenCotizadorFase1_(a.orden)-numeroOrdenCotizadorFase1_(b.orden); });
        });
        const top = (els || []).filter(function(e){
          const padre = String(e.componente_padre_id || "").trim();
          return !padre || !ids[padre];
        });
        return top.map(function(e){ return renderComponenteDisenoCotizadorFase1_(e, hijosPorPadre, 0); }).join("");
      }

      function renderComponenteDisenoCotizadorFase1_(e, hijosPorPadre, nivel){
        const id = String(e.elemento_id || "").trim();
        const tipo = String(e.tipo_elemento || "CAMPO").trim().toUpperCase();
        const etiqueta = String(e.etiqueta || e.label_visible || e.nombre_elemento || id).trim();
        const desc = String(e.descripcion || "").trim();
        const hijos = hijosPorPadre[id] || [];
        if(tipo === "CONTENEDOR" || tipo === "OPCIONES_PROPUESTA"){
          const hijosHtml = hijos.length
            ? hijos.map(function(h){ return renderComponenteDisenoCotizadorFase1_(h, hijosPorPadre, nivel + 1); }).join("")
            : '<div class="cotizador-container-empty">'+(tipo === "OPCIONES_PROPUESTA" ? "Opciones de Propuesta sin campos asignados." : "Contenedor sin campos asignados.")+'</div>';
          return '<div class="cotizador-design-container'+(tipo === "OPCIONES_PROPUESTA" ? " cotizador-design-scenario" : "")+'" data-container-id="'+escapeHtml(id)+'">'
            + renderTarjetaComponenteDisenoCotizadorFase1_(e, nivel, true)
            + '<div class="cotizador-design-container-children">'+hijosHtml+'</div>'
            + '</div>';
        }
        return renderTarjetaComponenteDisenoCotizadorFase1_(e, nivel, false);
      }

      function renderTarjetaComponenteDisenoCotizadorFase1_(e, nivel, esContenedor){
        const st = getCotizadorFase1State_();
        const id = String(e.elemento_id || "").trim();
        const tipo = String(e.tipo_elemento || "CAMPO").trim().toUpperCase();
        const etiqueta = String(e.etiqueta || e.label_visible || e.nombre_elemento || id).trim();
        const desc = String(e.descripcion || "").trim();
        const selected = id && id === st.elementoId ? " selected" : "";
        const extraClass = esContenedor ? " cotizador-container-head-card" : (nivel > 0 ? " cotizador-child-card" : "");
        const ayuda = desc ? " · " + desc : "";
        return '<div class="cotizador-component-card'+selected+extraClass+'" role="button" tabindex="0" data-elemento-id="'+escapeHtml(id)+'" data-tipo="'+escapeHtml(tipo)+'">'
          + '<div class="cotizador-component-icon">'+escapeHtml(iconoComponenteCotizadorFase1_(tipo))+'</div>'
          + '<div class="cotizador-component-main"><strong>'+escapeHtml(etiqueta || tipo)+'</strong><small>'+escapeHtml(tipo + ayuda)+'</small></div>'
          + '<div class="cotizador-component-actions"><span class="cotizador-component-meta">Orden '+escapeHtml(String(e.orden || ""))+'</span></div>'
          + '</div>';
      }

      function renderVistaPreviaCotizadorFase1_(cont, tab, els){
        if(!els || !els.length){
          cont.innerHTML = '<div class="cotizador-preview-empty">Esta sección no tiene componentes para mostrar en vista previa.</div>';
          return;
        }
        const hijosPorPadre = {};
        els.forEach(function(e){
          const padre = String(e.componente_padre_id || "").trim();
          if(padre){
            hijosPorPadre[padre] = hijosPorPadre[padre] || [];
            hijosPorPadre[padre].push(e);
          }
        });
        Object.keys(hijosPorPadre).forEach(function(k){
          hijosPorPadre[k].sort(function(a,b){ return numeroOrdenCotizadorFase1_(a.orden)-numeroOrdenCotizadorFase1_(b.orden); });
        });
        const top = els.filter(function(e){ return !String(e.componente_padre_id || "").trim(); });
        const html = top.map(function(e){ return renderComponentePreviewCotizadorFase1_(e, hijosPorPadre); }).join("");
        cont.innerHTML = '<div class="cotizador-preview-wrap"><div class="cotizador-preview-section">'+(html || '<div class="cotizador-preview-empty">No hay componentes principales para mostrar.</div>')+'</div></div>';
      }

      function renderComponentePreviewCotizadorFase1_(e, hijosPorPadre){
        const id = String(e.elemento_id || "").trim();
        const tipo = String(e.tipo_elemento || "CAMPO").trim().toUpperCase();
        const etiqueta = String(e.etiqueta || e.label_visible || e.nombre_elemento || id || tipo).trim();
        const desc = String(e.descripcion || "").trim();
        const cfg = parseConfigElementoCotizadorFase1_(e.config_json);
        if(tipo === "TEXTO_INFORMATIVO") return '<div class="cotizador-preview-legend"><strong>'+escapeHtml(etiqueta)+'</strong>'+(desc ? '<div>'+escapeHtml(desc)+'</div>' : '')+'</div>';
        if(tipo === "TITULO") return renderTituloPreviewCotizadorFase1_(etiqueta, cfg);
        if(tipo === "LEYENDA") return renderLeyendaPreviewCotizadorFase1_(etiqueta, desc, cfg);
        if(tipo === "CONTENEDOR") return renderContenedorPreviewCotizadorFase1_(e, hijosPorPadre, cfg, etiqueta, desc);
        if(tipo === "OPCIONES_PROPUESTA") return renderOpcionesPropuestaPreviewCotizadorFase1_(e, hijosPorPadre, cfg, etiqueta, desc);
        if(tipo === "SECCIONES_ADICIONALES") return renderSeccionesAdicionalesPreviewCotizadorFase1_(cfg, etiqueta, desc);
        if(tipo === "TABLA") return renderTablaPreviewCotizadorFase1_(e, cfg, etiqueta, desc);
        if(tipo === "CAMPO_CATALOGO") return renderCampoCatalogoPreviewCotizadorFase1_(e, cfg, etiqueta, desc);
        if(tipo === "CAJA_VALOR") return renderCajaValorPreviewCotizadorFase1_(e, cfg, etiqueta);
        if(tipo === "CAMPO_CALCULADO") return renderCampoCalculadoPreviewCotizadorFase1_(e, cfg, etiqueta);
        if(tipo === "LISTA_PRECIOS") return renderListaPreciosPreviewCotizadorFase1_(e, cfg, etiqueta, desc);
        return renderCampoPreviewCotizadorFase1_(e, cfg, etiqueta, desc);
      }

      function renderListaPreciosPreviewCotizadorFase1_(e, cfg, etiqueta, desc){
        const items = (Array.isArray(e.items) ? e.items : []).filter(function(it){ return normalizarActivoCotizadorFase1_(it.activo); });
        const tipoLista = String((cfg && cfg.tipo_lista_precios) || "UNICA").toUpperCase();
        if(tipoLista === "MULTIPLE"){
          return '<div class="cotizador-preview-field"><label>'+escapeHtml(etiqueta)+'</label>'
            + '<div class="cotizador-preview-caja-valor">Tabla de ítems (Múltiple) — '+items.length+' ítem(s) disponible(s)</div>'
            + (desc ? '<small>'+escapeHtml(desc)+'</small>' : '')+'</div>';
        }
        let control = '<select disabled><option>Seleccione...</option>';
        items.slice(0,8).forEach(function(it){ control += '<option>'+escapeHtml(it.nombre || it.codigo || "Ítem")+'</option>'; });
        control += '</select>';
        return '<div class="cotizador-preview-field"><label>'+escapeHtml(etiqueta)+'</label>'+control+(desc ? '<small>'+escapeHtml(desc)+'</small>' : '')+'</div>';
      }

      function renderTituloPreviewCotizadorFase1_(texto, cfg){
        const nivel = String((cfg && cfg.nivel) || "h3").toLowerCase();
        const tag = ["h2","h3","h4"].indexOf(nivel)>=0 ? nivel : "h3";
        return '<'+tag+' class="cotizador-preview-title">'+escapeHtml(texto)+'</'+tag+'>';
      }

      function renderLeyendaPreviewCotizadorFase1_(texto, desc, cfg){
        const tipo = String((cfg && (cfg.tipo_leyenda || cfg.tipo)) || "INFO").toUpperCase();
        const cls = tipo === "ADVERTENCIA" || tipo === "WARN" ? " warn" : "";
        return '<div class="cotizador-preview-legend'+cls+'"><strong>'+escapeHtml(texto)+'</strong>'+(desc ? '<div>'+escapeHtml(desc)+'</div>' : '')+'</div>';
      }

      function renderContenedorPreviewCotizadorFase1_(e, hijosPorPadre, cfg, etiqueta, desc){
        const id = String(e.elemento_id || "").trim();
        const hijos = hijosPorPadre[id] || [];
        const cols = Math.max(1, Math.min(3, Number(cfg.columnas || 2) || 2));
        const cls = cols === 3 ? " cols-3" : cols === 2 ? " cols-2" : "";
        const cuerpo = hijos.length ? hijos.map(function(h){ return renderComponentePreviewCotizadorFase1_(h, hijosPorPadre); }).join("") : '<div class="cotizador-preview-empty">Contenedor sin campos asignados.</div>';
        return '<div class="cotizador-preview-container"><div class="cotizador-preview-container-head"><strong>'+escapeHtml(etiqueta)+'</strong>'+(desc ? '<span>'+escapeHtml(desc)+'</span>' : '')+'</div><div class="cotizador-preview-grid'+cls+'">'+cuerpo+'</div></div>';
      }

      function renderOpcionesPropuestaPreviewCotizadorFase1_(e, hijosPorPadre, cfg, etiqueta, desc){
        const id = String(e.elemento_id || "").trim();
        const hijos = hijosPorPadre[id] || [];
        const cantidad = Math.max(1, Number(cfg.cantidad_inicial || 1) || 1);
        const sugeridos = String(cfg.nombres_sugeridos || "").split(",").map(function(n){ return n.trim(); }).filter(Boolean);
        const nombres = [];
        for(let i=0;i<cantidad;i++) nombres.push(sugeridos[i] || ("Opción " + (i+1)));
        const tabs = nombres.map(function(nombre,idx){
          return '<button type="button" class="cotizador-preview-scenario-tab'+(idx===0?' active':'')+'" disabled>'+escapeHtml(nombre)+'</button>';
        }).join("");
        const cuerpo = hijos.map(function(h){ return renderComponentePreviewCotizadorFase1_(h,hijosPorPadre); }).join("");
        return '<div class="cotizador-preview-scenarios">'
          + '<div class="cotizador-preview-scenarios-head"><div class="cotizador-preview-scenarios-title"><strong>'+escapeHtml(etiqueta)+'</strong>'+(desc?'<span>'+escapeHtml(desc)+'</span>':'')+'</div></div>'
          + '<div class="cotizador-preview-scenario-tabs">'+tabs+'</div>'
          + '<div class="cotizador-preview-scenario-body">'+(cuerpo||'<div class="cotizador-preview-empty">Agregue componentes hijos para completar cada opción.</div>')+'</div>'
          + '</div>';
      }

      function renderSeccionesAdicionalesPreviewCotizadorFase1_(cfg, etiqueta, desc){
        const st = getCotizadorFase1State_();
        const seleccionadas = (st.seccionesReutilizables||[]).filter(function(s){ return s.asociada; });
        const items = seleccionadas.map(function(s){ return '<span class="cotizador-preview-scenario-tab active">'+escapeHtml(s.nombre||s.tab_id)+'</span>'; }).join("");
        return '<div class="cotizador-preview-container"><div class="cotizador-preview-container-head"><strong>'+escapeHtml(etiqueta)+'</strong>'+(desc?'<span>'+escapeHtml(desc)+'</span>':'')+'</div>'
          +'<div class="cotizador-preview-scenario-tabs">'+(items||'<span class="cotizador-preview-empty">Sin secciones reutilizables seleccionadas.</span>')+'</div></div>';
      }

      function renderCampoPreviewCotizadorFase1_(e, cfg, etiqueta, desc){
        const tipoCampo = String((cfg && cfg.tipo_campo) || "TEXTO").toUpperCase();
        let control = '<input type="text" disabled placeholder="'+escapeHtml((cfg && cfg.valor_defecto) || '')+'">';
        if(tipoCampo === "TEXTO_LARGO" || tipoCampo === "TEXTAREA") control = '<textarea disabled rows="3"></textarea>';
        else if(tipoCampo === "NUMERO" || tipoCampo === "MONEDA" || tipoCampo === "PORCENTAJE") control = '<input type="number" disabled>';
        else if(tipoCampo === "FECHA") control = '<input type="date" disabled>';
        else if(tipoCampo === "CHECK" || tipoCampo === "SI_NO" || tipoCampo === "BOOLEAN") control = '<label style="font-weight:400;"><input type="checkbox" disabled> Sí / No</label>';
        else if(tipoCampo === "CORREO") control = '<input type="email" disabled placeholder="correo@empresa.com">';
        else if(tipoCampo === "TELEFONO") control = '<input type="tel" disabled placeholder="Teléfono">';
        else if(tipoCampo === "URL") control = '<input type="url" disabled placeholder="https://">';
        return '<div class="cotizador-preview-field"><label>'+escapeHtml(etiqueta)+'</label>'+control+(desc ? '<small>'+escapeHtml(desc)+'</small>' : '')+'</div>';
      }

      function renderCampoCatalogoPreviewCotizadorFase1_(e, cfg, etiqueta, desc){
        const catalogoId = String((cfg && cfg.catalogo_id) || "").trim();
        const opciones = opcionesCatalogoPreviewCotizadorFase1_(catalogoId).slice(0,8);
        const multiple = cfg && cfg.multiple;
        let control = '<select '+(multiple ? 'multiple ' : '')+'disabled><option>Seleccione...</option>';
        opciones.forEach(function(o){ control += '<option>'+escapeHtml(o)+'</option>'; });
        control += '</select>';
        return '<div class="cotizador-preview-field"><label>'+escapeHtml(etiqueta)+'</label>'+control+(desc ? '<small>'+escapeHtml(desc)+'</small>' : '')+'</div>';
      }

      function renderCajaValorPreviewCotizadorFase1_(e, cfg, etiqueta){
        const prefijo = String((cfg && cfg.prefijo) || "").trim();
        const sufijo = String((cfg && cfg.sufijo) || "").trim();
        const defecto = String((cfg && cfg.valor_por_defecto) || "0.00").trim();
        return '<div class="cotizador-preview-field"><label>'+escapeHtml(etiqueta)+'</label>'
          + '<div class="cotizador-preview-caja-valor">'+escapeHtml(prefijo)+escapeHtml(defecto)+escapeHtml(sufijo)+'</div></div>';
      }

      function renderCampoCalculadoPreviewCotizadorFase1_(e, cfg, etiqueta){
        const operandos = Array.isArray(cfg && cfg.operandos) ? cfg.operandos : [];
        const operacion = String((cfg && cfg.operacion) || "SUMA").toUpperCase();
        const formula = formulaPreviewTextoCotizadorFase1_(operandos, operacion);
        return '<div class="cotizador-preview-field"><label>'+escapeHtml(etiqueta)+'</label>'
          + '<div class="cotizador-preview-caja-valor" title="'+escapeHtml(formula)+'">'+escapeHtml(formula)+'</div></div>';
      }

      function opcionesCatalogoPreviewCotizadorFase1_(catalogoId){
        const st = getCotizadorFase1State_();
        catalogoId = String(catalogoId || "").trim();
        if(!catalogoId) return [];
        return (st.catalogoValores || []).filter(function(v){
          return String(v.catalogo_id || "").trim() === catalogoId && normalizarActivoCotizadorFase1_(v.activo);
        }).sort(function(a,b){ return numeroOrdenCotizadorFase1_(a.orden)-numeroOrdenCotizadorFase1_(b.orden); }).map(function(v){
          return String(v.texto_visible || v.clave || v.valor_id || "Opción").trim();
        });
      }

      // Las columnas de una Tabla (Ronda 4) viven en la base
      // (tabla_columnas), no en configuracion — llegan en e.columnas, tal
      // como las embebe GET /api/cotizador/elementos. Una CAMPO_EXISTENTE
      // no trae su propia etiqueta (la tiene el campo que integra), así que
      // se resuelve contra st.elementos.
      function renderTablaPreviewCotizadorFase1_(e, cfg, etiqueta, desc){
        const st = getCotizadorFase1State_();
        const cols = Array.isArray(e.columnas) ? e.columnas : [];
        let heads = cols.map(function(c){
          if(String(c.origen || "").toUpperCase() === "PROPIA") return escapeHtml(c.etiqueta || "Columna");
          const campo = (st.elementos || []).find(function(el){ return String(el.elemento_id || "").trim() === String(c.campo_existente_id || "").trim(); });
          return escapeHtml(campo ? (campo.etiqueta || campo.nombre_elemento || c.campo_existente_id) : (c.campo_existente_id || "Columna"));
        });
        if(!heads.length) heads = ["Sin columnas todavía"];
        const th = heads.map(function(h){ return '<th>'+h+'</th>'; }).join("");
        const td = cols.length ? cols.map(function(){ return '<td>&nbsp;</td>'; }).join("") : "";
        return '<div class="cotizador-preview-field"><label>'+escapeHtml(etiqueta)+'</label>'+(desc ? '<small>'+escapeHtml(desc)+'</small>' : '')+'</div><div class="cotizador-preview-table-wrap"><table class="cotizador-preview-table"><thead><tr>'+th+'</tr></thead><tbody><tr>'+td+'</tr></tbody></table></div>';
      }

      function iconoComponenteCotizadorFase1_(tipo){
        tipo = String(tipo || "").toUpperCase();
        if(tipo === "TEXTO_INFORMATIVO") return "T";
        if(tipo === "TITULO") return "H";
        if(tipo === "LEYENDA") return "i";
        if(tipo === "CONTENEDOR") return "▣";
        if(tipo === "OPCIONES_PROPUESTA") return "⇶";
        if(tipo === "SECCIONES_ADICIONALES") return "↗";
        if(tipo === "TABLA") return "▦";
        if(tipo === "CAJA_VALOR") return "$";
        if(tipo === "CAMPO_CALCULADO") return "ƒ";
        if(tipo === "LISTA_PRECIOS") return "▤";
        return "Aa";
      }

      // Símbolo por operación para armar un texto legible tipo "CampoA + CampoB".
      // PROMEDIO no tiene un símbolo binario natural, se muestra como función.
      function simboloOperacionCalculadoCotizadorFase1_(operacion){
        operacion = String(operacion || "").toUpperCase();
        if(operacion === "RESTA") return " − ";
        if(operacion === "MULTIPLICACION") return " × ";
        if(operacion === "DIVISION") return " ÷ ";
        return " + "; // SUMA y también el separador visual dentro de Promedio(...)
      }

      function formulaPreviewTextoCotizadorFase1_(operandos, operacion){
        const st = getCotizadorFase1State_();
        if(!Array.isArray(operandos) || !operandos.length) return "Sin fórmula configurada.";
        const labels = operandos.map(function(id){
          const el = (st.elementos || []).find(function(e){ return String(e.elemento_id || "").trim() === String(id || "").trim(); });
          return el ? labelElementoCampoCotizadorFase1_(el) : String(id || "");
        });
        operacion = String(operacion || "SUMA").toUpperCase();
        if(operacion === "PROMEDIO") return "Promedio(" + labels.join(", ") + ")";
        return labels.join(simboloOperacionCalculadoCotizadorFase1_(operacion));
      }

      function guardarTabCotizadorFase1_(){
        const st = getCotizadorFase1State_();
        if(tabSoloLecturaCotizadorFase1_()){ mostrarToast("La sección asociada es de solo lectura."); return; }
        const idOriginal = String(byId("designerCotizadorTabIdOriginal") ? byId("designerCotizadorTabIdOriginal").value : "").trim().toUpperCase();
        const tabId = String(byId("designerCotizadorTabId") ? byId("designerCotizadorTabId").value : "").trim().toUpperCase();
        const nombre = String(byId("designerCotizadorTabNombre") ? byId("designerCotizadorTabNombre").value : "").trim();
        if(!st.cotizadorId){ mostrarToast("Seleccione un cotizador."); return; }
        if(!tabId || !nombre){ mostrarToast("Complete código y nombre de la sección."); return; }
        const alcance = String(byId("designerCotizadorTabAlcance") ? byId("designerCotizadorTabAlcance").value : "PROPIO").trim().toUpperCase() === "REUTILIZABLE" ? "REUTILIZABLE" : "PROPIO";
        const registro = {
          tab_id: tabId,
          cotizador_id: st.cotizadorId,
          alcance: alcance,
          nombre_tab: nombre,
          descripcion: byId("designerCotizadorTabDescripcion") ? byId("designerCotizadorTabDescripcion").value : "",
          orden: byId("designerCotizadorTabOrden") ? byId("designerCotizadorTabOrden").value : "",
          activo: byId("designerCotizadorTabActivo") ? byId("designerCotizadorTabActivo").checked : true
        };
        guardarTabCotizadorApiFase1_({id_original:idOriginal, registro:registro}, function(){
          mostrarToast("Sección guardada.");
          st.tabId = tabId;
          cargarDatosCotizadorFase1_(true);
        }, function(err){ mostrarToast("No se pudo guardar la sección: " + ((err && err.message) || err)); });
      }

      function eliminarTabCotizadorFase1_(){
        const st = getCotizadorFase1State_();
        if(tabSoloLecturaCotizadorFase1_()){ mostrarToast("Use Quitar para desasociar esta sección sin borrar la original."); return; }
        const tabId = String(st.tabId || "").trim().toUpperCase();
        if(!tabId){ mostrarToast("Seleccione una sección guardada para eliminar."); return; }
        if(!window.confirm("¿Desea eliminar la sección " + tabId + "? Sus elementos también quedarán inactivos.")) return;
        fetchAutenticado("/api/cotizador/tabs/" + encodeURIComponent(tabId), {method:"DELETE", headers:{"Accept":"application/json"}})
          .then(function(resp){ return resp.json().then(function(data){ if(!resp.ok || !data.ok) throw new Error(data.error || "No se pudo eliminar la sección."); return data; }); })
          .then(function(res){
            mostrarToast(res.mensaje || "Sección eliminada.");
            st.tabId = ""; st.elementoId = ""; st.tabs = []; st.elementos = []; st.cargado = false;
            cargarDatosCotizadorFase1_(true);
          })
          .catch(function(err){ mostrarToast((err && err.message) || "No se pudo eliminar la sección."); });
      }

      function parseConfigElementoCotizadorFase1_(cfg){

      function labelCampoModeloCotizadorFase1_(c){
        const id = String(c.campo_id || c.id || c.clave || "").trim();

      function labelElementoCampoCotizadorFase1_(el){
        const id = String(el.elemento_id || "").trim();
        const label = String(el.etiqueta || el.nombre_elemento || id).trim();
        const tipo = String(el.tipo_elemento || "").trim().toUpperCase();
        return label + (tipo === "CAMPO_CATALOGO" ? " · Catálogo" : "") + (id && label !== id ? " (" + id + ")" : "");
