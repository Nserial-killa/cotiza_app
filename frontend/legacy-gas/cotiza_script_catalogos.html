      // Campos que se pueden "integrar" en otro componente (columna de
      // Tabla — Ronda 4 — o campo fuente de Caja de Valor): CAMPO,
      // CAMPO_CATALOGO o CAMPO_CALCULADO de la misma sección, activos, sin
      // contarse a sí mismo. Ni otra TABLA ni una LISTA_PRECIOS ni un
      // CONTENEDOR — evita anidar tablas dentro de tablas (mismo criterio
      // que tiposOperandoComoColumnaValidos en tabla_columnas.go).
      function camposDisponiblesTablaCotizadorFase1_(){
        const st = getCotizadorFase1State_();
        const actual = String(st.elementoId || "").trim();
        return (st.elementos || []).filter(function(el){
          const tab = String(el.tab_id || "").trim();
          const id = String(el.elemento_id || "").trim();
          const tipo = String(el.tipo_elemento || "").trim().toUpperCase();
          return tab === st.tabId && id && id !== actual && (tipo === "CAMPO" || tipo === "CAMPO_CATALOGO" || tipo === "CAMPO_CALCULADO") && normalizarActivoCotizadorFase1_(el.activo);
        }).sort(function(a,b){ return numeroOrdenCotizadorFase1_(a.orden)-numeroOrdenCotizadorFase1_(b.orden); });
      }

      // Operandos válidos de un Campo Calculado (Ronda 2 + Ronda 3 + Ronda
      // 4 + catálogos con valor_calculo, migración 0023): CAMPO numérico
      // (Número/Moneda/Porcentaje), un CAMPO_CATALOGO cuyo catálogo tenga
      // tipo_calculo != SIN_VALOR (se resuelve por valor_calculo del valor
      // seleccionado, nunca por su etiqueta), o un CAMPO_CALCULADO,
      // LISTA_PRECIOS o TABLA (todos son, en los hechos, otra fuente
      // numérica: su total ya viene resuelto), de la misma sección, activos,
      // sin contarse a sí mismo ni los ya agregados.
      function operandosDisponiblesCalculadoCotizadorFase1_(){
        const st = getCotizadorFase1State_();
        const actual = String(st.elementoId || "").trim();
        const yaAgregados = {};
        (st.calculadoOperandosTemp || []).forEach(function(id){ yaAgregados[String(id || "").trim()] = true; });
        return (st.elementos || []).filter(function(el){
          const tab = String(el.tab_id || "").trim();
          const id = String(el.elemento_id || "").trim();
          if(tab !== st.tabId || !id || id === actual || yaAgregados[id] || !normalizarActivoCotizadorFase1_(el.activo)) return false;
          const tipo = String(el.tipo_elemento || "").trim().toUpperCase();
          if(tipo === "CAMPO_CALCULADO" || tipo === "LISTA_PRECIOS" || tipo === "TABLA") return true;
          if(tipo === "CAMPO_CATALOGO"){
            const cat = getCatalogoDefByIdCotizadorFase1_(el.catalogo_id);
            const tipoCalculo = String((cat && cat.tipo_calculo) || "SIN_VALOR").trim().toUpperCase();
            return tipoCalculo === "NUMERO" || tipoCalculo === "PORCENTAJE";
          }
          if(tipo !== "CAMPO") return false;
          const cfg = parseConfigElementoCotizadorFase1_(el.config_json || el.configuracion);
          const tipoCampo = String(cfg.tipo_campo || "").trim().toUpperCase();
          return tipoCampo === "NUMERO" || tipoCampo === "MONEDA" || tipoCampo === "PORCENTAJE";
        }).sort(function(a,b){ return numeroOrdenCotizadorFase1_(a.orden)-numeroOrdenCotizadorFase1_(b.orden); });
      }

      function catalogosActivosCotizadorFase1_(){
        const st = getCotizadorFase1State_();
        return (st.catalogosDefinicion || []).filter(function(c){
          const id = String(c.catalogo_id || c.id || c.clave || "").trim();
          return id && normalizarActivoCotizadorFase1_(c.activo);
        }).sort(function(a,b){ return numeroOrdenCotizadorFase1_(a.orden)-numeroOrdenCotizadorFase1_(b.orden); });
      }

        const calculadoSel = byId("designerCotizadorCalculadoCampoDisponible");

          calculadoSel.innerHTML = '<option value="">Seleccione campo numérico...</option>';
          operandosDisponiblesCalculadoCotizadorFase1_().forEach(function(el){
            const opt = document.createElement("option");

            opt.textContent = labelElementoCampoCotizadorFase1_(el);

        if(catalogoSel){
          const actual = catalogoSel.value;
          catalogoSel.innerHTML = '<option value="">Seleccione catálogo...</option>';
          catalogosActivosCotizadorFase1_().forEach(function(c){
            const id = String(c.catalogo_id || c.id || c.clave || "").trim();
            const opt = document.createElement("option");
            opt.value = id;
            opt.textContent = labelCatalogoDefCotizadorFase1_(c);
            catalogoSel.appendChild(opt);
          });
          catalogoSel.value = actual;
        }

        if(campoPrincipalSel){
          const actual = campoPrincipalSel.value;
          const elementoActual = String(st.elementoId || "").trim();
          campoPrincipalSel.innerHTML = '<option value="">Sin campo principal</option>';
          (st.elementos || []).filter(function(el){
            return String(el.tab_id || "").trim() === st.tabId
              && String(el.elemento_id || "").trim() !== elementoActual
              && normalizarActivoCotizadorFase1_(el.activo);
          }).sort(function(a,b){ return numeroOrdenCotizadorFase1_(a.orden)-numeroOrdenCotizadorFase1_(b.orden); }).forEach(function(el){
            const opt = document.createElement("option");
            opt.value = String(el.elemento_id || "").trim();
            opt.textContent = labelElementoCampoCotizadorFase1_(el);
            campoPrincipalSel.appendChild(opt);
          });
          campoPrincipalSel.value = actual;
        }

        [reglaSel, reglaCatalogoSel].forEach(function(sel){
          if(!sel) return;
          const actual = sel.value;
          sel.innerHTML = '<option value="">Seleccione regla...</option>';
          (st.reglasModelo || []).filter(function(r){
            const cot = String(r.calculadora_id || r.cotizador_id || "").trim().toUpperCase();
            return (!cot || cot === "TODOS" || cot === "ALL" || cot === st.cotizadorId) && normalizarActivoCotizadorFase1_(r.activo);
          }).sort(function(a,b){ return numeroOrdenCotizadorFase1_(a.orden)-numeroOrdenCotizadorFase1_(b.orden); }).forEach(function(r){
            const id = String(r.regla_id || r.id || r.clave || "").trim();
            if(!id) return;
            const opt = document.createElement("option");
            opt.value = id;
            opt.textContent = labelReglaCotizadorFase1_(r);
            sel.appendChild(opt);
          });
          sel.value = actual;
        });
      }

      function actualizarOpcionesFechaCampoCotizadorFase1_(){
        const tipoCampo = String(byId("designerCotizadorCampoTipoCampo") ? byId("designerCotizadorCampoTipoCampo").value : "").toUpperCase();
        const box = byId("designerCotizadorCampoFechaOpciones");
        if(box) box.classList.toggle("hidden", tipoCampo !== "FECHA");
      }

      function actualizarMensajeCatalogoHijoCotizadorFase1_(){
        const catalogoId = String(byId("designerCotizadorCampoCatalogoId") ? byId("designerCotizadorCampoCatalogoId").value : "").trim();
        const msg = byId("designerCotizadorCampoCatalogoMensaje");
        const box = byId("designerCotizadorCampoCatalogoHijosBox");
        const texto = byId("designerCotizadorCampoCatalogoHijosTexto");
        const hijos = hijosCatalogoCotizadorFase1_(catalogoId);
        if(msg) msg.textContent = catalogoId ? "El sistema guardará el ID del catálogo y mostrará el nombre al usuario." : "";

          texto.innerHTML = hijos.length
            ? 'Este catálogo tiene catálogo(s) hijo: <strong>'+escapeHtml(hijos.map(function(h){ return h.nombre_catalogo || h.catalogo_id; }).join(", "))+'</strong>. Puede agregar un campo hijo relacionado para filtrar opciones según la selección del padre.'
            : '';
        }
      }

      function actualizarPropiedadesPorTipoComponenteCotizadorFase1_(){
        const tipo = String(byId("designerCotizadorElementoTipo") ? byId("designerCotizadorElementoTipo").value : "CAMPO").toUpperCase();
        const formModalCotizador = byId("designerCotizadorPropsComponente");
        if(formModalCotizador){ formModalCotizador.setAttribute("data-componente-tipo", tipo); }
        document.querySelectorAll("[data-component-config]").forEach(function(el){
          el.classList.toggle("hidden", String(el.getAttribute("data-component-config") || "").toUpperCase() !== tipo);
        });
        document.querySelectorAll("[data-checks-for]").forEach(function(el){
          el.classList.toggle("hidden", String(el.getAttribute("data-checks-for") || "").toUpperCase() !== tipo);
        });
        const etiquetaLabel = byId("designerCotizadorEtiquetaLabel");
        const descripcionLabel = byId("designerCotizadorDescripcionLabel");
        if(etiquetaLabel){
          etiquetaLabel.textContent = tipo === "TITULO" ? "Texto del título" : tipo === "LEYENDA" ? "Texto de la leyenda" : tipo === "TABLA" ? "Título de la tabla" : tipo === "CONTENEDOR" ? "Título del contenedor" : tipo === "OPCIONES_PROPUESTA" ? "Título de las opciones" : tipo === "SECCIONES_ADICIONALES" ? "Título del selector de secciones" : "Etiqueta visible";
        }
        if(descripcionLabel){
          descripcionLabel.textContent = tipo === "LEYENDA" ? "Texto complementario / ayuda" : "Descripción / ayuda";
        }
        const padreWrap = byId("designerCotizadorElementoPadreWrap");
        if(padreWrap){
          const hayPadres = elementosDeTabCotizadorFase1_().some(function(e){
            const tipoPadre = String(e.tipo_elemento || "").toUpperCase();
            return (tipoPadre === "CONTENEDOR" || tipoPadre === "OPCIONES_PROPUESTA") && String(e.elemento_id || "") !== String(getCotizadorFase1State_().elementoId || "");
          });
          padreWrap.classList.toggle("hidden", !hayPadres || tipo === "CONTENEDOR" || tipo === "OPCIONES_PROPUESTA" || tipo === "SECCIONES_ADICIONALES");
        }
        const funcionCampoBox = byId("designerCotizadorFuncionCampoBox");
        if(funcionCampoBox){
          funcionCampoBox.classList.toggle("hidden", ["CAMPO","CAMPO_CATALOGO","CAMPO_CALCULADO","LISTA_PRECIOS"].indexOf(tipo) < 0);
        }
        llenarSelectCamposYReglasCotizadorFase1_();
        actualizarOpcionesFechaCampoCotizadorFase1_();
        actualizarMensajeCatalogoHijoCotizadorFase1_();
        if(tipo === "CAMPO_CALCULADO") renderOperandosCalculadoCotizadorFase1_();
        if(tipo === "SECCIONES_ADICIONALES") cargarSeccionesReutilizablesCotizadorFase1_();
      }
      function getCampoModeloByIdCotizadorFase1_(campoId){
        const st = getCotizadorFase1State_();
        campoId = String(campoId || "").trim();
        return (st.camposModelo || []).find(function(c){ return String(c.campo_id || c.id || c.clave || "").trim() === campoId; }) || null;
      }

      function getReglaByIdCotizadorFase1_(reglaId){
        const st = getCotizadorFase1State_();
        reglaId = String(reglaId || "").trim();
        return (st.reglasModelo || []).find(function(r){ return String(r.regla_id || r.id || r.clave || "").trim() === reglaId; }) || null;
      }

      // Editor de operandos del Campo Calculado (Ronda 2): mismo patrón de
      // "lista temporal + Agregar/Quitar" que ya usa reglas de Campo
      // (st.campoReglasTemp) — las columnas de Tabla (Ronda 4), en cambio,
      // son filas reales en la base apenas se agregan, ver
      // renderColumnasTablaCotizadorFase1_.
      function renderOperandosCalculadoCotizadorFase1_(){
        const st = getCotizadorFase1State_();
        const cont = byId("designerCotizadorCalculadoOperandosLista");
        const operandos = Array.isArray(st.calculadoOperandosTemp) ? st.calculadoOperandosTemp : [];
        if(cont){
          if(!operandos.length){
            cont.innerHTML = '<div class="cotizador-mini-empty">Sin operandos agregados.</div>';
          } else {
            cont.innerHTML = operandos.map(function(id, idx){
              const el = (st.elementos || []).find(function(e){ return String(e.elemento_id || "").trim() === String(id || "").trim(); });
              const txt = el ? labelElementoCampoCotizadorFase1_(el) : id;
              return '<div class="cotizador-mini-row"><span>'+(idx+1)+'. '+escapeHtml(txt)+'</span><button type="button" class="btn btn-ghost btn-mini" data-quitar-operando-calculado="'+idx+'">Quitar</button></div>';
            }).join("");
            cont.querySelectorAll("[data-quitar-operando-calculado]").forEach(function(btn){
              btn.addEventListener("click",function(){
                const idx = Number(btn.getAttribute("data-quitar-operando-calculado"));
                st.calculadoOperandosTemp.splice(idx,1);
                llenarSelectCamposYReglasCotizadorFase1_();
                renderOperandosCalculadoCotizadorFase1_();
              });
            });
          }
        }
        actualizarFormulaPreviewCalculadoCotizadorFase1_();
      }

      function agregarOperandoCalculadoCotizadorFase1_(){
        const st = getCotizadorFase1State_();
        const sel = byId("designerCotizadorCalculadoCampoDisponible");
        const elementoId = String(sel ? sel.value : "").trim();
        if(!elementoId){ mostrarToast("Seleccione un campo numérico para agregarlo como operando."); return; }
        st.calculadoOperandosTemp = Array.isArray(st.calculadoOperandosTemp) ? st.calculadoOperandosTemp : [];
        st.calculadoOperandosTemp.push(elementoId);
        llenarSelectCamposYReglasCotizadorFase1_();
        renderOperandosCalculadoCotizadorFase1_();
      }

      function actualizarFormulaPreviewCalculadoCotizadorFase1_(){
        const st = getCotizadorFase1State_();
        const preview = byId("designerCotizadorCalculadoFormulaPreview");
        if(!preview) return;
        const operacion = byId("designerCotizadorCalculadoOperacion") ? byId("designerCotizadorCalculadoOperacion").value : "SUMA";
        preview.textContent = formulaPreviewTextoCotizadorFase1_(st.calculadoOperandosTemp, operacion);
      }

      // ---------------------------------------------------------------
      // Ítems de Lista de Precios (Ronda 3, migración 0019). A diferencia
      // de las columnas de Tabla o los operandos de Campo Calculado (que
      // solo viven en configuracion hasta guardar el componente), los
      // ítems tienen sus propios endpoints y existen apenas se crean —
      // por eso el elemento tiene que estar guardado (elemento_id real en
      // la base) antes de poder agregarle ítems.
      // ---------------------------------------------------------------

      function listaPreciosPuedeEditarItems_(){
        const st = getCotizadorFase1State_();
        return !!(st.elementoId && getElementoActualCotizadorFase1_());
      }

      function renderItemsListaPreciosCotizadorFase1_(){
        const st = getCotizadorFase1State_();
        const cont = byId("designerCotizadorListaPreciosItemsLista");
        const count = byId("designerCotizadorListaPreciosCount");
        const items = Array.isArray(st.listaPreciosItemsActual) ? st.listaPreciosItemsActual : [];
        const activos = items.filter(function(it){ return normalizarActivoCotizadorFase1_(it.activo); });
        if(count) count.textContent = activos.length + " ítem" + (activos.length === 1 ? "" : "s");

        if(!listaPreciosPuedeEditarItems_()){
          if(cont) cont.innerHTML = '<div class="cotizador-mini-empty">Guarde el componente antes de agregar ítems.</div>';
        } else if(cont){
          if(!items.length){
            cont.innerHTML = '<div class="cotizador-mini-empty">Sin ítems configurados.</div>';
          } else {
            cont.innerHTML = items.map(function(it){
              const inactivo = !normalizarActivoCotizadorFase1_(it.activo);
              return '<div class="cotizador-mini-row' + (inactivo ? ' inactive' : '') + '">'
                + '<span>' + escapeHtml(it.codigo || "") + ' — ' + escapeHtml(it.nombre || "") + ' · ' + escapeHtml(formatoMoneda(Number(it.precio) || 0, it.moneda)) + (inactivo ? ' (inactivo)' : '') + '</span>'
                + '<span>'
                + '<button type="button" class="btn btn-ghost btn-mini" data-editar-item-lp="' + escapeHtml(it.item_id) + '">Editar</button>'
                + '<button type="button" class="btn btn-ghost btn-mini" data-eliminar-item-lp="' + escapeHtml(it.item_id) + '">Eliminar</button>'
                + '</span>'
                + '</div>';
            }).join("");
            cont.querySelectorAll("[data-editar-item-lp]").forEach(function(btn){
              btn.addEventListener("click", function(){
                const item = items.find(function(it){ return it.item_id === btn.getAttribute("data-editar-item-lp"); });
                if(item) cargarItemEnFormularioListaPreciosCotizadorFase1_(item);
              });
            });
            cont.querySelectorAll("[data-eliminar-item-lp]").forEach(function(btn){
              btn.addEventListener("click", function(){
                eliminarItemListaPreciosCotizadorFase1_(btn.getAttribute("data-eliminar-item-lp"));
              });
            });
          }
        }

        const btnAgregar = byId("btnDesignerAgregarItemListaPrecios");
        if(btnAgregar) btnAgregar.disabled = !listaPreciosPuedeEditarItems_();

        const codigoDefaultSel = byId("designerCotizadorListaPreciosCodigoDefault");
        if(codigoDefaultSel){
          const actual = codigoDefaultSel.value;
          codigoDefaultSel.innerHTML = '<option value="">Primer ítem activo</option>';
          activos.forEach(function(it){
            const opt = document.createElement("option");
            opt.value = it.codigo;
            opt.textContent = it.codigo + " — " + it.nombre;
            codigoDefaultSel.appendChild(opt);
          });
          codigoDefaultSel.value = actual;
        }
      }

      function limpiarFormularioItemListaPreciosCotizadorFase1_(){
        const st = getCotizadorFase1State_();
        st.listaPreciosItemEditId = "";
        ["designerCotizadorListaPreciosEditIndex","designerCotizadorListaPreciosItemCodigo","designerCotizadorListaPreciosItemNombre","designerCotizadorListaPreciosItemDescripcion","designerCotizadorListaPreciosItemUnidad"].forEach(function(id){ if(byId(id)) byId(id).value = ""; });
        if(byId("designerCotizadorListaPreciosItemPrecio")) byId("designerCotizadorListaPreciosItemPrecio").value = "";
        if(byId("designerCotizadorListaPreciosItemMoneda")) byId("designerCotizadorListaPreciosItemMoneda").value = "USD";
        if(byId("designerCotizadorListaPreciosItemCosto")) byId("designerCotizadorListaPreciosItemCosto").value = "";
        if(byId("designerCotizadorListaPreciosItemMargen")) byId("designerCotizadorListaPreciosItemMargen").value = "";
        if(byId("designerCotizadorListaPreciosItemActivo")) byId("designerCotizadorListaPreciosItemActivo").checked = true;
        if(byId("btnDesignerCancelarEdicionItemListaPrecios")) byId("btnDesignerCancelarEdicionItemListaPrecios").classList.add("hidden");
        if(byId("btnDesignerAgregarItemListaPrecios")) byId("btnDesignerAgregarItemListaPrecios").textContent = "+ Agregar ítem";
      }

      function cargarItemEnFormularioListaPreciosCotizadorFase1_(item){
        const st = getCotizadorFase1State_();
        st.listaPreciosItemEditId = String(item.item_id || "");
        if(byId("designerCotizadorListaPreciosEditIndex")) byId("designerCotizadorListaPreciosEditIndex").value = st.listaPreciosItemEditId;
        if(byId("designerCotizadorListaPreciosItemCodigo")) byId("designerCotizadorListaPreciosItemCodigo").value = item.codigo || "";
        if(byId("designerCotizadorListaPreciosItemNombre")) byId("designerCotizadorListaPreciosItemNombre").value = item.nombre || "";
        if(byId("designerCotizadorListaPreciosItemDescripcion")) byId("designerCotizadorListaPreciosItemDescripcion").value = item.descripcion || "";
        if(byId("designerCotizadorListaPreciosItemPrecio")) byId("designerCotizadorListaPreciosItemPrecio").value = item.precio || 0;
        if(byId("designerCotizadorListaPreciosItemMoneda")) byId("designerCotizadorListaPreciosItemMoneda").value = item.moneda || "USD";
        if(byId("designerCotizadorListaPreciosItemUnidad")) byId("designerCotizadorListaPreciosItemUnidad").value = item.unidad_cobro || "";
        if(byId("designerCotizadorListaPreciosItemCosto")) byId("designerCotizadorListaPreciosItemCosto").value = item.costo_interno || 0;
        if(byId("designerCotizadorListaPreciosItemMargen")) byId("designerCotizadorListaPreciosItemMargen").value = item.margen_porcentaje || 0;
        if(byId("designerCotizadorListaPreciosItemActivo")) byId("designerCotizadorListaPreciosItemActivo").checked = normalizarActivoCotizadorFase1_(item.activo);
        if(byId("btnDesignerCancelarEdicionItemListaPrecios")) byId("btnDesignerCancelarEdicionItemListaPrecios").classList.remove("hidden");
        if(byId("btnDesignerAgregarItemListaPrecios")) byId("btnDesignerAgregarItemListaPrecios").textContent = "Guardar ítem";
      }

      function cancelarEdicionItemListaPreciosCotizadorFase1_(){
        limpiarFormularioItemListaPreciosCotizadorFase1_();
      }

      // Al terminar (crear/editar/eliminar) se vuelve a pedir la lista de
      // elementos del tab — más simple y más seguro que llevar la cuenta a
      // mano, y es el mismo patrón que ya usa el resto del Diseñador tras
      // guardar/eliminar un componente.
      function refrescarItemsListaPreciosCotizadorFase1_(callback){
        const st = getCotizadorFase1State_();
        listarElementosCotizadorApiFase1_(st.tabId, function(res){
          st.elementos = rowsFromRespuestaFase1_(res).map(normalizarElementoCotizadorFase1_);
          const actual = getElementoActualCotizadorFase1_();
          st.listaPreciosItemsActual = (actual && Array.isArray(actual.items)) ? actual.items : [];
          renderItemsListaPreciosCotizadorFase1_();
          if(callback) callback();
        }, function(err){ mostrarToast("No se pudieron recargar los ítems: " + ((err && err.message) || err)); });
      }

      function guardarItemListaPreciosCotizadorFase1_(){
        const st = getCotizadorFase1State_();
        if(!listaPreciosPuedeEditarItems_()){ mostrarToast("Guarde el componente antes de agregar ítems."); return; }
        const codigo = String(byId("designerCotizadorListaPreciosItemCodigo") ? byId("designerCotizadorListaPreciosItemCodigo").value : "").trim();
        const nombre = String(byId("designerCotizadorListaPreciosItemNombre") ? byId("designerCotizadorListaPreciosItemNombre").value : "").trim();
        if(!codigo || !nombre){ mostrarToast("Complete código y nombre del ítem."); return; }
        const cuerpo = {
          codigo: codigo,
          nombre: nombre,
          descripcion: byId("designerCotizadorListaPreciosItemDescripcion") ? byId("designerCotizadorListaPreciosItemDescripcion").value : "",
          precio: Number(byId("designerCotizadorListaPreciosItemPrecio") ? byId("designerCotizadorListaPreciosItemPrecio").value : 0) || 0,
          moneda: byId("designerCotizadorListaPreciosItemMoneda") ? byId("designerCotizadorListaPreciosItemMoneda").value : "USD",
          unidad_cobro: byId("designerCotizadorListaPreciosItemUnidad") ? byId("designerCotizadorListaPreciosItemUnidad").value : "",
          costo_interno: Number(byId("designerCotizadorListaPreciosItemCosto") ? byId("designerCotizadorListaPreciosItemCosto").value : 0) || 0,
          margen_porcentaje: Number(byId("designerCotizadorListaPreciosItemMargen") ? byId("designerCotizadorListaPreciosItemMargen").value : 0) || 0,
          activo: byId("designerCotizadorListaPreciosItemActivo") ? byId("designerCotizadorListaPreciosItemActivo").checked : true
        };
        const editId = st.listaPreciosItemEditId;
        const ruta = editId ? "/api/cotizador/items/" + encodeURIComponent(editId) : "/api/cotizador/elementos/" + encodeURIComponent(st.elementoId) + "/items";
        const metodo = editId ? "PATCH" : "POST";
        fetchAutenticado(ruta, {method: metodo, headers: {"Accept":"application/json","Content-Type":"application/json"}, body: JSON.stringify(cuerpo)})
          .then(function(resp){ return resp.json().then(function(data){ if(!resp.ok || !data.ok) throw new Error(data.error || "No se pudo guardar el ítem."); return data; }); })
          .then(function(){
            mostrarToast(editId ? "Ítem actualizado." : "Ítem creado.");
            limpiarFormularioItemListaPreciosCotizadorFase1_();
            refrescarItemsListaPreciosCotizadorFase1_();
          })
          .catch(function(err){ mostrarToast((err && err.message) || "No se pudo guardar el ítem."); });
      }

      function eliminarItemListaPreciosCotizadorFase1_(itemId){
        if(!itemId) return;
        if(!window.confirm("¿Desea eliminar este ítem? Se conservará inactivo (una cotización que ya lo usó lo sigue viendo en su historial).")) return;
        fetchAutenticado("/api/cotizador/items/" + encodeURIComponent(itemId), {method:"DELETE", headers:{"Accept":"application/json"}})
          .then(function(resp){ return resp.json().then(function(data){ if(!resp.ok || !data.ok) throw new Error(data.error || "No se pudo eliminar el ítem."); return data; }); })
          .then(function(){
            mostrarToast("Ítem eliminado.");
            refrescarItemsListaPreciosCotizadorFase1_();
          })
          .catch(function(err){ mostrarToast((err && err.message) || "No se pudo eliminar el ítem."); });
      }

      // ---------------------------------------------------------------
      // Columnas de Tabla (Ronda 4, migración 0020). Mismo criterio que los
      // ítems de Lista de Precios (Ronda 3): las columnas tienen sus
      // propios endpoints y existen apenas se crean, así que el elemento
      // TABLA tiene que estar guardado (elemento_id real) antes de poder
      // agregarle columnas.
      // ---------------------------------------------------------------

      function tablaPuedeEditarColumnas_(){
        const st = getCotizadorFase1State_();
        return !!(st.elementoId && getElementoActualCotizadorFase1_());
      }

      function actualizarModoColumnaTablaCotizadorFase1_(){
        const esPropia = byId("designerCotizadorTablaModoColumnaPropia") && byId("designerCotizadorTablaModoColumnaPropia").checked;
        if(byId("designerCotizadorTablaBloqueCampoExistente")) byId("designerCotizadorTablaBloqueCampoExistente").classList.toggle("hidden", esPropia);
        if(byId("designerCotizadorTablaBloqueColumnaPropia")) byId("designerCotizadorTablaBloqueColumnaPropia").classList.toggle("hidden", !esPropia);
      }

      function renderColumnasTablaCotizadorFase1_(){
        const st = getCotizadorFase1State_();
        const cont = byId("designerCotizadorTablaColumnasLista");
        const cols = Array.isArray(st.tablaColumnasActual) ? st.tablaColumnasActual : [];
        if(!tablaPuedeEditarColumnas_()){
          if(cont) cont.innerHTML = '<div class="cotizador-mini-empty">Guarde el componente antes de agregar columnas.</div>';
        } else if(cont){
          if(!cols.length){
            cont.innerHTML = '<div class="cotizador-mini-empty">Sin columnas agregadas.</div>';
          } else {
            cont.innerHTML = cols.map(function(c, idx){
              const esPropia = String(c.origen || "").toUpperCase() === "PROPIA";
              const elemento = esPropia ? null : (st.elementos || []).find(function(el){ return String(el.elemento_id || "").trim() === String(c.campo_existente_id || "").trim(); });
              const txt = esPropia ? (c.etiqueta || "Columna propia") + " (" + (c.tipo_dato || "TEXTO") + ")" : (elemento ? labelElementoCampoCotizadorFase1_(elemento) : (c.campo_existente_id || "Campo"));
              return '<div class="cotizador-mini-row"><span>'+(idx+1)+'. '+escapeHtml(txt)+'</span><button type="button" class="btn btn-ghost btn-mini" data-quitar-columna="'+escapeHtml(c.columna_id)+'">Quitar</button></div>';
            }).join("");
            cont.querySelectorAll("[data-quitar-columna]").forEach(function(btn){
              btn.addEventListener("click", function(){
                eliminarColumnaTablaCotizadorFase1_(btn.getAttribute("data-quitar-columna"));
              });
            });
          }
        }
        const btnCampo = byId("btnDesignerAgregarColumnaTabla");
        const btnPropia = byId("btnDesignerAgregarColumnaPropiaTabla");
        if(btnCampo) btnCampo.disabled = !tablaPuedeEditarColumnas_();
        if(btnPropia) btnPropia.disabled = !tablaPuedeEditarColumnas_();
      }

      // Igual que refrescarItemsListaPreciosCotizadorFase1_: vuelve a pedir
      // los elementos del tab para traer las columnas ya guardadas, en vez
      // de llevar la cuenta a mano.
      function refrescarColumnasTablaCotizadorFase1_(){
        const st = getCotizadorFase1State_();
        listarElementosCotizadorApiFase1_(st.tabId, function(res){
          st.elementos = rowsFromRespuestaFase1_(res).map(normalizarElementoCotizadorFase1_);
          const actual = getElementoActualCotizadorFase1_();
          st.tablaColumnasActual = (actual && Array.isArray(actual.columnas)) ? actual.columnas : [];
          renderColumnasTablaCotizadorFase1_();
          llenarSelectCamposYReglasCotizadorFase1_();
        }, function(err){ mostrarToast("No se pudieron recargar las columnas: " + ((err && err.message) || err)); });
      }

      function agregarColumnaTablaCotizadorFase1_(){
        const st = getCotizadorFase1State_();
        if(!tablaPuedeEditarColumnas_()){ mostrarToast("Guarde el componente antes de agregar columnas."); return; }
        const sel = byId("designerCotizadorTablaCampoDisponible");

      function guardarComponenteCotizadorFase1_(){
        const st = getCotizadorFase1State_();
        if(!st.tabId){ mostrarToast("Seleccione una sección."); return; }
        if(tabSoloLecturaCotizadorFase1_()){ mostrarToast("La sección asociada es de solo lectura."); return; }
        const idOriginal = String(byId("designerCotizadorElementoIdOriginal") ? byId("designerCotizadorElementoIdOriginal").value : "").trim();
        const elementoId = String(byId("designerCotizadorElementoId") ? byId("designerCotizadorElementoId").value : "").trim();
        const tipo = String(byId("designerCotizadorElementoTipo") ? byId("designerCotizadorElementoTipo").value : "CAMPO").trim().toUpperCase();
        const etiqueta = String(byId("designerCotizadorElementoEtiqueta") ? byId("designerCotizadorElementoEtiqueta").value : "").trim();
        if(!elementoId || !tipo || !etiqueta){ mostrarToast("Complete código, tipo y texto visible del componente."); return; }
        if(["CAMPO","CAMPO_CATALOGO","LEYENDA","TEXTO_INFORMATIVO","TITULO","CONTENEDOR","CAJA_VALOR","CAMPO_CALCULADO","LISTA_PRECIOS","TABLA","OPCIONES_PROPUESTA","SECCIONES_ADICIONALES"].indexOf(tipo) < 0){ mostrarToast("Este tipo de componente todavía no está disponible."); return; }
        const cfgObj = armarConfigComponenteCotizadorFase1_(tipo);
        cfgObj.nombre_elemento = byId("designerCotizadorElementoNombre") ? byId("designerCotizadorElementoNombre").value : "";
        cfgObj.descripcion = byId("designerCotizadorElementoDescripcion") ? byId("designerCotizadorElementoDescripcion").value : "";
        const catalogoId = tipo === "CAMPO_CATALOGO" ? String(cfgObj.catalogo_id || "").trim() : "";
        if(tipo === "CAMPO_CATALOGO" && !catalogoId){ mostrarToast("Seleccione el catálogo del componente."); return; }
        if(tipo === "CAMPO_CALCULADO"){
          const minimo = cfgObj.operacion === "PROMEDIO" ? 1 : 2;
          if(!Array.isArray(cfgObj.operandos) || cfgObj.operandos.length < minimo){ mostrarToast("La operación " + cfgObj.operacion + " necesita al menos " + minimo + " operando(s)."); return; }
        }
        const padreId = (tipo === "CONTENEDOR" || tipo === "OPCIONES_PROPUESTA" || tipo === "SECCIONES_ADICIONALES") ? "" : String(byId("designerCotizadorElementoPadre") ? byId("designerCotizadorElementoPadre").value : "").trim();
        const fuenteId = tipo === "CAJA_VALOR" ? String(cfgObj.campo_fuente_id || "").trim() : "";
        const funcionCampo = ["CAMPO","CAMPO_CATALOGO","CAMPO_CALCULADO","LISTA_PRECIOS"].indexOf(tipo) >= 0
          ? String(byId("designerCotizadorFuncionCampo") ? byId("designerCotizadorFuncionCampo").value : "NORMAL").trim().toUpperCase()
          : "NORMAL";
        const registro = {
          elemento_id: elementoId,
          tab_id: st.tabId,
          calculadora_id: st.cotizadorId,
          tipo: tipo,
          etiqueta: etiqueta,
          catalogo_id: catalogoId || null,
          componente_padre_id: padreId || null,
          campo_fuente_id: fuenteId || null,
          funcion_campo: funcionCampo,
          columnas_ancho: 1,
          orden: byId("designerCotizadorElementoOrden") ? byId("designerCotizadorElementoOrden").value : "",
          requerido: !!cfgObj.obligatorio,
          configuracion: cfgObj,
          activo: byId("designerCotizadorElementoActivo") ? byId("designerCotizadorElementoActivo").checked : true
        };
        function finalizarGuardado(){
          mostrarToast("Componente guardado.");
          st.elementoId = elementoId;
          cerrarModalComponenteCotizadorFase1_();
          listarElementosCotizadorApiFase1_(st.tabId, function(res){
            st.elementos = rowsFromRespuestaFase1_(res).map(normalizarElementoCotizadorFase1_);
            renderComponentesCotizadorFase1_();
          }, function(err){ mostrarToast("No se pudieron recargar los elementos: " + ((err && err.message) || err)); });
        }
        guardarElementoCotizadorApiFase1_(registro, function(){
          if(tipo === "SECCIONES_ADICIONALES"){
            sincronizarSeccionesAdicionalesCotizadorFase1_(elementoId, finalizarGuardado, function(err){ mostrarToast("El componente se guardó, pero sus secciones no: " + ((err && err.message) || err)); });
          } else finalizarGuardado();
        }, function(err){ mostrarToast("No se pudo guardar el componente: " + ((err && err.message) || err)); });
      }

      function eliminarComponenteCotizadorFase1_(){
        const st = getCotizadorFase1State_();
        if(tabSoloLecturaCotizadorFase1_()){ mostrarToast("La sección asociada es de solo lectura."); return; }
        const elementoId = String(st.elementoId || "").trim();
        if(!elementoId){ mostrarToast("Seleccione un componente guardado para eliminar."); return; }
        if(!window.confirm("¿Desea eliminar el componente " + elementoId + "? La fila se conservará inactiva.")) return;
        fetchAutenticado("/api/cotizador/elementos/" + encodeURIComponent(elementoId), {method:"DELETE", headers:{"Accept":"application/json"}})
          .then(function(resp){ return resp.json().then(function(data){ if(!resp.ok || !data.ok) throw new Error(data.error || "No se pudo eliminar el componente."); return data; }); })
          .then(function(res){
            mostrarToast(res.mensaje || "Componente eliminado.");
            st.elementoId = "";
            cerrarModalComponenteCotizadorFase1_();
            listarElementosCotizadorApiFase1_(st.tabId, function(datos){
              st.elementos = rowsFromRespuestaFase1_(datos).map(normalizarElementoCotizadorFase1_);
              renderComponentesCotizadorFase1_();
            }, function(err){ mostrarToast((err && err.message) || "No se pudieron recargar los componentes."); });
          })
          .catch(function(err){ mostrarToast((err && err.message) || "No se pudo eliminar el componente."); });
      }

        const sel = byId("designerCotizadorElementoPadre");

        const actual = sel.value;
        sel.innerHTML = '<option value="">Sin componente padre</option>';

      function tituloCatalogoAplicabilidadFase1_(catalogoId){
        catalogoId = String(catalogoId || "").trim().toUpperCase();
        const mapa = {
          CATEGORIA_SERVICIO: "Categoría de servicio",
          TIPO_SERVICIO: "Tipo de servicio",
          TIPO_SERVICIO_ESPECIALIZADO: "Tipo de servicio especializado",
          TIPO_PROPUESTA: "Tipo de oferta",
          TIPO_PROPUESTA_SESUITE: "Tipo de oferta SeSuite",
          TIPO_OFERTA: "Tipo de oferta"
        };
        return mapa[catalogoId] || catalogoId.replace(/_/g," ").toLowerCase().replace(/\b\w/g,function(c){ return c.toUpperCase(); });
      }

      function textoValorAplicabilidadFase1_(v){
        return String(v.texto_visible || v.opcion || v.nombre || v.descripcion || v.clave || v.valor_id || "").trim();
      }

      function valorIdAplicabilidadFase1_(v){
        return String(v.valor_id || v.id || v.clave || textoValorAplicabilidadFase1_(v)).trim().toUpperCase();
      }

      function valoresAplicabilidadCotizadorFase1_(tipo){
        const st = getCotizadorFase1State_();
        const permitidoServicio = { CATEGORIA_SERVICIO:true, TIPO_SERVICIO:true, TIPO_SERVICIO_ESPECIALIZADO:true };
        const permitidoOferta = { TIPO_OFERTA:true, TIPO_PROPUESTA:true, TIPO_PROPUESTA_SESUITE:true };
        return (st.catalogoValores || []).filter(function(v){
          const cat = String(v.catalogo_id || "").trim().toUpperCase();
          if(!normalizarActivoCotizadorFase1_(v.activo)) return false;
          if(tipo === "TIPO_SERVICIO") return !!permitidoServicio[cat] || /^TIPO_SERVICIO/.test(cat);
          return !!permitidoOferta[cat] || /^TIPO_PROPUESTA/.test(cat) || /^TIPO_OFERTA/.test(cat);
        }).sort(function(a,b){
          const ca = String(a.catalogo_id || "").trim().toUpperCase();
          const cb = String(b.catalogo_id || "").trim().toUpperCase();
          if(ca !== cb) return ca.localeCompare(cb);
          return numeroOrdenCotizadorFase1_(a.orden)-numeroOrdenCotizadorFase1_(b.orden);
        });
      }

      function renderAplicabilidadSeccionCotizadorFase1_(){
        renderListaAplicabilidadTipoCotizadorFase1_("TIPO_SERVICIO", "designerAplicabilidadServicioLista", "designerBuscarAplicabilidadServicio");

      function renderListaAplicabilidadTipoCotizadorFase1_(tipo, contId, searchId){
        const cont = byId(contId);
        if(!cont) return;
        const q = normalizarTextoBusquedaParam_(byId(searchId) ? byId(searchId).value || "" : "");
        const selected = {};
        relacionesActivasTabCotizadorFase1_(tipo).forEach(function(r){ selected[String(r.valor_relacion_id || "").trim().toUpperCase()] = true; });
        let vals = valoresAplicabilidadCotizadorFase1_(tipo);
        if(q){
          vals = vals.filter(function(v){ return normalizarTextoBusquedaParam_([v.valor_id,v.clave,textoValorAplicabilidadFase1_(v),v.catalogo_id].join(" ")).indexOf(q)>=0; });
        }
        if(!vals.length){ cont.innerHTML = '<div class="designer-empty">No hay opciones disponibles para relacionar.</div>'; return; }
        const grupos = {};
        vals.forEach(function(v){
          const cat = String(v.catalogo_id || "SIN_CATALOGO").trim().toUpperCase();
          grupos[cat] = grupos[cat] || [];
          grupos[cat].push(v);
        });
        cont.innerHTML = Object.keys(grupos).map(function(cat){
          const rows = grupos[cat].map(function(v){
            const id = valorIdAplicabilidadFase1_(v);
            const txt = textoValorAplicabilidadFase1_(v) || id;
            return '<label class="cotizador-aplicabilidad-row" style="display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin:6px 0;border:1px solid #e5edf8;border-radius:12px;background:#fff;cursor:pointer;">'
              + '<input type="checkbox" data-aplicabilidad-tipo="'+escapeHtml(tipo)+'" value="'+escapeHtml(id)+'" '+(selected[id]?'checked':'')+' style="margin-top:3px;">'
              + '<span style="display:block;line-height:1.25;"><strong style="display:block;font-size:14px;color:#0b1f44;">'+escapeHtml(txt)+'</strong>'
              + '<small style="display:block;margin-top:3px;color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:.03em;">'+escapeHtml(tituloCatalogoAplicabilidadFase1_(cat))+'</small></span>'
              + '</label>';
          }).join("");
          return '<div class="cotizador-aplicabilidad-grupo" style="margin:8px 0 14px;">'
            + '<div style="font-size:12px;font-weight:800;color:#334155;text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px;">'+escapeHtml(tituloCatalogoAplicabilidadFase1_(cat))+'</div>'
            + rows
            + '</div>';
        }).join("");
      }

      function generarRelacionTabIdFase1_(tabId,tipo,valorId){
        return ["REL-TAB", tabId, tipo, valorId].join("-").replace(/[^A-Z0-9_-]+/g,"_").substring(0,140);
      }

      function guardarAplicabilidadSeccionCotizadorFase1_(){
        const st = getCotizadorFase1State_();
        if(!st.tabId){ mostrarToast("Seleccione una sección."); return; }
        const seleccionados = [];
        document.querySelectorAll('[data-aplicabilidad-tipo]').forEach(function(chk){
          if(chk.checked){ seleccionados.push({tipo:String(chk.getAttribute("data-aplicabilidad-tipo")||"").toUpperCase(), valor:String(chk.value||"").toUpperCase()}); }
        });
        const actuales = (st.relaciones || []).filter(function(r){ return String(r.tab_id || "").trim().toUpperCase() === st.tabId; });
        const seleccionMap = {};
        seleccionados.forEach(function(x){ seleccionMap[x.tipo+"|"+x.valor] = true; });
        const operaciones = [];
        actuales.forEach(function(r){
          const tipo = String(r.tipo_relacion || "").trim().toUpperCase();
          const valor = String(r.valor_relacion_id || "").trim().toUpperCase();
          if(["TIPO_SERVICIO","TIPO_OFERTA"].indexOf(tipo)<0) return;
          if(normalizarActivoCotizadorFase1_(r.activo) && !seleccionMap[tipo+"|"+valor]){
            operaciones.push({modulo:"tabs_cotizador_relaciones", payload:{id:String(r.relacion_id || generarRelacionTabIdFase1_(st.tabId,tipo,valor)).trim().toUpperCase(), activo:false}, estado:true});
          }
        });
        seleccionados.forEach(function(x){
          const relacionId = generarRelacionTabIdFase1_(st.tabId,x.tipo,x.valor);
          operaciones.push({modulo:"tabs_cotizador_relaciones", payload:{id_original:relacionId, registro:{relacion_id:relacionId, tab_id:st.tabId, tipo_relacion:x.tipo, valor_relacion_id:x.valor, activo:true}}, estado:false});
        });
        if(!operaciones.length){ cerrarAplicabilidadSeccionCotizadorFase1_(); mostrarToast("Sin cambios de aplicabilidad."); return; }
        let i=0;
        function next(){
          if(i>=operaciones.length){ cerrarAplicabilidadSeccionCotizadorFase1_(); mostrarToast("Aplicabilidad guardada."); cargarDatosCotizadorFase1_(true); return; }
          const op = operaciones[i++];
          if(op.estado) cambiarEstadoModuloParametrosFase1_(op.modulo, op.payload, next, function(err){ mostrarToast("Error guardando aplicabilidad: " + ((err&&err.message)||err)); next(); });
          else guardarModuloParametrosFase1_(op.modulo, op.payload, next, function(err){ mostrarToast("Error guardando aplicabilidad: " + ((err&&err.message)||err)); next(); });
        }
        next();
      }

      function cargarResumenAplicabilidadSeccionCotizadorFase1_(){
        const box = byId("designerCotizadorAplicabilidadResumen");
        if(!box) return;
        const serv = relacionesActivasTabCotizadorFase1_("TIPO_SERVICIO").length;
        const ofer = relacionesActivasTabCotizadorFase1_("TIPO_OFERTA").length;
        box.textContent = "Aplicabilidad: " + serv + " tipo(s) de servicio y " + ofer + " tipo(s) de oferta relacionados.";
      }

      function cambiarTabCotizadorDesigner(tab){
        seleccionarTabCotizadorFase1_(tab);
      }

      function seleccionarCampoCotizadorDesigner(el){
        if(el && el.getAttribute("data-elemento-id")) seleccionarComponenteCotizadorFase1_(el.getAttribute("data-elemento-id"));
      }

      function cambiarPantallaDesigner(pantalla){
        pantalla = pantalla || "catalogos";
        const d = state.disenadorCotiza || {};
        d.pantalla = pantalla;
        state.disenadorCotiza = d;
        ["catalogos","cotizador","reglas"].forEach(function(p){
          const step = byId("designerStep" + (p === "catalogos" ? "Catalogos" : p === "cotizador" ? "Cotizador" : "Reglas"));
          if(step){
            step.classList.toggle("active", p === pantalla);
            if(p === pantalla) step.setAttribute("aria-current", "step");
            else step.removeAttribute("aria-current");
          }
        });
        if(byId("designerCatalogosView")) byId("designerCatalogosView").classList.toggle("hidden", pantalla !== "catalogos");
        if(byId("designerCotizadorView")) byId("designerCotizadorView").classList.toggle("hidden", pantalla !== "cotizador");
        if(byId("designerReglasView")) byId("designerReglasView").classList.toggle("hidden", pantalla !== "reglas");
        const head = byId("designerTituloModulo") ? byId("designerTituloModulo").closest(".designer-page-head") : null;
        if(head) head.classList.remove("hidden");
        if(byId("designerTituloModulo")) byId("designerTituloModulo").textContent = pantalla === "catalogos" ? "Catálogos" : pantalla === "cotizador" ? "Cotizador" : "Reglas";
        if(byId("designerSubtituloModulo")) byId("designerSubtituloModulo").textContent = pantalla === "catalogos" ? "Defina y relacione los catálogos del cotizador." : pantalla === "cotizador" ? "Diseñe secciones, componentes visuales y la estructura base de la calculadora." : "Busque, cree y ajuste reglas y fórmulas del cotizador.";
        if(pantalla === "cotizador") inicializarCotizadorFase1(false);
      }



  window.bindDesignerCotizadorEventos = bindDesignerCotizadorEventos;
  window.inicializarCotizadorFase1 = inicializarCotizadorFase1;
  window.cambiarPantallaDesigner = cambiarPantallaDesigner;
  window.cambiarTabCotizadorDesigner = cambiarTabCotizadorDesigner;
  window.seleccionarCampoCotizadorDesigner = seleccionarCampoCotizadorDesigner;
})(window.__cotizaCore || {});
</script>
