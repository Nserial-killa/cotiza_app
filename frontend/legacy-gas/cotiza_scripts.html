



<script>
window.CotizaApp = (function(){
      const ESTADOS = [
        "Borrador",
        "Revisión Comercial",
        "Enviada al Cliente",
        "Vista por el Cliente",
        "Cambios solicitados",
        "Aceptada",
        "Ganada",
        "Perdida",
        "Vencida",
        "Cancelada"
      ];

      const state = {
        iniciado:false,
        usuario:null,
        calculadoras:[],
        clientes:[],
        usuarios:[],
        cotizaciones:[],
        gestorDetalle:null,
        gestorVistaAnterior:"lista",
        dashboard:null,
        formasPago:[],
        serviciosProductos:[],
        modelosCobroParametros:[],
        catalogosParametros:null,
        parametrosCargados:false,
        paramModuloActual:"",
        parametrosModuloCache:{},
        parametrosCatalogos:{},
        parametrosFiltros:{},
        parametrosPaginacion:{},
        filasPorPaginaParametros:10,
        compilacionResultadoTexto:"",
        compilacionResultadoNombre:"validacion_cotizador.txt",
        compilacionCotizadorPendiente:"",
        usuariosAdmin:[],
        rolesAdmin:[]
      };

      function init(){
        if(state.iniciado) return;
        state.iniciado = true;

        bind("btnLogin","click",login);
        bind("loginPin","keydown",function(e){ if(e.key === "Enter") login(); });
        bind("btnNuevoUsuario","click",function(){ abrirModalUsuario(); });
        bind("btnCerrarModalUsuario","click",cerrarModalUsuario);
        bind("btnCancelarUsuario","click",cerrarModalUsuario);
        bind("btnGuardarUsuario","click",guardarUsuarioModal);
        (function(){
          const modalUsuarioEl = byId("modalUsuario");
          if(modalUsuarioEl){
            modalUsuarioEl.addEventListener("click",function(e){
              if(e.target && e.target.id === "modalUsuario") cerrarModalUsuario();
            });
          }
        })();
        bind("loginCorreo","keydown",function(e){ if(e.key === "Enter") login(); });
        bind("btnLogout","click",logout);
        bind("btnToggleSidebarPrincipal","click",function(){ alternarSidebarPrincipal(); });
        inicializarSidebarPrincipal();
        bind("btnDashboardRefresh","click",function(){ cargarDashboard(); cargarCotizaciones(); });
        bind("filtroDashboardCalculadora","change",function(){ cargarDashboard(); if(state.dashboard) renderDashboard(state.dashboard); });
        bind("dashboardVendedor","change",function(){ if(state.dashboard) renderDashboard(state.dashboard); });
        bind("dashboardTipoCliente","change",function(){ if(state.dashboard) renderDashboard(state.dashboard); });
        bind("btnNuevaCotizacion","click",abrirModalCalculadoras);
        bind("btnCerrarModalCalculadoras","click",cerrarModalCalculadoras);
        bind("btnCancelarNuevaCotizacion","click",cerrarModalCalculadoras);
        bind("btnCrearNuevaCotizacion","click",crearNuevaCotizacion);
        bind("btnBuscarCotizaciones","click",cargarCotizaciones);
        bind("filtroBusqueda","keydown",function(e){ if(e.key === "Enter") cargarCotizaciones(); });
        bind("btnVolverListadoCotizaciones","click",mostrarListadoCotizacionesV2);
        bind("btnCerrarCotizadorIntegrado","click",cerrarCotizadorIntegradoV2);
        bind("btnEditarCotizacionGestor","click",editarCotizacionDesdeDetalleV2);
        bind("btnNuevaVersionGestor","click",crearNuevaVersionDesdeDetalleV2);
        bind("btnGenerarLinkGestor","click",generarLinkDesdeDetalleV2);
        bind("gestorEstadoNuevo","change",cambiarEstadoSeleccionadoGestorV2);
        bind("btnCambiarEstadoGestor","click",actualizarEstadoGestorV2);
        bind("btnGuardarRuntimeCotizador","click",guardarRuntimeCotizador);
        bind("btnActualizarFormasPago","click",refrescarParametrosActivos);
        bind("btnNuevoServicioProducto","click",function(){ abrirModalServicioProducto(); });
        bind("btnCerrarModalServicio","click",cerrarModalServicioProducto);
        bind("btnCancelarServicio","click",cerrarModalServicioProducto);
        bind("btnGuardarServicio","click",guardarServicioProducto);
        bind("servicioCalculadora","change",function(){ renderServiciosRelacionadosServicio([]); });
        bind("btnNuevaFormaPago","click",function(){ abrirModalFormaPago(); });
        bind("btnCerrarModalFormaPago","click",cerrarModalFormaPago);
        bind("btnCancelarFormaPago","click",cerrarModalFormaPago);
        bind("btnGuardarFormaPago","click",guardarFormaPago);
        bind("paramCotizadorSelector","change",function(){ cambiarCotizadorConfiguracion(); });
        bind("paramModuloSelector","change",function(){ cambiarModuloParametros(byId("paramModuloSelector").value || "parametros_globales"); });
        bind("btnValidarCotizadorSeleccionado","click",validarCotizadorSeleccionado);
        bind("btnCompilarCotizadorSeleccionado","click",compilarCotizadorSeleccionado);
        bind("btnActualizarParametros","click",function(){ cargarModuloParametros(state.paramModuloActual || "parametros_globales", true); });
        bind("btnCerrarModalParametro","click",cerrarModalParametroGeneral);
        bind("btnCancelarParametro","click",cerrarModalParametroGeneral);
        bind("btnGuardarParametro","click",guardarParametroGeneral);
        bind("btnCerrarModalCompilacionX","click",cerrarModalCompilacion);
        bind("btnCerrarModalCompilacion","click",cerrarModalCompilacion);
        bind("btnCopiarResultadoCompilacion","click",copiarResultadoCompilacion);
        bind("btnGuardarResultadoCompilacionTxt","click",guardarResultadoCompilacionTxt);
        bind("btnEjecutarCompilacionConfirmada","click",ejecutarCompilacionPendiente);
        bind("btnParamTabFormasPago","click",function(){ cambiarTabParametros("formasPago"); });
        bind("btnParamTabCalculadora","click",function(){ cambiarTabParametros("calculadora"); });
        bind("btnParamTabServicios","click",function(){ cambiarTabParametros("servicios"); });
        bind("btnParamTabReglas","click",function(){ cambiarTabParametros("reglas"); });
        bind("paramSvcCalculadora","change",renderServiciosProductos);
        bind("paramSvcEstado","change",renderServiciosProductos);
        bind("paramSvcBusqueda","input",renderServiciosProductos);
        bind("btnLimpiarFiltrosServicios","click",limpiarFiltrosServiciosProductos);
        bind("paramFpCalculadora","change",function(){ prepararCombosFormasPago(); renderFormasPago(); });
        bind("paramFpServicio","change",renderFormasPago);
        bind("paramFpEstado","change",renderFormasPago);
        bind("paramFpBusqueda","input",renderFormasPago);
        bind("btnLimpiarFiltrosFormasPago","click",limpiarFiltrosFormasPago);
        bind("formaPagoCalculadora","change",actualizarServiciosModalFormaPago);

        document.querySelectorAll(".nav button").forEach(function(btn){
          btn.addEventListener("click",function(){
            cambiarSeccion(btn.dataset.section);
          });
        });

        ["filtroBusqueda","filtroEstado","filtroCalculadora","filtroUsuario","filtroFechaDesde"].forEach(function(id){
          const el = byId(id);
          if(!el) return;

          el.addEventListener("change",cargarCotizaciones);

          if(id === "filtroBusqueda"){
            el.addEventListener("keydown",function(e){
              if(e.key === "Enter") cargarCotizaciones();
            });
          }
        });

        const modal = byId("modalCalculadoras");
        if(modal){
          modal.addEventListener("click",function(e){
            if(e.target.id === "modalCalculadoras") cerrarModalCalculadoras();
          });
        }

        const modalSvc = byId("modalServicioProducto");
        if(modalSvc){
          modalSvc.addEventListener("click",function(e){
            if(e.target.id === "modalServicioProducto") cerrarModalServicioProducto();
          });
        }

        const modalFp = byId("modalFormaPago");
        if(modalFp){
          modalFp.addEventListener("click",function(e){
            if(e.target.id === "modalFormaPago") cerrarModalFormaPago();
          });
        }

        const modalComp = byId("modalCompilacionCotizador");
        if(modalComp){
          modalComp.addEventListener("click",function(e){
            if(e.target.id === "modalCompilacionCotizador") cerrarModalCompilacion();
          });
        }

        llenarComboEstados();
        cargarSesionGuardada();
      }

      function bind(id,event,fn){
        const el = byId(id);
        if(el) el.addEventListener(event,fn);
      }

      function byId(id){
        return document.getElementById(id);
      }

      // MIGRADA a fetch() en el Sprint 1 — antes usaba
      // google.script.run.webValidarUsuario(correo, pin).
      // Lo único que cambió es el transporte: los ids del HTML
      // (loginCorreo/loginPin/loginView) y las funciones de apoyo
      // (byId, setLoginMessage, setLoading, iniciarApp) siguen igual.
      async function login(){
        const correo = (byId("loginCorreo") && byId("loginCorreo").value ? byId("loginCorreo").value : "").trim();
        const pin = (byId("loginPin") && byId("loginPin").value ? byId("loginPin").value : "").trim();

        setLoginMessage("", "");

        if(!correo || !pin){
          setLoginMessage("Debe indicar correo y PIN.", "error");
          return;
        }

        setLoading("loginView", true);
        setLoginMessage("Validando acceso...", "");

        try{
          const resp = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ correo: correo, pin: pin })
          });

          let res = null;
          try{
            res = await resp.json();
          }catch(e){
            res = null;
          }

          if(!resp.ok || !res || !res.ok){
            throw new Error((res && res.error) ? res.error : "No fue posible validar el usuario.");
          }

          const usuario = res.usuario || {};

          if(!usuario.puede_ver_gestor){
            throw new Error("El usuario no tiene acceso al gestor de cotizaciones.");
          }

          localStorage.setItem("cotiza_usuario", JSON.stringify(usuario));
          localStorage.setItem("cotiza_token", res.token || "");
          setLoginMessage("Acceso correcto. Cargando Cotiza...", "ok");
          iniciarApp(usuario);

        }catch(error){
          const mensaje = (error && error.message) ? error.message : "Error de conexión con el servidor.";
          setLoginMessage(mensaje, "error");
          mostrarToast(mensaje);
          setLoading("loginView", false);
        }
      }

      // Sprint 3: sin token guardado no hay sesión, aunque todavía
      // quede cotiza_usuario en localStorage (por ejemplo, si alguien
      // borró solo el token a mano desde las herramientas de
      // desarrollador). En ese caso, tratarlo igual que si nunca
      // hubiera iniciado sesión.
      function cargarSesionGuardada(){
        try{
          const raw = localStorage.getItem("cotiza_usuario");
          const token = localStorage.getItem("cotiza_token");

          if(!raw || !token){
            limpiarSesionCotiza();
            return;
          }

          const usuario = JSON.parse(raw);

          if(usuario && usuario.usuario_id){
            iniciarApp(usuario);
          }else{
            limpiarSesionCotiza();
          }
        }catch(error){
          limpiarSesionCotiza();
        }
      }

      function iniciarApp(usuario){
        state.usuario = usuario;

        if(byId("loginView")) byId("loginView").classList.add("hidden");
        if(byId("appView")) byId("appView").classList.remove("hidden");
        inicializarSidebarPrincipal();

        setText("sidebarNombre", usuario.nombre || "Usuario");
        setText("sidebarCorreo", usuario.correo || "");
        setText("sidebarRol", usuario.rol || "");

        setLoading("loginView", false);

        cargarDatosBase(function(){
          cargarDashboard();
          cargarCotizaciones();
        });
      }

      // Cierra la sesión también del lado del servidor (borra la fila
      // de "sesiones") antes de olvidar el token localmente — así el
      // token no sigue siendo válido si alguien lo capturó. Si la
      // llamada falla (sin red, sesión ya vencida, etc.) igual se
      // cierra sesión localmente: no tiene sentido dejar a alguien
      // atrapado en la app porque el logout no pudo avisarle al
      // servidor.
      async function logout(){
        try{
          await fetchAutenticado("/api/auth/logout", { method:"DELETE" });
        }catch(error){
          // Silencioso a propósito: el logout local sigue de largo.
        }
        cerrarSesionLocal_();
      }

      // Limpia únicamente el almacenamiento — usar cuando el servidor
      // ya invalidó la sesión (o nunca la tuvo) y solo falta reflejarlo
      // en el navegador. logout() es la versión completa (también le
      // avisa al servidor).
      function limpiarSesionCotiza(){
        try{
          localStorage.removeItem("cotiza_usuario");
          localStorage.removeItem("cotiza_token");
        }catch(error){}
      }

      function cerrarSesionLocal_(){
        limpiarSesionCotiza();

        state.usuario = null;
        state.calculadoras = [];
        state.usuarios = [];
        state.cotizaciones = [];

        if(byId("appView")) byId("appView").classList.add("hidden");
        if(byId("loginView")) byId("loginView").classList.remove("hidden");
        if(byId("loginPin")) byId("loginPin").value = "";

        setLoginMessage("", "");
      }

      // Punto único para reaccionar a un 401: cualquier fetchAutenticado()
      // que lo reciba pasa por acá, así ninguna pantalla tiene que
      // manejar "mi sesión venció" por su cuenta.
      function manejarSesionExpirada(){
        cerrarSesionLocal_();
        setLoginMessage("Su sesión expiró, inicie sesión de nuevo.", "error");
      }

      // fetch() con el header Authorization puesto automáticamente
      // desde el token guardado en localStorage. login() es la única
      // llamada que NO pasa por acá (es pública, todavía no hay token
      // que mandar). Cualquier 401 dispara manejarSesionExpirada() acá
      // mismo, antes de que el código que llamó se entere — así el
      // caso "la sesión venció" queda resuelto en un solo lugar.
      async function fetchAutenticado(url, opciones){
        opciones = opciones || {};
        const headers = Object.assign({}, opciones.headers || {});

        let token = null;
        try{ token = localStorage.getItem("cotiza_token"); }catch(error){ token = null; }
        if(token) headers["Authorization"] = "Bearer " + token;

        const resp = await fetch(url, Object.assign({}, opciones, { headers: headers }));

        if(resp.status === 401){
          manejarSesionExpirada();
        }

        return resp;
      }

      function cargarDatosBase(callback){
        let pendientes = 2;

        function done(){
          pendientes--;
          if(pendientes <= 0 && typeof callback === "function"){
            callback();
          }
        }

        cargarCalculadoras(done);
        cargarUsuariosActivos(done);
      }

      // MIGRADA en el cierre del Sprint 4 — antes usaba
      // google.script.run.webListarCalculadorasPorUsuario(...), que el
      // shim siempre respondía con calculadoras:[] (por eso el filtro
      // de "Cotizador" en Cotizaciones nunca tenía opciones reales).
      async function cargarCalculadoras(callback){
        if(!state.usuario){
          if(callback) callback();
          return;
        }

        try{
          const resp = await fetchAutenticado("/api/calculadoras");
          let res = null;
          try{ res = await resp.json(); }catch(e){ res = null; }
          if(!resp.ok || !res || !res.ok){
            throw new Error((res && res.error) || "No fue posible cargar cotizadores.");
          }
          state.calculadoras = res.calculadoras || [];
          llenarComboCalculadoras();
        }catch(error){
          mostrarToast(error && error.message ? error.message : "No fue posible cargar cotizadores.");
        }finally{
          if(callback) callback();
        }
      }

      // MIGRADA en el cierre del Sprint 4 — antes usaba
      // google.script.run.webListarUsuariosActivos(...), mismo
      // problema que cargarCalculadoras: el shim siempre respondía
      // usuarios:[], así que el filtro de "Responsable" en
      // Cotizaciones nunca tenía opciones reales.
      async function cargarUsuariosActivos(callback){
        if(!state.usuario){
          if(callback) callback();
          return;
        }

        try{
          const resp = await fetchAutenticado("/api/usuarios");
          let res = null;
          try{ res = await resp.json(); }catch(e){ res = null; }
          if(!resp.ok || !res || !res.ok){
            throw new Error((res && res.error) || "No fue posible cargar usuarios.");
          }
          state.usuarios = res.usuarios || [];
          llenarComboUsuarios();
        }catch(error){
          mostrarToast(error && error.message ? error.message : "No fue posible cargar usuarios.");
        }finally{
          if(callback) callback();
        }
      }

      function llenarComboEstados(){
        const select = byId("filtroEstado");
        if(!select) return;

        select.innerHTML = '<option value="">Todos</option>';

        ESTADOS.forEach(function(estado){
          const option = document.createElement("option");
          option.value = estado;
          option.textContent = estado;
          select.appendChild(option);
        });
      }

      function llenarComboCalculadoras(){
        const selects = [
          byId("filtroCalculadora"),
          byId("filtroDashboardCalculadora"),
          byId("paramCotizadorSelector")
        ].filter(Boolean);

        if(!selects.length) return;

        selects.forEach(function(select){
          const valorActual = select.value || "";
          select.innerHTML = select.id === "paramCotizadorSelector" ? '<option value="">Seleccione un cotizador</option>' : '<option value="">Todas</option>';

          state.calculadoras.forEach(function(calc){
            const option = document.createElement("option");
            option.value = calc.calculadora_id || "";
            option.textContent = calc.nombre_calculadora || calc.calculadora_id || "Cotizador";
            select.appendChild(option);
          });

          if(valorActual){
            select.value = valorActual;
          }
        });
      }

      function llenarComboUsuarios(){
        const select = byId("filtroUsuario");
        if(!select) return;

        select.innerHTML = '<option value="">Todos los usuarios</option>';

        state.usuarios.forEach(function(usuario){
          const option = document.createElement("option");
          option.value = usuario.usuario_id || "";
          option.textContent = usuario.nombre || usuario.correo || usuario.usuario_id || "Usuario";
          select.appendChild(option);
        });
      }

      function cargarDashboard(){
        if(!state.usuario) return;

        setLoading("section-dashboard", true);

        google.script.run
          .withSuccessHandler(function(res){
            try{
              if(!res || !res.ok){
                throw new Error((res && res.error) ? res.error : "No fue posible cargar el dashboard.");
              }

              state.dashboard = res;
              renderDashboard(res);

            }catch(error){
              mostrarToast(error.message || "Error cargando dashboard.");
            }finally{
              setLoading("section-dashboard", false);
            }
          })
          .withFailureHandler(function(error){
            setLoading("section-dashboard", false);
            mostrarToast(error && error.message ? error.message : "Error cargando dashboard.");
          })
          .webObtenerDashboardPorUsuario(
            state.usuario.usuario_id || "",
            state.usuario.correo || "",
            byId("filtroDashboardCalculadora") ? byId("filtroDashboardCalculadora").value || "" : ""
          );
      }

      function renderDashboard(data){
        const k = data.kpis || {};
        const rows = obtenerCotizacionesDashboard(data);
        const resumen = calcularResumenDashboard(rows, k);

        setText("kpiCotizacionesVigentes", formatoNumero(resumen.vigentes));
        setText("kpiMontoCotizadoDash", formatoMoneda(resumen.monto_cotizado));
        setText("kpiAceptadas", formatoNumero(resumen.aceptadas));
        setText("kpiMontoAceptado", formatoMoneda(resumen.monto_aceptado));
        setText("kpiGanadasDash", formatoNumero(resumen.ganadas));
        setText("kpiMontoGanado", formatoMoneda(resumen.monto_ganado));
        setText("kpiPerdidas", formatoNumero(resumen.perdidas));
        setText("kpiVencidasCanceladas", formatoNumero(resumen.vencidas_canceladas));

        setText("kpiTicketPromedio", formatoMoneda(resumen.ticket_promedio));
        setText("kpiMargenPromedio", formatoPorcentaje(resumen.margen_promedio));
        setText("kpiTiempoCiclo", resumen.tiempo_ciclo || "—");
        setText("kpiTasaAceptacion", formatoPorcentaje(resumen.tasa_aceptacion));
        setText("kpiTasaGanancia", formatoPorcentaje(resumen.tasa_ganancia));

        renderSegmentacionClientes(rows, resumen);
        renderTendenciaDashboard(rows);
        renderFunnel("funnelCantidad", resumen.estados_cantidad, false);
        renderFunnel("funnelMonto", resumen.estados_monto, true);

        renderSpark("sparkVigentes", [1,2,2,3,2,4,5]);
        renderSpark("sparkCotizado", [8,10,9,14,12,17,21], "#12b76a");
        renderSpark("sparkAceptadas", [0,1,1,2,1,3,3], "#7a5af8");
        renderSpark("sparkAceptadoMonto", [2,5,4,7,6,9,12], "#fdb022");
        renderSpark("sparkGanadas", [0,0,1,1,1,2,2], "#12b76a");
        renderSpark("sparkGanadoMonto", [1,1,3,2,4,4,6], "#12b76a");
        renderSpark("sparkPerdidas", [1,0,1,1,2,1,0], "#f04438");
        renderSpark("sparkCerradas", [0,1,1,2,2,3,4], "#667085");
      }

      function obtenerCotizacionesDashboard(data){
        let rows = [];

        if(state.cotizaciones && state.cotizaciones.length){
          rows = state.cotizaciones.slice();
        }else if(data && data.cotizaciones_recientes && data.cotizaciones_recientes.length){
          rows = data.cotizaciones_recientes.slice();
        }

        rows = obtenerUltimaVersionPorCotizacion(rows);

        const calc = byId("filtroDashboardCalculadora") ? byId("filtroDashboardCalculadora").value || "" : "";
        const vendedor = byId("dashboardVendedor") ? byId("dashboardVendedor").value || "" : "";
        const tipo = byId("dashboardTipoCliente") ? byId("dashboardTipoCliente").value || "" : "";

        return rows.filter(function(c){
          const okCalc = !calc || String(c.calculadora_id || "") === String(calc);
          const okVend = !vendedor || String(c.vendedor || "") === String(vendedor);
          const okTipo = !tipo || normalizarTipoCliente(c.tipo_cliente || c.tipoCliente || "") === tipo;
          return okCalc && okVend && okTipo;
        });
      }

      function obtenerUltimaVersionPorCotizacion(rows){
        const mapa = {};

        (rows || []).forEach(function(c){
          const key = String(c.cotizacion_id || c.codigo_oferta || "").trim();
          if(!key) return;

          const actual = mapa[key];
          if(!actual){
            mapa[key] = c;
            return;
          }

          const v1 = Number(actual.version || 0);
          const v2 = Number(c.version || 0);

          if(v2 > v1){
            mapa[key] = c;
            return;
          }

          if(v2 === v1 && compararFecha(c.fecha_actualizacion, actual.fecha_actualizacion) > 0){
            mapa[key] = c;
          }
        });

        return Object.keys(mapa).map(function(k){ return mapa[k]; });
      }

      function compararFecha(a,b){
        const da = new Date(a || 0).getTime() || 0;
        const db = new Date(b || 0).getTime() || 0;
        return da - db;
      }

      function calcularResumenDashboard(rows, k){
        const ordenEstados = [
          "Borrador",
          "Revisión Comercial",
          "Enviada al Cliente",
          "Vista por el Cliente",
          "Cambios solicitados",
          "Aceptada",
          "Ganada",
          "Perdida",
          "Vencida",
          "Cancelada"
        ];

        const estadosCantidad = {};
        const estadosMonto = {};
        ordenEstados.forEach(function(e){
          estadosCantidad[e] = 0;
          estadosMonto[e] = 0;
        });

        let total = 0;
        let montoCotizado = 0;
        let aceptadas = 0;
        let ganadas = 0;
        let perdidas = 0;
        let vencidasCanceladas = 0;
        let montoAceptado = 0;
        let montoGanado = 0;
        let margenAcum = 0;
        let margenCount = 0;
        let enviadasBase = 0;

        (rows || []).forEach(function(c){
          const estado = String(c.estado || "Sin estado").trim() || "Sin estado";
          const estadoNorm = normalizarTexto(estado);
          const monto = numero(c.total_precio);
          const margen = numero(c.margen_total);

          total++;
          montoCotizado += monto;

          if(!estadosCantidad[estado]) estadosCantidad[estado] = 0;
          if(!estadosMonto[estado]) estadosMonto[estado] = 0;
          estadosCantidad[estado]++;
          estadosMonto[estado] += monto;

          if(estadoNorm === "aceptada"){
            aceptadas++;
            montoAceptado += monto;
          }

          if(estadoNorm === "ganada"){
            ganadas++;
            montoGanado += monto;
          }

          if(estadoNorm === "perdida"){
            perdidas++;
          }

          if(estadoNorm === "vencida" || estadoNorm === "cancelada"){
            vencidasCanceladas++;
          }

          if(["enviada al cliente","vista por el cliente","cambios solicitados","aceptada","ganada","perdida","cancelada","vencida"].indexOf(estadoNorm) >= 0){
            enviadasBase++;
          }

          if(margen){
            margenAcum += Math.abs(margen) <= 1 ? margen * 100 : margen;
            margenCount++;
          }
        });

        if(!rows.length && k){
          total = Number(k.cotizaciones_mes || 0);
          montoCotizado = Number(k.monto_cotizado || 0);
          ganadas = Number(k.ganadas || 0);
          aceptadas = Number(k.aceptadas || 0);
          perdidas = Number(k.perdidas || 0);
        }

        return {
          total: total,
          vigentes: (rows || []).filter(function(c){ return ["perdida","vencida","cancelada"].indexOf(normalizarTexto(c.estado)) < 0; }).length || total,
          monto_cotizado: montoCotizado,
          aceptadas: aceptadas,
          monto_aceptado: montoAceptado,
          ganadas: ganadas,
          monto_ganado: montoGanado,
          perdidas: perdidas,
          vencidas_canceladas: vencidasCanceladas,
          ticket_promedio: total ? montoCotizado / total : Number(k.ticket_promedio_general || 0),
          margen_promedio: margenCount ? margenAcum / margenCount : Number(k.margen_promedio || 0),
          tasa_aceptacion: enviadasBase ? (aceptadas / enviadasBase) * 100 : 0,
          tasa_ganancia: enviadasBase ? (ganadas / enviadasBase) * 100 : 0,
          tiempo_ciclo: "—",
          estados_cantidad: estadosCantidad,
          estados_monto: estadosMonto
        };
      }

      function renderTendenciaDashboard(rows){
        const box = byId("trendChart");
        if(!box) return;

        const meses = {};
        (rows || []).forEach(function(c){
          const fecha = new Date(c.fecha_creacion || c.fecha_actualizacion || "");
          if(isNaN(fecha.getTime())) return;
          const key = fecha.getFullYear() + "-" + String(fecha.getMonth()+1).padStart(2,"0");
          if(!meses[key]) meses[key] = {count:0,monto:0,label:fecha.toLocaleDateString("es-CR",{month:"short",year:"numeric"})};
          meses[key].count++;
          meses[key].monto += numero(c.total_precio);
        });

        let arr = Object.keys(meses).sort().map(function(k){ return meses[k]; });

        if(!arr.length){
          arr = [
            {label:"Ene",count:0,monto:0},
            {label:"Feb",count:0,monto:0},
            {label:"Mar",count:0,monto:0},
            {label:"Abr",count:0,monto:0},
            {label:"May",count:0,monto:0},
            {label:"Jun",count:0,monto:0}
          ];
        }

        arr = arr.slice(-7);

        const maxCount = Math.max.apply(null, arr.map(function(x){ return x.count; }).concat([1]));
        const maxMonto = Math.max.apply(null, arr.map(function(x){ return x.monto; }).concat([1]));
        const w = 720, h = 230, pad = 34;
        const xStep = arr.length > 1 ? (w - pad * 2) / (arr.length - 1) : 1;

        function pointCount(item,i){
          const x = pad + i * xStep;
          const y = h - pad - ((item.count / maxCount) * (h - pad * 2));
          return [x,y];
        }

        function pointMonto(item,i){
          const x = pad + i * xStep;
          const y = h - pad - ((item.monto / maxMonto) * (h - pad * 2));
          return [x,y];
        }

        const countPts = arr.map(pointCount);
        const montoPts = arr.map(pointMonto);
        const countLine = countPts.map(function(p){ return p.join(","); }).join(" ");
        const montoLine = montoPts.map(function(p){ return p.join(","); }).join(" ");

        const grid = [0,1,2,3].map(function(i){
          const y = pad + i * ((h - pad*2)/3);
          return '<line x1="' + pad + '" y1="' + y + '" x2="' + (w-pad) + '" y2="' + y + '" stroke="#eef2f7" stroke-width="1"/>';
        }).join("");

        const labels = arr.map(function(item,i){
          const x = pad + i * xStep;
          return '<text x="' + x + '" y="' + (h-6) + '" text-anchor="middle" font-size="11" fill="#667085">' + escapeHtml(item.label) + '</text>';
        }).join("");

        const dots = countPts.map(function(p,i){
          return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4" fill="#1f6fff"/><text x="' + p[0] + '" y="' + (p[1]-9) + '" text-anchor="middle" font-size="11" fill="#08224a" font-weight="700">' + arr[i].count + '</text>';
        }).join("") + montoPts.map(function(p){
          return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4" fill="#12b76a"/>';
        }).join("");

        box.innerHTML =
          '<div class="trend-legend"><span><i class="legend-dot legend-blue"></i>Cantidad</span><span><i class="legend-dot legend-green"></i>Monto cotizado</span></div>' +
          '<svg class="trend-svg" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
            grid +
            '<polyline points="' + montoLine + '" fill="none" stroke="#12b76a" stroke-width="3"/>' +
            '<polyline points="' + countLine + '" fill="none" stroke="#1f6fff" stroke-width="3"/>' +
            dots +
            labels +
          '</svg>';
      }

      function normalizarTipoCliente(v){
        const t = normalizarTexto(v);
        if(t === "existente" || t === "cliente existente" || t === "cliente"){
          return "Cliente existente";
        }
        return "Prospecto";

      function normalizarTexto(v){
        return String(v || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g,"")
          .toLowerCase()
          .trim();
      }

      // V16: helper requerido por el buscador de catalogos del disenador.
      // El render de catalogos lo invoca como normalizarTextoBusquedaParam_().
      // Si no existe, el successHandler falla y la pantalla queda en "Cargando catalogos...".
      function normalizarTextoBusquedaParam_(v){
        return normalizarTexto(v);
      }

      // V17: helpers requeridos por el render del diseñador de catálogos.
      // Apps Script protege los callbacks; si falta uno de estos helpers,
      // el successHandler se corta y la pantalla queda en "Cargando catálogos...".
      function sortByOrdenParam_(a,b){
        const oa = Number(a && a.orden !== undefined && a.orden !== null && a.orden !== "" ? a.orden : 9999);
        const ob = Number(b && b.orden !== undefined && b.orden !== null && b.orden !== "" ? b.orden : 9999);
        if(oa !== ob) return oa - ob;

        const na = String((a && (a.nombre_catalogo || a.opcion || a.catalogo_id || a.valor_id || a.clave)) || "").toLowerCase();
        const nb = String((b && (b.nombre_catalogo || b.opcion || b.catalogo_id || b.valor_id || b.clave)) || "").toLowerCase();
        return na.localeCompare(nb);
      }

      function isActivoParam_(v){
        if(v === true || v === 1) return true;
        if(v === false || v === 0) return false;
        const t = normalizarTexto(v);
        if(!t) return true;
        return ["true","si","sí","s","1","activo","activa","yes","y"].indexOf(t) >= 0;
      }

        if(!cat) return "";
        return String(cat.catalogo_padre_id || cat.catalogo_padre || cat.padre_catalogo_id || cat.padre_id || "").toUpperCase();

      function getValorTextoVisibleDesigner(v){
        if(!v) return "";
        return String(v.texto_visible || v.opcion || v.label || v.nombre || v.clave || "");
      }

      function getValorSistemaDesigner(v){
        if(!v) return "";

      function getValorPadreIdDesigner(v){
        if(!v) return "";
        return String(v.valor_padre_id || v.depende_de || v.valor_padre || v.padre || v.categoria_padre || "");
      }

      function numero(v){
        if(typeof v === "number") return v;
        const s = String(v === undefined || v === null ? "0" : v).replace(/\s/g,"").replace(/,/g,".");
        const n = Number(s);
        return isNaN(n) ? 0 : n;
      }

      async function cargarCotizaciones(){
        if(!state.usuario) return;

        setLoading("section-cotizaciones", true);

        const params = new URLSearchParams({
          busqueda:(byId("filtroBusqueda") && byId("filtroBusqueda").value ? byId("filtroBusqueda").value : "").trim(),
          estado:byId("filtroEstado") ? byId("filtroEstado").value : "",
          calculadora_id:byId("filtroCalculadora") ? byId("filtroCalculadora").value : "",
          filtro_usuario_id:byId("filtroUsuario") ? byId("filtroUsuario").value : "",
          fecha_desde:byId("filtroFechaDesde") ? byId("filtroFechaDesde").value : ""
        });

        try{
          const resp = await fetchAutenticado("/api/cotizaciones?" + params.toString());
          let res = null;
          try{ res = await resp.json(); }catch(e){ res = null; }
          if(!resp.ok || !res || !res.ok){
            throw new Error((res && res.error) ? res.error : "No fue posible cargar cotizaciones.");
          }

          state.cotizaciones = res.cotizaciones || [];
          llenarComboDashboardVendedores();
          renderCotizaciones(state.cotizaciones);
          if(state.dashboard){
            renderDashboard(state.dashboard);
          }

        }catch(error){
          mostrarToast(error.message || "Error cargando cotizaciones.");
        }finally{
          setLoading("section-cotizaciones", false);
        }
      }

        try{
          const resp=await fetchAutenticado("/api/clientes");

      async function crearNuevaCotizacion(){
        const clienteId=(byId("nuevaCotizacionCliente")?byId("nuevaCotizacionCliente").value:"").trim();
        const clienteNuevo=(byId("nuevaCotizacionClienteNuevo")?byId("nuevaCotizacionClienteNuevo").value:"").trim();
        const calculadoraId=(byId("nuevaCotizacionCalculadora")?byId("nuevaCotizacionCalculadora").value:"").trim();
        const tipo=(byId("nuevaCotizacionTipo")?byId("nuevaCotizacionTipo").value:"").trim();
        if(!clienteId&&!clienteNuevo){setText("nuevaCotizacionMensaje","Seleccione un cliente o escriba uno nuevo.");return;}
        if(!calculadoraId){setText("nuevaCotizacionMensaje","Seleccione un cotizador.");return;}

        const boton=byId("btnCrearNuevaCotizacion");if(boton)boton.disabled=true;
        setText("nuevaCotizacionMensaje","Creando cotización...");
        try{
          const payload={calculadora_id:calculadoraId,tipo_propuesta:tipo};
          if(clienteNuevo)payload.cliente_nombre_nuevo=clienteNuevo;else payload.cliente_id=clienteId;
          const resp=await fetchAutenticado("/api/cotizaciones",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
          let res=null;try{res=await resp.json();}catch(e){res=null;}
          if(!resp.ok||!res||!res.ok)throw new Error((res&&res.error)||"No fue posible crear la cotización.");
          cerrarModalCalculadoras();
          await cargarCotizaciones();
          await cargarDetalleCotizacionV2({cotizacion_id:res.cotizacion_id,version:1});
          await editarCotizacionDesdeDetalleV2();
          mostrarToast("Cotización "+(res.codigo_oferta||"")+" creada correctamente.");
        }catch(error){
          setText("nuevaCotizacionMensaje",error&&error.message?error.message:"No fue posible crear la cotización.");

        html+='<div class="gestor-detail-grid"><section class="card"><h2>Información comercial</h2><div class="gestor-facts">'+fact("Cliente",c.cliente)+fact("Empresa",c.empresa)+fact("Tipo de propuesta",c.tipo_propuesta)+fact("Cotizador",c.calculadora_nombre||c.calculadora_id)+fact("Vendedor",c.vendedor)+fact("Analista",c.analista)+fact("Líder de producto",c.lider_producto)+fact("Última actualización",c.fecha_actualizacion)+'</div></section>';
        html+='<section class="card"><h2>Resumen económico</h2><div class="gestor-facts">'+fact("Precio",formatoMoneda(c.total_precio||0,c.moneda||"USD"))+fact("Costo",formatoMoneda(c.total_costo||0,c.moneda||"USD"),true)+fact("Ganancia",formatoMoneda(c.total_ganancia||0,c.moneda||"USD"),true)+fact("Margen",formatoNumero(c.margen_total||0)+"%",true)+'</div>'+(versionAceptada?'<div class="gestor-accepted-box"><span>Versión aceptada</span><strong>'+escapeHtml('V'+versionAceptada+(c.fecha_aceptacion?' · '+c.fecha_aceptacion:''))+'</strong><small>'+escapeHtml((c.aceptada_por||'')+(c.origen_aceptacion?' · '+c.origen_aceptacion:''))+'</small></div>':'')+acciones+'</section></div>';
        html+='<div class="gestor-detail-grid"><section class="card"><div class="card-head"><h2>Versiones</h2><span>'+versiones.length+' registrada(s)</span></div><div class="gestor-timeline gestor-versions">'+(versiones.length?versiones.map(function(v){const actual=String(v.numero_version||'')===String(c.version_actual||'');const aceptada=String(v.numero_version||'')===versionAceptada;return '<div class="gestor-version-row"><b>'+escapeHtml(etiquetaVersion(v))+'</b><span>'+escapeHtml(v.estado||"")+' · '+escapeHtml(v.fecha_actualizacion||v.fecha_creacion||"")+(actual?' · ACTUAL':'')+(aceptada?' · ACEPTADA':'')+(v.resumen_cambios?'<small>'+escapeHtml(v.resumen_cambios)+'</small>':'')+'</span><strong>'+formatoMoneda(v.total_precio||0,v.moneda||c.moneda||"USD")+'</strong><button class="btn btn-light" type="button" onclick="CotizaApp.verVersionGestor(\''+escapeHtml(v.numero_version||'')+'\')">Ver</button></div>';}).join(''):'<p>Sin versiones.</p>')+'</div></section>';
        html+='<section class="card"><div class="card-head"><h2>Actividad</h2><span>'+historial.length+' evento(s)</span></div><div class="gestor-timeline">'+(historial.length?historial.slice(0,12).map(function(h){return '<div><b>'+escapeHtml(String(h.accion||"").replace(/_/g," "))+'</b><span>'+escapeHtml(h.nombre_usuario||"")+' · '+escapeHtml(h.fecha||"")+'</span><strong>'+escapeHtml(h.estado_nuevo||"")+'</strong></div>';}).join(''):'<p>Sin actividad.</p>')+'</div></section></div>';
        html+='<section class="card gestor-client-link"><div><h2>Acceso del cliente</h2><p>'+(linkActivo?'Existe un enlace '+escapeHtml(linkActivo.estado||"")+' para esta versión.':'Todavía no se ha generado un enlace para esta versión.')+'</p></div>'+(linkActivo?'<div class="gestor-detail-actions"><button class="btn btn-secondary" type="button" onclick="CotizaApp.copiarEnlaceGestor(\''+escapeHtml(encodeURIComponent(linkActivo.url_publica||""))+'\')">Copiar enlace</button><a class="btn btn-light" target="_blank" href="'+escapeHtml(linkActivo.url_publica||"#")+'">Abrir propuesta</a></div>':'')+'</section>';
        const box=byId("gestorDetalleContenido");if(box)box.innerHTML=html;
        const edit=byId("btnEditarCotizacionGestor");if(edit)edit.disabled=c.puede_editar===false;
        const nueva=byId("btnNuevaVersionGestor");if(nueva)nueva.disabled=["Enviada al Cliente","Vista por el Cliente","Aceptada"].indexOf(c.estado)<0;
        const link=byId("btnGenerarLinkGestor");if(link)link.disabled=c.estado!=="Liberada";

        // Control genérico de cambio de estado — los estados válidos
        // son exactamente los del CHECK de la tabla (mismo arreglo
        // ESTADOS que usa el filtro de la lista).
        const selectorEstado=byId("gestorEstadoNuevo");
        if(selectorEstado){
          selectorEstado.innerHTML=ESTADOS.map(function(e){
            return '<option value="'+escapeHtml(e)+'">'+escapeHtml(e)+'</option>';
          }).join("");
          selectorEstado.value=c.estado||"";
        }
        const selectorVersionAceptada=byId("gestorVersionAceptada");
        if(selectorVersionAceptada){
          selectorVersionAceptada.innerHTML=versiones.map(function(v){
            return '<option value="'+escapeHtml(v.numero_version||"")+'">V'+escapeHtml(v.numero_version||"")+'</option>';
          }).join("");
          selectorVersionAceptada.value=versionAceptada||"";

        cambiarEstadoSeleccionadoGestorV2();

      function cambiarEstadoSeleccionadoGestorV2(){
        const estado=byId("gestorEstadoNuevo")?byId("gestorEstadoNuevo").value:"";const wrap=byId("gestorVersionAceptadaWrap");if(wrap)wrap.classList.toggle("hidden",estado!=="Ganada");
      }

      function verVersionGestorV2(numeroVersion){
        const c=state.gestorDetalle&&state.gestorDetalle.cotizacion;if(!c)return;cargarDetalleCotizacionV2(Object.assign({},c,{version:String(numeroVersion||"")}));

      function construirUrlCotizadorV2(cot,modo){
        const u=state.usuario||{};const p=new URLSearchParams({app:"cotizador",cotizador_id:cot.calculadora_id||"",calculadora_id:cot.calculadora_id||"",cotizacion_id:cot.cotizacion_id||"",version:cot.version||"1",modo:modo||"editar",usuario_id:u.usuario_id||"",correo:u.correo||"",usuario_nombre:u.nombre||"",rol:u.rol||"",origen:"Gestor_V2"});return obtenerBaseWebApp()+"?"+p.toString();
      }

      // PENDIENTE DE REESCRIBIR — mecanismo viejo, ya no alcanzable desde
      // ningún botón real de la UI. Esta función (y sus dos únicos
      // llamadores: abrirCalculadora(), que arma la URL para "Nueva
      // cotización" desde el modal de calculadoras, y
      // abrirCotizadorSolicitudV1004()) abre un <iframe> apuntando a la
      // URL /exec de un Web App de Google Apps Script que ya no existe en
      // esta arquitectura (ver obtenerBaseWebApp(), que cae a una URL de
      // Apps Script fija como último recurso). No es un bug activo hoy
      // porque nada llama a abrirCalculadora()/abrirCotizadorSolicitudV1004()
      // desde la UI real. El día que se construya "Crear cotización nueva"
      // (depende de Solicitudes, sprint futuro) hay que reescribir esos dos
      // llamadores con el mismo patrón ya real y probado del motor de
      // ejecución: fetchAutenticado() + renderRuntimeCotizador() (ver
      // editarCotizacionDesdeDetalleV2(), migrada en el Sprint 5), en vez
      // de este iframe.
      function abrirCotizadorIntegradoV2(url,titulo,subtitulo){
        state.gestorVistaAnterior=state.gestorDetalle?"detalle":"lista";mostrarPanelGestorV2("gestorCotizadorEditor");
        const frame=byId("gestorCotizadorFrame");if(frame)frame.src=url;
        setText("gestorEditorTitulo",titulo||"Cotizador");setText("gestorEditorSubtitulo",subtitulo||"");
      }

      function cerrarCotizadorIntegradoV2(){
        state.cotizadorRuntime = null;
        if(state.gestorVistaAnterior==="detalle"&&state.gestorDetalle)cargarDetalleCotizacionV2(state.gestorDetalle.cotizacion);else mostrarListadoCotizacionesV2();
      }

      // MIGRADA en el Sprint 5 — antes solo mostraba "disponible
      // próximamente". Ahora carga el formulario real del motor de
      // ejecución (GET /api/cotizador/runtime/{id}) y lo renderiza
      // dentro de la misma aplicación — nada de iframe a otra URL,
      // ese era el mecanismo viejo de Google Apps Script.
      async function editarCotizacionDesdeDetalleV2(){
        const c = state.gestorDetalle && state.gestorDetalle.cotizacion;
        if(!c) return;

        state.gestorVistaAnterior = "detalle";
        mostrarPanelGestorV2("gestorCotizadorEditor");
        setText("gestorEditorTitulo", c.codigo_oferta || c.cotizacion_id || "Cotizador");
        setText("gestorEditorSubtitulo", "Versión " + (c.version || "1"));

        const contenido = byId("gestorRuntimeContenido");
        if(contenido) contenido.innerHTML = '<div class="card">Cargando formulario...</div>';

        try{
          const resp = await fetchAutenticado("/api/cotizador/runtime/" + encodeURIComponent(c.cotizacion_id || "") + "?version=" + encodeURIComponent(c.version || "1"));
          let res = null;
          try{ res = await resp.json(); }catch(e){ res = null; }
          if(!resp.ok || !res || !res.ok){
            if(contenido) contenido.innerHTML = '<div class="card"><p>' + escapeHtml((res && res.error) || "No fue posible cargar el formulario del cotizador.") + '</p></div>';
            return;
          }

          const tabs = (res.estructura && res.estructura.tabs) || [];
          state.cotizadorRuntime = {
            cotizacionId: c.cotizacion_id || "",
            version: res.version || c.version || 1,
            estructura: res.estructura || {tabs:[]},
            valores: res.valores || {},
            tabActivoId: tabs.length ? tabs[0].tab_id : ""
          };
          renderRuntimeCotizador();
        }catch(error){
          if(contenido) contenido.innerHTML = '<div class="card"><p>' + escapeHtml(error && error.message ? error.message : "No fue posible cargar el formulario del cotizador.") + '</p></div>';
        }
      }

      // Pinta la tira de tabs y los campos de la tab activa. Se
      // vuelve a llamar completa cada vez que se cambia de tab —
      // por eso leerValoresFormularioActual() se corre ANTES de
      // cambiar de tab, para no perder lo que la persona ya escribió.
      function renderRuntimeCotizador(){
        const rt = state.cotizadorRuntime;
        const contenido = byId("gestorRuntimeContenido");
        if(!rt || !contenido) return;

        const tabs = ((rt.estructura && rt.estructura.tabs) || []).slice().sort(function(a,b){ return (a.orden||0)-(b.orden||0); });
        if(!tabs.length){
          contenido.innerHTML = '<div class="card"><p>Este cotizador todavía no tiene secciones ni campos definidos en el Diseñador.</p></div>';
          return;
        }
        if(!tabs.some(function(t){ return t.tab_id === rt.tabActivoId; })) rt.tabActivoId = tabs[0].tab_id;

        const tiraTabs = tabs.map(function(tab){
          const activa = tab.tab_id === rt.tabActivoId;
          return '<button type="button" class="runtime-tab-btn' + (activa ? ' active' : '') + '" data-tab-id="' + escapeHtml(tab.tab_id) + '">' + escapeHtml(tab.nombre || tab.tab_id) + '</button>';
        }).join("");

        const tabActivo = tabs.find(function(t){ return t.tab_id === rt.tabActivoId; });
        const elementos = ((tabActivo && tabActivo.elementos) || []).slice().sort(function(a,b){ return (a.orden||0)-(b.orden||0); });
        const campos = elementos.map(function(el){ return renderRuntimeElemento(el, rt.valores); }).join("");

        contenido.innerHTML =
          '<div class="runtime-tabs">' + tiraTabs + '</div>' +
          '<div class="card runtime-grid">' + (campos || '<p>Esta sección no tiene elementos.</p>') + '</div>';

        contenido.querySelectorAll(".runtime-tab-btn").forEach(function(btn){
          btn.addEventListener("click", function(){
            leerValoresFormularioActual();
            rt.tabActivoId = btn.dataset.tabId;
            renderRuntimeCotizador();
          });
        });
      }

      // CAMPO -> input de texto. CAMPO_CATALOGO -> select con las
      // opciones que ya vienen resueltas en la respuesta. LEYENDA y
      // TEXTO_INFORMATIVO son solo texto, no tienen valor que guardar.
      function renderRuntimeElemento(el, valores){
        const ancho = Math.min(4, Math.max(1, Number(el.columnas_ancho) || 1));
        const requerido = !!el.requerido;
        const estiloSpan = 'style="grid-column:span ' + ancho + '"';
        const valorGuardado = (valores && Object.prototype.hasOwnProperty.call(valores, el.elemento_id)) ? valores[el.elemento_id] : "";

        if(el.tipo === "LEYENDA"){
          return '<div class="runtime-field runtime-leyenda" ' + estiloSpan + '><h3>' + escapeHtml(el.etiqueta || "") + '</h3></div>';
        }
        if(el.tipo === "TEXTO_INFORMATIVO"){
          return '<div class="runtime-field runtime-texto-informativo" ' + estiloSpan + '><p>' + escapeHtml(el.etiqueta || "") + '</p></div>';
        }
        if(el.tipo === "CAMPO_CATALOGO"){
          const opciones = el.opciones || [];
          const optionsHtml = '<option value="">Seleccione...</option>' + opciones.map(function(op){
            const seleccionado = (valorGuardado !== "" && String(op.valor_sistema) === String(valorGuardado)) ? " selected" : "";
            return '<option value="' + escapeHtml(op.valor_sistema) + '"' + seleccionado + '>' + escapeHtml(op.texto_visible) + '</option>';
          }).join("");
          return '<div class="field runtime-field" ' + estiloSpan + '>' +
            '<label>' + escapeHtml(el.etiqueta || "") + (requerido ? ' <span class="runtime-requerido">*</span>' : '') + '</label>' +
            '<select class="select runtime-input" data-elemento-id="' + escapeHtml(el.elemento_id) + '">' + optionsHtml + '</select>' +
            '</div>';
        }
        // CAMPO
        const valorTexto = (valorGuardado === null || valorGuardado === undefined) ? "" : valorGuardado;
        return '<div class="field runtime-field" ' + estiloSpan + '>' +
          '<label>' + escapeHtml(el.etiqueta || "") + (requerido ? ' <span class="runtime-requerido">*</span>' : '') + '</label>' +
          '<input class="input runtime-input" type="text" data-elemento-id="' + escapeHtml(el.elemento_id) + '" value="' + escapeHtml(valorTexto) + '"' + (requerido ? ' required' : '') + '>' +
          '</div>';
      }

      // Vuelca lo que hay ahora mismo en pantalla (de la tab activa)
      // a state.cotizadorRuntime.valores, sin tocar los valores de las
      // demás tabs (que ya quedaron guardados ahí en su propio turno).
      function leerValoresFormularioActual(){
        const rt = state.cotizadorRuntime;
        if(!rt) return;
        document.querySelectorAll("#gestorRuntimeContenido .runtime-input").forEach(function(input){
          const id = input.dataset.elementoId;
          if(id) rt.valores[id] = input.value;
        });
      }

      // Junta los valores de todas las tabs (solo CAMPO y
      // CAMPO_CATALOGO — Leyenda/Texto informativo no se guardan) y
      // los manda con POST /api/cotizador/runtime/{id}/valores.
      async function guardarRuntimeCotizador(){
        const rt = state.cotizadorRuntime;
        if(!rt) return;
        leerValoresFormularioActual();

        const idsGuardables = {};
        ((rt.estructura && rt.estructura.tabs) || []).forEach(function(tab){
          (tab.elementos || []).forEach(function(el){
            if(el.tipo === "CAMPO" || el.tipo === "CAMPO_CATALOGO") idsGuardables[el.elemento_id] = true;
          });
        });

      async function ejecutarAccionCotizacionV1006(accion){
        const c=state.gestorDetalle&&state.gestorDetalle.cotizacion;if(!c)return;

        if(["LIBERAR_COTIZACION","DEVOLVER_CONSTRUCCION","MARCAR_ENVIADA"].indexOf(accion)>=0){

          return;

            method:"POST",
            headers:{"Content-Type":"application/json"},

          let res=null;
          try{ res=await resp.json(); }catch(e){ res=null; }
          if(!resp.ok||!res||!res.ok){
            mostrarToast((res&&res.error)||"No se pudo ejecutar la acción.");

          mostrarToast("Acción completada correctamente.");

          cargarDashboard();
        }catch(e){
          mostrarToast(e&&e.message?e.message:"No se pudo ejecutar la acción.");
        }
      }

      async function solicitarJSON(url, opciones){
        const resp = await fetchAutenticado(url, opciones || {});
        let data = null;
        try { data = await resp.json(); } catch(e) { data = null; }
        if(!resp.ok || !data || !data.ok){
          throw new Error((data && data.error) || "No fue posible completar la solicitud.");
        }
        return data;
      }

      function cargarUsuariosAdmin(force){
        cargarRolesAdmin();

        if(!force && state.usuariosAdmin && state.usuariosAdmin.length){
          renderUsuariosAdmin();
          return;
        }

        const tbody = byId("usuariosBody");
        if(tbody) tbody.innerHTML = '<tr><td colspan="6">Cargando usuarios...</td></tr>';

        solicitarJSON("/api/usuarios")
          .then(function(res){
            state.usuariosAdmin = res.usuarios || [];
            renderUsuariosAdmin();
          })
          .catch(function(error){
            const mensaje = error && error.message ? error.message : "No fue posible cargar los usuarios.";
            if(tbody) tbody.innerHTML = '<tr><td colspan="6">' + escapeHtml(mensaje) + '</td></tr>';
            mostrarToast(mensaje);
          });
      }

      function cargarRolesAdmin(){
        solicitarJSON("/api/roles")
          .then(function(res){
            state.rolesAdmin = res.roles || [];

      // No se usa llenarSelect() acá a propósito: esa función pasa el

      // catálogo (CTZ-CAT-001), y rompería la preselección de roles
      // con nombre mixto ("Gerente Comercial").
      function llenarSelectRolesAdmin(){
        const select = byId("usuarioRol");
        if(!select) return;
        const actual = select.value;
        select.innerHTML = (state.rolesAdmin || []).map(function(r){
          return '<option value="' + escapeHtml(r.rol) + '">' + escapeHtml(r.rol) + '</option>';
        }).join("");
        if(actual) select.value = actual;
      }

      function formatearUltimoAcceso(valor){
        if(!valor) return "Nunca";
        const fecha = new Date(valor);
        if(isNaN(fecha.getTime())) return "Nunca";
        return fecha.toLocaleString("es-CR", {dateStyle:"short", timeStyle:"short"});
      }

      function renderUsuariosAdmin(){
        const tbody = byId("usuariosBody");
        if(!tbody) return;

        const items = state.usuariosAdmin || [];
        if(!items.length){
          tbody.innerHTML = '<tr><td colspan="6">No hay usuarios registrados todavía.</td></tr>';
          return;
        }

        tbody.innerHTML = items.map(function(u){
          const activo = String(u.estado || "").toLowerCase() === "activo";
          const idSeguro = encodeURIComponent(u.usuario_id || "");
          return '<tr>' +
            '<td><strong>' + escapeHtml(u.nombre || "") + '</strong></td>' +
            '<td>' + escapeHtml(u.correo || "") + '</td>' +
            '<td><span class="badge">' + escapeHtml(u.rol || "") + '</span></td>' +
            '<td>' + (activo ? '<span class="badge badge-aceptada">Activo</span>' : '<span class="badge badge-vencida">Inactivo</span>') + '</td>' +
            '<td>' + escapeHtml(formatearUltimoAcceso(u.ultimo_acceso)) + '</td>' +
            '<td><div class="actions">' +
              '<button class="mini mini-primary" type="button" onclick="CotizaApp.editarUsuarioAdmin(decodeURIComponent(\'' + idSeguro + '\'))">Editar</button>' +
              (activo
                ? '<button class="mini" type="button" onclick="CotizaApp.cambiarEstadoUsuarioAdmin(decodeURIComponent(\'' + idSeguro + '\'),false)">Desactivar</button>'
                : '<button class="mini" type="button" onclick="CotizaApp.cambiarEstadoUsuarioAdmin(decodeURIComponent(\'' + idSeguro + '\'),true)">Activar</button>') +
            '</div></td>' +
          '</tr>';
        }).join("");
      }

      function abrirModalUsuario(usuarioId){
        limpiarFormularioUsuario();
        llenarSelectRolesAdmin();

        const titulo = byId("modalUsuarioTitulo");
        const labelPin = byId("usuarioPinLabel");
        const ayudaPin = byId("usuarioPinAyuda");
        const item = usuarioId
          ? (state.usuariosAdmin || []).find(function(u){ return String(u.usuario_id) === String(usuarioId); })
          : null;

        if(usuarioId && !item) return;

        if(item){
          if(titulo) titulo.textContent = "Editar usuario";
          byId("usuarioIdOriginal").value = item.usuario_id || "";
          byId("usuarioNombre").value = item.nombre || "";
          byId("usuarioCorreo").value = item.correo || "";
          byId("usuarioCorreo").disabled = true;
          if(byId("usuarioRol")) byId("usuarioRol").value = item.rol || "";
          byId("usuarioEstado").value = item.estado || "Activo";
          if(labelPin) labelPin.textContent = "Nuevo PIN (opcional)";
          if(ayudaPin) ayudaPin.textContent = "Deje este campo vacío para conservar el PIN actual.";
        }else{
          if(titulo) titulo.textContent = "Nuevo usuario";
          if(labelPin) labelPin.textContent = "PIN inicial";
          if(ayudaPin) ayudaPin.textContent = "";

      async function guardarUsuarioModal(){
        const usuarioId = byId("usuarioIdOriginal") ? byId("usuarioIdOriginal").value : "";
        const nombre = byId("usuarioNombre") ? byId("usuarioNombre").value.trim() : "";
        const correo = byId("usuarioCorreo") ? byId("usuarioCorreo").value.trim() : "";
        const pin = byId("usuarioPin") ? byId("usuarioPin").value.trim() : "";
        const rol = byId("usuarioRol") ? byId("usuarioRol").value : "";
        const estado = byId("usuarioEstado") ? byId("usuarioEstado").value : "Activo";

        if(!nombre || !rol){
          mostrarMensajeUsuario("Debe indicar nombre y rol.", "error");
          return;
        }
        if(!usuarioId && (!correo || !pin)){
          mostrarMensajeUsuario("Para un usuario nuevo debe indicar correo y PIN inicial.", "error");
          return;
        }

        mostrarMensajeUsuario("Guardando...", "");

        try{
          if(usuarioId){
            const cuerpo = { nombre:nombre, rol:rol, estado:estado };
            if(pin) cuerpo.pin = pin;
            await solicitarJSON("/api/usuarios/" + encodeURIComponent(usuarioId), {
              method:"PATCH",
              headers:{"Content-Type":"application/json"},
              body:JSON.stringify(cuerpo)
            });
          }else{
            await solicitarJSON("/api/usuarios", {
              method:"POST",
              headers:{"Content-Type":"application/json"},
              body:JSON.stringify({ nombre:nombre, correo:correo, pin:pin, rol:rol, estado:estado })
            });
          }

          cerrarModalUsuario();
          mostrarToast(usuarioId ? "Usuario actualizado." : "Usuario creado.");
          cargarUsuariosAdmin(true);
        }catch(error){
          mostrarMensajeUsuario((error && error.message) || "No fue posible guardar el usuario.", "error");
        }
      }

        }
      }

      function inicializarParametrosV9(){
        inicializarDisenadorCotiza();
      }

      function llenarSelectorModulosParametros(){
        const selector = byId("paramModuloSelector");
        if(!selector) return;

        const actual = selector.value || "parametros_globales";
        selector.innerHTML = Object.keys(PARAMETROS_V9_MODULOS).map(function(key){
          return '<option value="' + escapeHtml(key) + '">' + escapeHtml(PARAMETROS_V9_MODULOS[key].label) + '</option>';
        }).join("");
        selector.value = PARAMETROS_V9_MODULOS[actual] ? actual : "parametros_globales";
      }

      function cambiarModuloParametros(modulo){
        modulo = modulo || "parametros_globales";
        state.paramModuloActual = modulo;
        asegurarPaginacionParametros(modulo);
        state.parametrosPaginacion[modulo].pagina = 1;
        cargarModuloParametros(modulo, false);
      }

      function obtenerCotizadorConfiguracionSeleccionado(){
        return byId("paramCotizadorSelector") ? String(byId("paramCotizadorSelector").value || "").trim().toUpperCase() : "";
      }

      function cambiarCotizadorConfiguracion(){
        const modulo = state.paramModuloActual || "parametros_globales";
        const filtroCalculadora = byId("paramFiltroCalculadora");
        const seleccionado = obtenerCotizadorConfiguracionSeleccionado();

        if(filtroCalculadora){
          filtroCalculadora.value = seleccionado;
        }

        if(byId("paramFiltroServicio")){
          llenarSelect(byId("paramFiltroServicio"), obtenerOpcionesServiciosV9(true, seleccionado), "Todos", "");
        }

        if(byId("paramFiltroTab")){
          llenarSelect(byId("paramFiltroTab"), obtenerOpcionesTabsCotizadorFiltradasV10(true, seleccionado), "Todos", "");
        }

        reiniciarPaginaModuloActual();
        renderTablaModuloParametros();
      }

      function validarCotizadorSeleccionado(){
        const cotizadorId = obtenerCotizadorConfiguracionSeleccionado();
        if(!cotizadorId){
          mostrarToast("Seleccione primero una Calculadora / Cotizador para validar.");
          return;
        }
        validarCotizador(cotizadorId);
      }

      function compilarCotizadorSeleccionado(){
        const cotizadorId = obtenerCotizadorConfiguracionSeleccionado();
        if(!cotizadorId){
          mostrarToast("Seleccione primero una Calculadora / Cotizador para compilar.");
          return;
        }
        compilarCotizador(cotizadorId);
      }

      function cargarModuloParametros(modulo, force){
        const cfg = PARAMETROS_V9_MODULOS[modulo] || PARAMETROS_V9_MODULOS.parametros_globales;
        state.paramModuloActual = modulo;

        if(!force && state.parametrosModuloCache[modulo]){
          renderModuloParametros();
          return;
        }

        const panel = byId("paramModuloPanel");
        if(panel){
          panel.innerHTML = '<div class="placeholder"><h2>' + escapeHtml(cfg.label) + '</h2><p>Cargando datos...</p></div>';
        }

        if(typeof google === "undefined" || !google.script || !google.script.run){
          state.parametrosModuloCache[modulo] = {data:[], catalogos:{}};
          renderModuloParametros();
          return;
        }

        setLoading("section-parametros", true);
        google.script.run
          .withSuccessHandler(function(res){
            setLoading("section-parametros", false);
            if(!res || !res.ok){
              mostrarToast((res && res.error) ? res.error : "No fue posible cargar el módulo de parámetros.");
              state.parametrosModuloCache[modulo] = {data:[], catalogos:{}};
            }else{
              state.parametrosModuloCache[modulo] = {
                data: normalizarDataModuloParametros(res.data || res.filas || res.rows || []),
                catalogos: res.catalogos || {}
              };
              mezclarCatalogosParametros(res.catalogos || {});
            }
            renderModuloParametros();
          })
          .withFailureHandler(function(error){
            setLoading("section-parametros", false);
            state.parametrosModuloCache[modulo] = {data:[], catalogos:{}};
            renderModuloParametros();
            mostrarToast(error && error.message ? error.message : "No fue posible cargar el módulo de parámetros.");
          })
          .webListarModuloParametros({
            modulo:cfg.apiModulo || modulo,
            usuario_id_sesion:state.usuario ? state.usuario.usuario_id || "" : "",
            correo_sesion:state.usuario ? state.usuario.correo || "" : ""
          });
      }

      function normalizarCalculadorasParametro(){
        return (state.calculadoras || []).map(function(c){
          return {
            calculadora_id:String(c.calculadora_id || "").trim().toUpperCase(),
            nombre_calculadora:c.nombre_calculadora || c.nombre || c.calculadora_id || "",
            linea_negocio:c.linea_negocio || "",
            servicio_base:c.servicio_base || "",
            version_actual:c.version_actual || "",
            estado:c.estado || "Activo",
            url_html:c.url_html || "",
            descripcion:c.descripcion || "",
            activo:normalizarBoolean(c.estado || "Activo")
          };
        });
      }

      function normalizarDataModuloParametros(items){
        return (items || []).map(function(item){
          const out = Object.assign({}, item);
          if(out.activo !== undefined) out.activo = normalizarBoolean(out.activo);
          if(out.editable !== undefined) out.editable = normalizarBoolean(out.editable);
          if(out.editable_cotizador !== undefined) out.editable_cotizador = normalizarBoolean(out.editable_cotizador);
          if(out.obligatorio !== undefined) out.obligatorio = normalizarBoolean(out.obligatorio);
          if(out.bloqueante !== undefined) out.bloqueante = normalizarBoolean(out.bloqueante);
          return out;
        });
      }

      function renderTablaModuloParametros(){
        const modulo = state.paramModuloActual || "parametros_globales";
        const cfg = PARAMETROS_V9_MODULOS[modulo] || PARAMETROS_V9_MODULOS.parametros_globales;
        const tbody = byId("paramModuloBody");
        const empty = byId("paramModuloEmpty");
        const pagination = byId("paramModuloPagination");
        if(!tbody) return;

        const items = obtenerFilasModuloFiltradas();
        const totalCols = cfg.columns.length + (cfg.editable ? 1 : 0);

        if(!items.length){
          tbody.innerHTML = '<tr><td colspan="' + totalCols + '">No hay registros para los filtros seleccionados.</td></tr>';
          if(empty) empty.style.display = "block";
          if(pagination) pagination.innerHTML = "";
          return;
        }

        const pag = obtenerPaginaModulo(modulo, items.length);
        const pageItems = items.slice(pag.inicio, pag.fin);

        if(empty) empty.style.display = "none";
        tbody.innerHTML = pageItems.map(function(item){
          const id = obtenerIdRegistroModulo(cfg, item);
          const celdas = cfg.columns.map(function(col){
            return '<td>' + formatearCeldaModulo(col, item[col.key], item) + '</td>';
          }).join("");
          const acciones = cfg.editable
            ? '<td><div class="actions">' + renderAccionesModuloParametros(modulo, id, item) + '</div></td>'
            : '';
          return '<tr>' + celdas + acciones + '</tr>';
        }).join("");

        renderPaginacionModuloParametros(modulo, items.length, pag.pagina, pag.totalPaginas);
      }

      function asegurarPaginacionParametros(modulo){
        state.parametrosPaginacion = state.parametrosPaginacion || {};
        if(!state.parametrosPaginacion[modulo]){
          state.parametrosPaginacion[modulo] = {pagina:1};
        }
        return state.parametrosPaginacion[modulo];
      }

      function reiniciarPaginaModuloActual(){
        const modulo = state.paramModuloActual || "parametros_globales";
        asegurarPaginacionParametros(modulo).pagina = 1;
      }

      function obtenerPaginaModulo(modulo,totalRegistros){
        const pag = asegurarPaginacionParametros(modulo);
        const porPagina = Number(state.filasPorPaginaParametros || 10);
        const totalPaginas = Math.max(1, Math.ceil(Number(totalRegistros || 0) / porPagina));
        let pagina = Number(pag.pagina || 1);
        if(pagina < 1) pagina = 1;
        if(pagina > totalPaginas) pagina = totalPaginas;
        pag.pagina = pagina;

        const inicio = (pagina - 1) * porPagina;
        const fin = Math.min(inicio + porPagina, Number(totalRegistros || 0));
        return {pagina:pagina,totalPaginas:totalPaginas,inicio:inicio,fin:fin,porPagina:porPagina};
      }

      function cambiarPaginaModuloParametros(pagina){
        const modulo = state.paramModuloActual || "parametros_globales";
        asegurarPaginacionParametros(modulo).pagina = Number(pagina || 1);
        renderTablaModuloParametros();
      }

      function validarCotizador(cotizadorId){
        cotizadorId = String(cotizadorId || "").trim().toUpperCase();
        if(!cotizadorId){
          mostrarToast("Debe seleccionar un cotizador para validar.");
          return;
        }

        setLoading("section-parametros", true);
        solicitarCompilacionCotizador("/api/cotizador/validar", cotizadorId)
          .then(function(res){
            setLoading("section-parametros", false);
            mostrarResultadoCompilacion(res, "Validación del cotizador " + cotizadorId);
          })
          .catch(function(error){
            setLoading("section-parametros", false);
            mostrarToast(error && error.message ? error.message : "No fue posible validar el cotizador.");
          });
      }

      async function solicitarCompilacionCotizador(endpoint, cotizadorId){
        const resp = await fetchAutenticado(endpoint, {
          method:"POST",
          headers:{"Accept":"application/json","Content-Type":"application/json"},
          body:JSON.stringify({calculadora_id:String(cotizadorId || "").trim().toUpperCase()})
        });
        let data = null;
        try{ data = await resp.json(); }catch(e){ data = null; }
        if(!resp.ok || !data || !data.ok){
          throw new Error((data && data.error) || "No fue posible procesar el cotizador.");
        }
        return data;
      }

      function compilarCotizador(cotizadorId){
        cotizadorId = String(cotizadorId || "").trim().toUpperCase();
        if(!cotizadorId){
          mostrarToast("Debe seleccionar un cotizador para compilar.");
          return;
        }

        abrirConfirmacionCompilacion(cotizadorId);
      }

      function abrirConfirmacionCompilacion(cotizadorId){
        state.compilacionCotizadorPendiente = String(cotizadorId || "").trim().toUpperCase();
        state.compilacionResultadoNombre = "confirmacion_compilacion_" + state.compilacionCotizadorPendiente + ".txt";
        const texto = "Confirmación de compilación\n\n" +
          "Cotizador: " + state.compilacionCotizadorPendiente + "\n\n" +
          "Esta acción validará y compilará el cotizador. Si la compilación es correcta, quedará publicado y disponible como versión activa.\n\n" +
          "Presione Sí, compilar para continuar.";

        state.compilacionResultadoTexto = texto;
        setText("modalCompilacionTitulo", "Compilar cotizador " + state.compilacionCotizadorPendiente);
        setText("modalCompilacionSubtitulo", "Confirme la acción antes de publicar una nueva versión compilada.");

        const estado = byId("modalCompilacionEstado");
        if(estado){
          estado.innerHTML = '<strong>Confirmación requerida</strong>Se validará la configuración completa del cotizador. Si todo está correcto, se generará el JSON y quedará publicado.';
        }

        const resumen = byId("modalCompilacionResumen");
        if(resumen) resumen.innerHTML = renderResumenCompilacion({});

        const errores = byId("modalCompilacionErrores");
        if(errores) errores.innerHTML = "";

        const advertencias = byId("modalCompilacionAdvertencias");
        if(advertencias) advertencias.innerHTML = "";

        const textarea = byId("modalCompilacionTexto");
        if(textarea) textarea.value = texto;

        toggleHidden("btnEjecutarCompilacionConfirmada", false);
        toggleHidden("btnCopiarResultadoCompilacion", false);
        toggleHidden("btnGuardarResultadoCompilacionTxt", false);

        const modal = byId("modalCompilacionCotizador");
        if(modal) modal.classList.add("open");
      }

      function ejecutarCompilacionPendiente(){
        const cotizadorId = String(state.compilacionCotizadorPendiente || "").trim().toUpperCase();
        if(!cotizadorId){
          mostrarToast("No hay cotizador pendiente para compilar.");
          return;
        }
        ejecutarCompilacionCotizador(cotizadorId);
      }

      function ejecutarCompilacionCotizador(cotizadorId){
        toggleHidden("btnEjecutarCompilacionConfirmada", true);
        const estado = byId("modalCompilacionEstado");
        if(estado){
          estado.innerHTML = '<strong>Compilando cotizador</strong>Espere mientras Cotiza valida la configuración y genera el JSON compilado.';
        }

        setLoading("section-parametros", true);
        solicitarCompilacionCotizador("/api/cotizador/compilar", cotizadorId)
          .then(function(res){
            setLoading("section-parametros", false);
            mostrarResultadoCompilacion(res, "Compilación del cotizador " + cotizadorId);
            cargarModuloParametros("calculadoras", true);
          })
          .catch(function(error){
            setLoading("section-parametros", false);
            mostrarToast(error && error.message ? error.message : "No fue posible compilar el cotizador.");
          });
      }

      function mostrarResultadoCompilacion(res, titulo){
        if(!res || !res.ok){
          mostrarToast((res && res.error) ? res.error : "No se recibió respuesta de la validación.");
          return;
        }

        const errores = res.errores || [];
        const advertencias = res.advertencias || [];
        const resumen = res.resumen || {};
        const cotizadorId = String(res.cotizador_id || res.calculadora_id || state.compilacionCotizadorPendiente || "COTIZADOR").trim().toUpperCase();
        const ahora = new Date();
        const fechaArchivo = ahora.getFullYear() + "-" + String(ahora.getMonth()+1).padStart(2,"0") + "-" + String(ahora.getDate()).padStart(2,"0") + "_" + String(ahora.getHours()).padStart(2,"0") + String(ahora.getMinutes()).padStart(2,"0");

        const mensaje = construirTextoResultadoCompilacion(res, titulo);
        state.compilacionResultadoTexto = mensaje;
        state.compilacionResultadoNombre = (res.compilado ? "compilacion_" : "validacion_") + cotizadorId + "_" + fechaArchivo + ".txt";

        setText("modalCompilacionTitulo", titulo || "Resultado de validación / compilación");
        setText("modalCompilacionSubtitulo", res.compilado ? "El cotizador fue compilado y publicado." : (res.valido ? "La validación terminó sin errores." : "Revise los errores antes de intentar publicar."));

        const estado = byId("modalCompilacionEstado");
        if(estado){

      function copiarResultadoCompilacion(){
        const texto = state.compilacionResultadoTexto || (byId("modalCompilacionTexto") ? byId("modalCompilacionTexto").value : "");
        if(!texto){
          mostrarToast("No hay resultado para copiar.");
          return;
        }

        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(texto).then(function(){
            mostrarToast("Resultado copiado al portapapeles.");
          }).catch(function(){
            copiarTextoFallback(texto);
          });
          return;
        }

        copiarTextoFallback(texto);
      }

      function copiarTextoFallback(texto){
        const tmp = document.createElement("textarea");
        tmp.value = texto;
        tmp.style.position = "fixed";
        tmp.style.left = "-9999px";
        document.body.appendChild(tmp);
        tmp.focus();
        tmp.select();
        try{
          document.execCommand("copy");
          mostrarToast("Resultado copiado al portapapeles.");
        }catch(error){
          mostrarToast("No fue posible copiar automáticamente. Seleccione el texto y copie manualmente.");
        }
        document.body.removeChild(tmp);
      }

      function guardarResultadoCompilacionTxt(){
        const texto = state.compilacionResultadoTexto || (byId("modalCompilacionTexto") ? byId("modalCompilacionTexto").value : "");
        if(!texto){
          mostrarToast("No hay resultado para guardar.");
          return;
        }

        const blob = new Blob([texto], {type:"text/plain;charset=utf-8"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = state.compilacionResultadoNombre || "resultado_compilacion_cotizador.txt";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
        mostrarToast("Archivo TXT generado.");
      }
