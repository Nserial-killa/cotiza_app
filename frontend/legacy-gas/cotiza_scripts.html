      function clasificarTipoCatalogoDesigner(cat){
        const alcance = String(cat && cat.alcance ? cat.alcance : "COTIZADOR").trim().toUpperCase();
        return alcance === "GLOBAL" ? "SISTEMA" : "COTIZADOR";
      }

      function obtenerBadgeTipoCatalogoDesigner(cat){
        const tipo = clasificarTipoCatalogoDesigner(cat);
        if(tipo === "SISTEMA") return '<span class="designer-chip chip-blue">Sistema</span>';
        return '<span class="designer-chip chip-purple">Del cotizador</span>';
      }

      function sincronizarAlcanceCatalogoDesigner(){
        const tipo = byId("designerCatalogoTipo") ? String(byId("designerCatalogoTipo").value || "COTIZADOR").toUpperCase() : "COTIZADOR";
        const alcance = byId("designerCatalogoAlcance");
        if(alcance) alcance.value = tipo === "GLOBAL" || tipo === "SISTEMA" ? "GLOBAL" : "COTIZADOR";
      }

      function esCatalogoDependienteDesigner(cat){
        const id = String(cat.catalogo_id || "").toUpperCase();
        const desc = String(cat.descripcion || "").toUpperCase();
        return !!(getCatalogoPadreIdDesigner(cat) || cat.campo_relacionado || desc.indexOf("DEPEND") >= 0 || id.indexOf("MODULOS") >= 0);
      }

      function renderDesignerCatalogosLista(){
        const box = byId("designerCatalogosLista");
        if(!box) return;
        const d = state.disenadorCotiza || {};
        const buscar = normalizarTextoBusquedaParam_(byId("designerBuscarCatalogo") ? byId("designerBuscarCatalogo").value || "" : "");
        let items = obtenerCatalogosVisiblesDesigner();
        if(buscar){
          items = items.filter(function(cat){
            return normalizarTextoBusquedaParam_([cat.catalogo_id, cat.nombre_catalogo, cat.descripcion, cat.alcance].join(" ")).indexOf(buscar) >= 0;
          });
        }

        items.sort(sortByOrdenParam_);

        if(!items.length){
          box.innerHTML = '<div class="designer-empty">No hay catálogos para el filtro seleccionado. Active Mostrar catálogos del sistema si necesita ver los catálogos globales.</div>';
          return;
        }

        box.innerHTML = items.map(function(cat){
          const id = String(cat.catalogo_id || "").toUpperCase();
          const rel = esCatalogoDependienteDesigner(cat) ? "Dependiente" : "Independiente";
          const active = String(d.catalogoSeleccionado || "").toUpperCase() === id;
          const nombre = String(cat.nombre_catalogo || cat.catalogo || id || '').trim() || id;
          return '<div class="designer-list-item ' + (active ? 'active' : '') + '" data-catalogo-id="' + escapeHtml(id) + '">' +
            '<div class="designer-drag">⋮⋮</div>' +
            '<div><div class="designer-list-title">' + escapeHtml(nombre) + '</div><div class="designer-list-meta">' + obtenerBadgeTipoCatalogoDesigner(cat) + '<span>' + escapeHtml(id) + '</span><span>' + escapeHtml(rel) + '</span></div></div>' +
            '<button class="designer-kebab" type="button">⋮</button>' +
          '</div>';
        }).join("");

        box.querySelectorAll(".designer-list-item").forEach(function(el){
          el.addEventListener("click",function(){
            seleccionarDesignerCatalogo(el.dataset.catalogoId || "");
          });
        });
      }

      function fusionarValoresCatalogosDesigner_(nuevos){
        const d = state.disenadorCotiza || {};
        const mapa = {};
        (d.valores || []).forEach(function(v){
          const key = String(v.catalogo_id || "").toUpperCase() + "|" + String(v.valor_id || "").toUpperCase();
          if(key !== "|") mapa[key] = v;
        });
        (nuevos || []).forEach(function(v){
          const key = String(v.catalogo_id || "").toUpperCase() + "|" + String(v.valor_id || "").toUpperCase();
          if(key !== "|") mapa[key] = v;
        });
        d.valores = Object.keys(mapa).map(function(k){ return mapa[k]; });
        state.disenadorCotiza = d;
      }

      function reemplazarValoresCatalogoDesigner_(catalogoId, valores){
        const d = state.disenadorCotiza || {};
        const cid = String(catalogoId || "").toUpperCase();
        d.valores = (d.valores || []).filter(function(v){ return String(v.catalogo_id || "").toUpperCase() !== cid; });
        d.valores = d.valores.concat(normalizarDataModuloParametros(valores || []));
        state.disenadorCotiza = d;
      }

      function reemplazarRelacionesCatalogoDesigner_(catalogoId, relaciones){
        const d = state.disenadorCotiza || {};
        const cid = String(catalogoId || "").toUpperCase();
        d.relaciones = (d.relaciones || []).filter(function(r){ return String(r.catalogo_hijo_id || "").toUpperCase() !== cid; });
        d.relaciones = d.relaciones.concat(normalizarDataModuloParametros(relaciones || []));
        state.disenadorCotiza = d;
      }

      function cargarValoresCatalogoDesigner(catalogoId, force, callback){
        const d = state.disenadorCotiza || {};
        const cid = String(catalogoId || "").toUpperCase();
        callback = typeof callback === "function" ? callback : function(){};
        if(!cid){ callback(); return; }

        const yaTieneValores = (d.valores || []).some(function(v){ return String(v.catalogo_id || "").toUpperCase() === cid; });
        if(!force && yaTieneValores){
          renderDesignerValoresCatalogo();
          callback();
          return;
        }

        const body = byId("designerCatalogoValoresBody");
        if(body) body.innerHTML = '<tr><td colspan="7">Cargando valores del catálogo...</td></tr>';
        mostrarDesignerEstadoInline("Cargando valores del catálogo seleccionado...");

        solicitarCatalogosDesigner({modo:"valores_catalogo", catalogo_id:cid})
          .then(function(res){
            if(!res || !(res.ok || res.success)){
              const msg = (res && (res.error || res.mensaje)) ? (res.error || res.mensaje) : "No fue posible cargar valores.";
              mostrarDesignerEstadoInline(msg, true);
              if(body) body.innerHTML = '<tr><td colspan="7">' + escapeHtml(msg) + '</td></tr>';
              callback();
              return;
            }
            const valores = res.valores || res.data || res.filas || res.rows || [];
            reemplazarValoresCatalogoDesigner_(cid, Array.isArray(valores) ? valores : []);

            // Si el catálogo tiene padre, cargamos solo sus relaciones para mostrar badges.
            const cat = obtenerDesignerCatalogoSeleccionado();
            if(cat && getCatalogoPadreIdDesigner(cat)){
              solicitarCatalogosDesigner({modo:"relaciones_valor", catalogo_hijo_id:cid})
                .then(function(resRel){
                  const relaciones = resRel && (resRel.relaciones || resRel.catalogo_relaciones || resRel.data || resRel.filas || resRel.rows) ? (resRel.relaciones || resRel.catalogo_relaciones || resRel.data || resRel.filas || resRel.rows) : [];
                  reemplazarRelacionesCatalogoDesigner_(cid, Array.isArray(relaciones) ? relaciones : []);
                  ocultarDesignerEstadoInline();
                  renderDesignerValoresCatalogo();
                  callback();
                })
                .catch(function(){
                  ocultarDesignerEstadoInline();
                  renderDesignerValoresCatalogo();
                  callback();
                });
            }else{
              ocultarDesignerEstadoInline();
              renderDesignerValoresCatalogo();
              callback();
            }
          })
          .catch(function(error){
            const msg = error && error.message ? error.message : "No fue posible cargar valores del catálogo.";
            mostrarDesignerEstadoInline(msg, true);
            if(body) body.innerHTML = '<tr><td colspan="7">' + escapeHtml(msg) + '</td></tr>';
            callback();
          });
      }

      function seleccionarDesignerCatalogo(catalogoId){
        const d = state.disenadorCotiza || {};
        d.catalogoSeleccionado = String(catalogoId || "").toUpperCase();
        d.valorSeleccionado = "";
        d.propsModo = "catalogo";
        state.disenadorCotiza = d;
        renderDesignerCatalogosLista();
        cargarPropiedadesCatalogoSeleccionado();
        mostrarPanelPropiedadesCatalogoDesigner();
        cargarValoresCatalogoDesigner(d.catalogoSeleccionado, false);
      }


      function obtenerDesignerCatalogoSeleccionado(){
        const d = state.disenadorCotiza || {};
        const id = String(d.catalogoSeleccionado || "").toUpperCase();
        return (d.catalogos || []).find(function(c){ return String(c.catalogo_id || "").toUpperCase() === id; }) || null;
      }

      function obtenerValoresCatalogoSeleccionadoDesigner(){
        const d = state.disenadorCotiza || {};
        const id = String(d.catalogoSeleccionado || "").toUpperCase();
        return (d.valores || []).filter(function(v){ return String(v.catalogo_id || "").toUpperCase() === id; }).sort(sortByOrdenParam_);
      }

      function renderDesignerValoresCatalogo(){
        const body = byId("designerCatalogoValoresBody");
        const titulo = byId("designerValoresTitulo");
        const count = byId("designerValoresCount");
        const info = byId("designerCatalogoInfo");
        const infoTexto = byId("designerCatalogoInfoTexto");
        if(!body) return;

        const cat = obtenerDesignerCatalogoSeleccionado();
        if(!cat){
          if(titulo) titulo.textContent = "Valores del catálogo";
          if(count) count.textContent = "0 valores";
          if(info) info.classList.add("hidden");
          body.innerHTML = '<tr><td colspan="7">Seleccione un catálogo.</td></tr>';
          return;
        }

        const valores = obtenerValoresCatalogoSeleccionadoDesigner();
        if(titulo) titulo.textContent = "Valores del catálogo: " + (cat.nombre_catalogo || cat.catalogo || cat.catalogo_id || "");
        if(count) count.textContent = valores.length + " valores";

        if(info && infoTexto){
          if(esCatalogoDependienteDesigner(cat)){
            info.classList.remove("hidden");
            const padreId = getCatalogoPadreIdDesigner(cat);
            infoTexto.innerHTML = 'Este catálogo es dependiente del catálogo padre <strong>' + escapeHtml(obtenerNombreCatalogoDesigner(padreId) || padreId || "Sin definir") + '</strong>.';
          }else{
            info.classList.add("hidden");
          }
        }

        if(!valores.length){
          body.innerHTML = '<tr><td colspan="7">Este catálogo todavía no tiene valores.</td></tr>';
          return;
        }

        const catalogoTienePadre = !!getCatalogoPadreIdDesigner(cat);
        body.innerHTML = valores.map(function(v,idx){
          const padres = getValorPadreIdsDesigner(v);
          const depBadge = padres.length ? padres.map(function(pid){
            const txt = obtenerTextoValorPadreDesigner(cat, pid) || pid;
            return '<span class="designer-chip chip-gray">' + escapeHtml(txt) + '</span>';
          }).join(' ') : '—';
          const activo = isActivoParam_(v.activo);
          const vid = String(v.valor_id || "");
          const selected = String((state.disenadorCotiza || {}).valorSeleccionado || "") === vid;
          const btnRelacionar = catalogoTienePadre ? '<button class="mini mini-relation" type="button" title="Relacionar con registros del catálogo padre" data-valor-relacion="' + escapeHtml(vid) + '">🔗 Relacionar</button>' : '';
          return '<tr class="designer-value-row ' + (selected ? 'active' : '') + '" data-valor-id="' + escapeHtml(vid) + '">' +
            '<td><span class="designer-drag">⋮⋮</span></td>' +
            '<td>' + escapeHtml(v.orden || idx + 1) + '</td>' +
            '<td>' + escapeHtml(getValorTextoVisibleDesigner(v) || v.clave || "") + '</td>' +
            '<td>' + escapeHtml(getValorSistemaDesigner(v) || v.clave || "") + '</td>' +
            '<td>' + depBadge + '</td>' +
            '<td>' + (activo ? '<span class="designer-chip chip-green">Activo</span>' : '<span class="designer-chip chip-gray">Inactivo</span>') + '</td>' +
            '<td><div class="actions">' + btnRelacionar + '<button class="mini" type="button" data-valor-edit="' + escapeHtml(vid) + '">✎</button><button class="mini mini-danger" type="button" data-valor-disable="' + escapeHtml(vid) + '">🗑</button></div></td>' +
          '</tr>';
        }).join("");

        body.querySelectorAll(".designer-value-row").forEach(function(row){
          row.addEventListener("click",function(e){
            if(e.target && e.target.closest && e.target.closest("button")) return;
            seleccionarDesignerValorCatalogo(row.dataset.valorId || "");
          });
        });
        body.querySelectorAll("[data-valor-relacion]").forEach(function(btn){
          btn.addEventListener("click",function(e){ if(e && e.stopPropagation) e.stopPropagation(); abrirModalRelacionValorDesigner(btn.dataset.valorRelacion || ""); });
        });
        body.querySelectorAll("[data-valor-edit]").forEach(function(btn){
          btn.addEventListener("click",function(e){ if(e && e.stopPropagation) e.stopPropagation(); seleccionarDesignerValorCatalogo(btn.dataset.valorEdit || ""); });
        });
        body.querySelectorAll("[data-valor-disable]").forEach(function(btn){
          btn.addEventListener("click",function(){ cambiarEstadoDesignerValorCatalogo(btn.dataset.valorDisable || "", false); });
        });
      }

      function llenarDesignerCatalogoPadreOptions(){
        const select = byId("designerCatalogoPadre");
        if(!select) return;
        const actual = String(select.value || "").toUpperCase();
        const d = state.disenadorCotiza || {};
        const seleccionado = String(d.catalogoSeleccionado || "").toUpperCase();
        const cats = (d.catalogos || []).slice().sort(sortByOrdenParam_).filter(function(c){
          const id = String(c.catalogo_id || "").toUpperCase();
          return id && id !== seleccionado;
        });
        select.innerHTML = '<option value="">Sin catálogo padre</option>' + cats.map(function(c){
          const id = String(c.catalogo_id || "").toUpperCase();
          const nombre = c.nombre_catalogo || c.catalogo || id;
          return '<option value="' + escapeHtml(id) + '">' + escapeHtml(nombre) + '</option>';
        }).join("");
        if(actual) select.value = actual;
      }

      function obtenerNombreCatalogoDesigner(catalogoId){
        const id = String(catalogoId || "").toUpperCase();
        if(!id) return "";
        const d = state.disenadorCotiza || {};
        const cat = (d.catalogos || []).find(function(c){ return String(c.catalogo_id || "").toUpperCase() === id; });
        return cat ? (cat.nombre_catalogo || cat.catalogo || id) : id;
      }

      function obtenerCatalogoPadreIdActualDesigner(){
        const select = byId("designerCatalogoPadre");
        if(select) return String(select.value || "").toUpperCase();
        const cat = obtenerDesignerCatalogoSeleccionado();
        return cat ? getCatalogoPadreIdDesigner(cat) : "";
      }

      function obtenerValoresDeCatalogoDesigner(catalogoId){
        const id = String(catalogoId || "").toUpperCase();
        const d = state.disenadorCotiza || {};
        return (d.valores || []).filter(function(v){
          return String(v.catalogo_id || "").toUpperCase() === id && isActivoParam_(v.activo);
        }).sort(sortByOrdenParam_);
      }

      function obtenerTextoValorPadreDesigner(cat, valorPadre){
        const padreId = String((cat && getCatalogoPadreIdDesigner(cat)) || obtenerCatalogoPadreIdActualDesigner() || "").toUpperCase();
        const value = String(valorPadre || "").trim();
        if(!padreId || !value) return value;
        const match = obtenerValoresDeCatalogoDesigner(padreId).find(function(v){
          return String(v.valor_id || "").trim() === value || String(v.clave || "").trim() === value || getValorSistemaDesigner(v).trim() === value || getValorTextoVisibleDesigner(v).trim() === value;
        });
        return match ? (getValorTextoVisibleDesigner(match) || match.clave || getValorSistemaDesigner(match) || value) : value;
      }

      function getRelacionesValorHijoDesigner(valorId, catalogoHijoId){
        const d = state.disenadorCotiza || {};
        const vid = String(valorId || "").trim().toUpperCase();
        const cid = String(catalogoHijoId || "").trim().toUpperCase();
        if(!vid) return [];
        return (d.relaciones || []).filter(function(r){
          return isActivoParam_(r.activo) &&
            String(r.valor_hijo_id || "").trim().toUpperCase() === vid &&
            (!cid || String(r.catalogo_hijo_id || "").trim().toUpperCase() === cid);
        }).sort(sortByOrdenParam_);
      }

      function getValorPadreIdsDesigner(v){
        if(!v) return [];
        const valorId = String(v.valor_id || "").trim().toUpperCase();
        const catId = String(v.catalogo_id || "").trim().toUpperCase();
        const relaciones = getRelacionesValorHijoDesigner(valorId, catId);
        let ids = relaciones.map(function(r){ return String(r.valor_padre_id || "").trim().toUpperCase(); }).filter(Boolean);
        if(!ids.length){
          const legacy = String(v.valor_padre_id || v.depende_de || "").trim().toUpperCase();
          if(legacy) ids = [legacy];
        }
        const map = {};
        return ids.filter(function(id){ if(map[id]) return false; map[id]=true; return true; });
      }

      function leerRelacionesPadreSeleccionadasDesigner(){
        const box = byId("designerRelacionPadreLista") || byId("designerValorPanelRelacionesPadre");
        if(!box) return [];
        const out = [];
        box.querySelectorAll('input[data-valor-padre-id]:checked').forEach(function(chk){
          const id = String(chk.getAttribute('data-valor-padre-id') || chk.value || "").trim().toUpperCase();
          if(id && out.indexOf(id) < 0) out.push(id);
        });
        return out;
      }

      function llenarDesignerDependeDeOptions(){
        const info = byId("designerValorRelacionInfo");
        if(!info) return;
        const cat = obtenerDesignerCatalogoSeleccionado();
        info.classList.toggle("hidden", !getCatalogoPadreIdDesigner(cat));
      }

      function abrirModalRelacionValorDesigner(valorId){
        const d = state.disenadorCotiza || {};
        const cat = obtenerDesignerCatalogoSeleccionado();
        const padreId = getCatalogoPadreIdDesigner(cat);
        if(!cat || !padreId){
          mostrarToast("Este catálogo no tiene catálogo padre para relacionar.");
          return;
        }
        const vid = String(valorId || "").trim().toUpperCase();
        const valor = (d.valores || []).find(function(v){ return String(v.valor_id || "").toUpperCase() === vid; });
        if(!valor){
          mostrarToast("Seleccione un valor válido para relacionar.");
          return;
        }

        d.valorRelacionSeleccionado = vid;
        d.relacionesModalSeleccionadas = [];
        state.disenadorCotiza = d;

        if(byId("designerRelacionValorHijoId")) byId("designerRelacionValorHijoId").value = vid;
        if(byId("designerRelacionCatalogoHijoId")) byId("designerRelacionCatalogoHijoId").value = String(cat.catalogo_id || "").toUpperCase();
        if(byId("designerRelacionCatalogoPadreId")) byId("designerRelacionCatalogoPadreId").value = padreId;
        if(byId("designerRelacionValorTitulo")) byId("designerRelacionValorTitulo").textContent = "Relacionar valor";
        if(byId("designerRelacionValorSubtitulo")) byId("designerRelacionValorSubtitulo").textContent = "Seleccione uno o varios registros del catálogo padre.";
        if(byId("designerRelacionValorHijoNombre")) byId("designerRelacionValorHijoNombre").textContent = getValorTextoVisibleDesigner(valor) || valor.clave || vid;
        if(byId("designerRelacionCatalogoPadreNombre")) byId("designerRelacionCatalogoPadreNombre").textContent = obtenerNombreCatalogoDesigner(padreId) || padreId;
        if(byId("designerRelacionBuscarPadre")) byId("designerRelacionBuscarPadre").value = "";

        const modal = byId("modalDesignerRelacionValor");
        if(modal) modal.classList.add("open");
        const box = byId("designerRelacionPadreLista");
        if(box) box.innerHTML = '<div class="designer-empty">Cargando relaciones...</div>';

        solicitarCatalogosDesigner({
          modo:"relaciones_valor",
          catalogo_hijo_id:String(cat.catalogo_id || "").toUpperCase(),
          valor_hijo_id:vid,
          catalogo_padre_id:padreId
        })
          .then(function(res){
            const d2 = state.disenadorCotiza || {};
            if(res && (res.ok || res.success)){
              const valoresPadre = res.valores_padre || [];
              const relaciones = res.relaciones || res.catalogo_relaciones || [];
              fusionarValoresCatalogosDesigner_(normalizarDataModuloParametros(valoresPadre));
              // Reemplazamos solo relaciones del catálogo hijo y luego agregamos las filtradas.
              reemplazarRelacionesCatalogoDesigner_(String(cat.catalogo_id || "").toUpperCase(), normalizarDataModuloParametros(relaciones));
              d2.relacionesModalSeleccionadas = normalizarDataModuloParametros(relaciones).map(function(r){ return String(r.valor_padre_id || "").toUpperCase(); }).filter(Boolean);
            }else{
              d2.relacionesModalSeleccionadas = getValorPadreIdsDesigner(valor);
            }
            state.disenadorCotiza = d2;
            renderListaRelacionValorDesigner();
          })
          .catch(function(){
            const d2 = state.disenadorCotiza || {};
            d2.relacionesModalSeleccionadas = getValorPadreIdsDesigner(valor);
            state.disenadorCotiza = d2;
            renderListaRelacionValorDesigner();
          });
      }


      function cerrarModalRelacionValorDesigner(){
        const modal = byId("modalDesignerRelacionValor");
        if(modal) modal.classList.remove("open");
      }

      function renderListaRelacionValorDesigner(){
        const box = byId("designerRelacionPadreLista");
        if(!box) return;
        const d = state.disenadorCotiza || {};
        const padreId = byId("designerRelacionCatalogoPadreId") ? String(byId("designerRelacionCatalogoPadreId").value || "").toUpperCase() : "";
        let valoresPadre = obtenerValoresDeCatalogoDesigner(padreId);
        const buscar = normalizarTextoBusquedaParam_(byId("designerRelacionBuscarPadre") ? byId("designerRelacionBuscarPadre").value || "" : "");
        if(buscar){
          valoresPadre = valoresPadre.filter(function(v){
            return normalizarTextoBusquedaParam_([v.valor_id, v.clave, getValorTextoVisibleDesigner(v), getValorSistemaDesigner(v), v.descripcion].join(" ")).indexOf(buscar) >= 0;
          });
        }
        const actuales = {};
        (d.relacionesModalSeleccionadas || []).forEach(function(id){ actuales[String(id || "").toUpperCase()] = true; });
        if(!padreId){
          box.innerHTML = '<div class="designer-empty">Este valor no tiene catálogo padre disponible.</div>';
          return;
        }
        if(!valoresPadre.length){
          box.innerHTML = '<div class="designer-empty">No hay registros del catálogo padre para mostrar.</div>';
          return;
        }
        box.innerHTML = valoresPadre.map(function(v){
          const id = String(v.valor_id || "").trim().toUpperCase();
          const label = getValorTextoVisibleDesigner(v) || v.clave || id;
          const checked = actuales[id] ? ' checked' : '';
          const relacion = (d.relaciones || []).find(function(r){
            return String(r.valor_hijo_id || "").trim().toUpperCase() === String(d.valorRelacionSeleccionado || "").trim().toUpperCase() &&
              String(r.valor_padre_id || "").trim().toUpperCase() === id && isActivoParam_(r.activo);
          });
          const relacionId = relacion ? String(relacion.relacion_id || "").trim() : "";
          return '<div class="designer-rel-modal-item"><label>' +
            '<input type="checkbox" data-valor-padre-id="' + escapeHtml(id) + '" value="' + escapeHtml(id) + '"' + checked + '>' +
            '<span><strong>' + escapeHtml(label) + '</strong><small>' + escapeHtml(v.clave || id) + '</small></span></label>' +
            (relacionId ? '<button class="mini mini-danger" type="button" data-relacion-delete="' + escapeHtml(relacionId) + '" title="Eliminar relación">🗑</button>' : '') +
          '</div>';
        }).join("");
        box.querySelectorAll('input[data-valor-padre-id]').forEach(function(chk){
          chk.addEventListener('change', function(){
            const selected = leerRelacionesPadreSeleccionadasDesigner();
            const d2 = state.disenadorCotiza || {};
            d2.relacionesModalSeleccionadas = selected;
            state.disenadorCotiza = d2;
          });
        });
        box.querySelectorAll('[data-relacion-delete]').forEach(function(btn){
          btn.addEventListener('click', function(){ eliminarRelacionValorDesigner(btn.getAttribute('data-relacion-delete') || ''); });
        });
      }

      function eliminarRelacionValorDesigner(relacionId){
        relacionId = String(relacionId || "").trim();
        if(!relacionId || !window.confirm("¿Desea eliminar esta relación entre valores?")) return;
        setLoading("section-parametros", true);
        eliminarCatalogosDesigner("/api/catalogos/relaciones/" + encodeURIComponent(relacionId))
          .then(function(res){
            setLoading("section-parametros", false);
            mostrarToast(res.mensaje || "Relación eliminada.");
            const d = state.disenadorCotiza || {};
            const eliminada = (d.relaciones || []).find(function(r){ return String(r.relacion_id || "") === relacionId; });
            const valorPadreEliminado = eliminada ? String(eliminada.valor_padre_id || "").trim().toUpperCase() : "";
            d.relaciones = (d.relaciones || []).filter(function(r){ return String(r.relacion_id || "") !== relacionId; });
            d.relacionesModalSeleccionadas = (d.relacionesModalSeleccionadas || []).filter(function(valorPadreId){
              return !valorPadreEliminado || String(valorPadreId || "").trim().toUpperCase() !== valorPadreEliminado;
            });
            state.disenadorCotiza = d;
            renderListaRelacionValorDesigner();
          })
          .catch(function(error){ setLoading("section-parametros", false); mostrarToast(error && error.message ? error.message : "No fue posible eliminar la relación."); });
      }

      function guardarRelacionesValorDesigner(){
        const d = state.disenadorCotiza || {};
        const valorId = byId("designerRelacionValorHijoId") ? String(byId("designerRelacionValorHijoId").value || "").trim().toUpperCase() : String(d.valorRelacionSeleccionado || "").trim().toUpperCase();
        const catalogoHijoId = byId("designerRelacionCatalogoHijoId") ? String(byId("designerRelacionCatalogoHijoId").value || "").trim().toUpperCase() : String(d.catalogoSeleccionado || "").trim().toUpperCase();
        const catalogoPadreId = byId("designerRelacionCatalogoPadreId") ? String(byId("designerRelacionCatalogoPadreId").value || "").trim().toUpperCase() : "";
        const valor = (d.valores || []).find(function(v){ return String(v.valor_id || "").trim().toUpperCase() === valorId; });
        if(!valor || !valorId || !catalogoHijoId || !catalogoPadreId){

      function obtenerMensajeCargaParametros_(){
        const d = state.disenadorCotiza || {};
        const pantalla = String(d.pantalla || "catalogos").toLowerCase();
        if(pantalla === "catalogos") {
          return { titulo:"Cargando catálogos", texto:"Espere por favor, Cotiza está leyendo catálogos, valores y relaciones." };
        }
        if(pantalla === "reglas") {
          return { titulo:"Cargando reglas", texto:"Espere por favor, Cotiza está leyendo reglas del cotizador." };
        }
        return { titulo:"Cargando cotizador", texto:"Espere por favor, Cotiza está leyendo secciones, componentes y configuración." };
      }

      function detectarMensajeProceso(id){
        let stack = "";
        try { stack = String((new Error()).stack || "").toLowerCase(); } catch(e) { stack = ""; }

        if(stack.indexOf("guardar") >= 0) {
          return { titulo:"Guardando cambios", texto:"Espere por favor, Cotiza está guardando la información." };
        }
        if(stack.indexOf("compilar") >= 0) {
          return { titulo:"Compilando cotizador", texto:"Espere por favor, Cotiza está generando la versión publicada." };
        }
        if(stack.indexOf("validar") >= 0) {
          return { titulo:"Validando configuración", texto:"Espere por favor, Cotiza está revisando la configuración." };
        }
        if(stack.indexOf("login") >= 0 || id === "loginView") {
          return { titulo:"Validando acceso", texto:"Espere por favor, Cotiza está validando el usuario y cargando la sesión." };
        }
        if(id === "section-dashboard") {
          return { titulo:"Cargando dashboard", texto:"Espere por favor, Cotiza está actualizando los indicadores." };
        }
        const parametrosActivo = byId("section-parametros") && byId("section-parametros").classList.contains("active");
        if(id === "section-cotizaciones") {
          if(parametrosActivo) return obtenerMensajeCargaParametros_();
          return { titulo:"Cargando cotizaciones", texto:"Espere por favor, Cotiza está consultando la información." };
        }
        if(id === "section-parametros") {
          return obtenerMensajeCargaParametros_();
        }
        return { titulo:"Procesando solicitud", texto:"Espere por favor, Cotiza está procesando la información." };
      }

      function mostrarProcesoGlobal(titulo,texto){
        const overlay = byId("cotizaProcessOverlay");
        if(!overlay) return;
        setText("cotizaProcessTitle", titulo || "Cargando información");
        setText("cotizaProcessText", texto || "Espere por favor, Cotiza está procesando la solicitud.");
        overlay.classList.add("open");
      }

      function ocultarProcesoGlobal(forzar){
        const overlay = byId("cotizaProcessOverlay");
        if(!overlay) return;
        if(forzar) procesoGlobal.contador = 0;
        if(procesoGlobal.contador <= 0) {
          clearTimeout(procesoGlobal.timer);
          procesoGlobal.timer = setTimeout(function(){
            if(procesoGlobal.contador <= 0) overlay.classList.remove("open");
          }, 120);
        }
      }

      function setLoading(id,loading){
        const el = byId(id);
        if(el) el.classList.toggle("loading", !!loading);

        if(loading){
          procesoGlobal.contador += 1;
          const msg = detectarMensajeProceso(id);
          mostrarProcesoGlobal(msg.titulo, msg.texto);
        }else{
          procesoGlobal.contador = Math.max(0, procesoGlobal.contador - 1);
          ocultarProcesoGlobal(false);
        }
      }

      function setSidebarPrincipalColapsado_(colapsado, silencioso){
        const app = byId("appView");
        const sidebar = app ? app.querySelector(".sidebar") : null;
        const btn = byId("btnToggleSidebarPrincipal");
        const contraido = !!colapsado;

        if(app) app.classList.toggle("sidebar-collapsed", contraido);
        if(sidebar) sidebar.classList.toggle("collapsed", contraido);

        if(btn){
          btn.setAttribute("aria-expanded", contraido ? "false" : "true");
          btn.setAttribute("aria-label", contraido ? "Expandir menu principal" : "Contraer menu principal");
          btn.title = contraido ? "Expandir menu" : "Contraer menu";

          const icon = btn.querySelector(".sidebar-toggle-icon");
          if(icon) icon.textContent = contraido ? "»" : "«";

          const label = btn.querySelector(".sidebar-toggle-label");
          if(label) label.textContent = contraido ? "Expandir" : "Contraer";
        }

        try{
          localStorage.setItem("cotiza_sidebar_colapsado", contraido ? "SI" : "NO");
        }catch(error){}

        if(!silencioso){
          setTimeout(function(){ window.dispatchEvent(new Event("resize")); }, 80);
        }
      }

        return String(value === undefined || value === null ? "" : value)
          .replace(/&/g,"&amp;")
          .replace(/</g,"&lt;")
          .replace(/>/g,"&gt;")
          .replace(/"/g,"&quot;")
          .replace(/'/g,"&#039;");
