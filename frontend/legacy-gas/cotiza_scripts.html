      function renderPaginacionModuloParametros(modulo,totalRegistros,pagina,totalPaginas){
        const cont = byId("paramModuloPagination");
        if(!cont) return;

        if(Number(totalRegistros || 0) <= Number(state.filasPorPaginaParametros || 10)){
          cont.innerHTML = '<div class="param-pagination-info">Mostrando ' + formatoNumero(totalRegistros) + ' registro(s).</div>';
          return;
        }

        const pag = obtenerPaginaModulo(modulo,totalRegistros);
        pagina = pag.pagina;
        totalPaginas = pag.totalPaginas;
        const inicio = pag.inicio + 1;
        const fin = pag.fin;

        let botones = '';
        botones += '<button class="param-page-btn" type="button" onclick="CotizaApp.cambiarPaginaParametro(' + (pagina - 1) + ')" ' + (pagina <= 1 ? 'disabled' : '') + '>‹</button>';

        const desde = Math.max(1, pagina - 2);
        const hasta = Math.min(totalPaginas, pagina + 2);

        if(desde > 1){
          botones += '<button class="param-page-btn" type="button" onclick="CotizaApp.cambiarPaginaParametro(1)">1</button>';
          if(desde > 2) botones += '<button class="param-page-btn" type="button" disabled>...</button>';
        }

        for(let i=desde;i<=hasta;i++){
          botones += '<button class="param-page-btn ' + (i === pagina ? 'active' : '') + '" type="button" onclick="CotizaApp.cambiarPaginaParametro(' + i + ')">' + i + '</button>';
        }

        if(hasta < totalPaginas){
          if(hasta < totalPaginas - 1) botones += '<button class="param-page-btn" type="button" disabled>...</button>';
          botones += '<button class="param-page-btn" type="button" onclick="CotizaApp.cambiarPaginaParametro(' + totalPaginas + ')">' + totalPaginas + '</button>';
        }

        botones += '<button class="param-page-btn" type="button" onclick="CotizaApp.cambiarPaginaParametro(' + (pagina + 1) + ')" ' + (pagina >= totalPaginas ? 'disabled' : '') + '>›</button>';

        cont.innerHTML =
          '<div class="param-pagination-info">Mostrando ' + formatoNumero(inicio) + ' a ' + formatoNumero(fin) + ' de ' + formatoNumero(totalRegistros) + ' registro(s). 10 por página.</div>' +
          '<div class="param-pagination-buttons">' + botones + '</div>';
      }

      function registroPerteneceAlCotizadorSeleccionado(modulo, item, cotizadorId){
        cotizadorId = String(cotizadorId || "").trim().toUpperCase();
        if(!cotizadorId) return true;

        // Estos módulos son globales o de sistema y no deben desaparecer solo porque se seleccionó un cotizador.
        if(modulo === "parametros_globales" || modulo === "catalogos_definicion" || modulo === "catalogos_valores"){
          const itemCalcGlobal = String(item.calculadora_id || item.cotizador_id || "").trim().toUpperCase();
          return !itemCalcGlobal || itemCalcGlobal === cotizadorId;
        }

        const itemCalc = String(item.calculadora_id || item.cotizador_id || item.calculadora || "").trim().toUpperCase();

        // Campos del Cotizador permite registros globales: Cotizador vacío = Todos.
        if(modulo === "campos_modelo" && !itemCalc){
          return true;
        }

        // En el módulo de Cotizadores el ID principal es calculadora_id.
        if(modulo === "calculadoras"){
          return String(item.calculadora_id || "").trim().toUpperCase() === cotizadorId;
        }

        return itemCalc === cotizadorId;
      }

      function obtenerFilasModuloFiltradas(){
        const modulo = state.paramModuloActual || "parametros_globales";
        const cfg = PARAMETROS_V9_MODULOS[modulo] || PARAMETROS_V9_MODULOS.parametros_globales;
        const cache = state.parametrosModuloCache[modulo] || {data:[]};
        const calc = obtenerCotizadorConfiguracionSeleccionado() || (byId("paramFiltroCalculadora") ? byId("paramFiltroCalculadora").value || "" : "");
        const tab = byId("paramFiltroTab") ? byId("paramFiltroTab").value || "" : "";
        const servicio = byId("paramFiltroServicio") ? byId("paramFiltroServicio").value || "" : "";
        const modelo = byId("paramFiltroModelo") ? byId("paramFiltroModelo").value || "" : "";
        const catalogo = byId("paramFiltroCatalogo") ? byId("paramFiltroCatalogo").value || "" : "";
        const estado = byId("paramFiltroEstado") ? byId("paramFiltroEstado").value || "" : "";
        const busq = byId("paramFiltroBusqueda") ? normalizarTexto(byId("paramFiltroBusqueda").value || "") : "";
        const verSistema = byId("paramFiltroVerSistema") ? !!byId("paramFiltroVerSistema").checked : false;

        return (cache.data || []).filter(function(item){
          if((modulo === "catalogos_definicion" || modulo === "catalogos_valores") && !catalogoPerteneceAlFiltroSistemaV10(item, modulo, verSistema)) return false;
          if(calc && !registroPerteneceAlCotizadorSeleccionado(modulo, item, calc)) return false;
          if(tab && String(item.tab_id || "").toUpperCase() !== tab) return false;
          if(servicio && String(item.servicio_id || "").toUpperCase() !== servicio) return false;
          if(modelo && String(item.modelo_cobro_id || item.modelo_cobro_default || "").toUpperCase() !== modelo) return false;
          if(catalogo && String(item.catalogo_id || "").toUpperCase() !== catalogo) return false;
          if(estado === "ACTIVO" && !normalizarBoolean(item.activo)) return false;
          if(estado === "INACTIVO" && normalizarBoolean(item.activo)) return false;
          if(estado && estado !== "ACTIVO" && estado !== "INACTIVO" && normalizarTexto(item.estado || "") !== normalizarTexto(estado)) return false;
          if(busq){
            const texto = normalizarTexto(Object.keys(item).map(function(k){ return item[k]; }).join(" "));
            if(texto.indexOf(busq) < 0) return false;
          }
          return true;
        }).sort(function(a,b){
          const ca = String(a.calculadora_id || "");
          const cb = String(b.calculadora_id || "");
          if(ca !== cb) return ca.localeCompare(cb);
          return Number(a.orden || 9999) - Number(b.orden || 9999);
        });
      }

      function configurarSugerenciasIdsCatalogos(modulo,item){
        const editando = !!item;
        if(modulo !== "catalogos_definicion" && modulo !== "catalogos_valores") return;

        function normalizarIdSugerido(texto){
          return String(texto || "")
            .trim()
            .toUpperCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/[^A-Z0-9]+/g, "_")
            .replace(/^_+|_+$/g, "");
        }

        if(modulo === "catalogos_definicion") {
          const id = byId("paramCampo_catalogo_id");
          const nombre = byId("paramCampo_nombre_catalogo");
          if(id && !editando){
            id.placeholder = "ID sugerido: USUARIOS_VENDEDORES";
            const actualizar = function(){
              if(id.value) return;
              const sugerido = normalizarIdSugerido(nombre ? nombre.value : "");
              if(sugerido) id.placeholder = "ID sugerido: " + sugerido;
            };
            if(nombre) nombre.addEventListener("input", actualizar);
            actualizar();
          }
        }

        if(modulo === "catalogos_valores") {
          const id = byId("paramCampo_valor_id");
          const catalogo = byId("paramCampo_catalogo_id");
          const clave = byId("paramCampo_clave");
          const opcion = byId("paramCampo_opcion");
          if(id && !editando){
            const actualizar = function(){
              if(id.value) return;
              const cat = normalizarIdSugerido(catalogo ? catalogo.value : "");
              const key = normalizarIdSugerido(clave && clave.value ? clave.value : (opcion ? opcion.value : ""));
              const sugerido = cat && key ? "CATV-" + cat + "-" + key : "CATV-CATALOGO-CLAVE";
              id.placeholder = "ID sugerido: " + sugerido;
            };
            [catalogo,clave,opcion].forEach(function(el){ if(el) el.addEventListener("input", actualizar); if(el) el.addEventListener("change", actualizar); });
            actualizar();
          }
        }
      }

      function configurarAyudaContextualElementosTab(modulo,cfg){
        const panel = byId("paramSideHelp");
        const fieldsBox = byId("paramGeneralFields");
        if(!panel || !fieldsBox) return;
        const usaAyudaContextual = usaAyudaContextualParametros(modulo);
        if(!usaAyudaContextual) return;
        const fieldMap = {};
        (cfg.fields || []).forEach(function(f){ fieldMap[f.key] = f; });
        function activar(key){
          const field = fieldMap[key] || {key:key,label:key};
          actualizarAyudaContextualParametros(modulo, field);
          Array.prototype.forEach.call(fieldsBox.querySelectorAll(".field.param-field-focused"),function(el){ el.classList.remove("param-field-focused"); });
          Array.prototype.forEach.call(fieldsBox.querySelectorAll(".field[data-param-key]"),function(node){
            if(String(node.getAttribute("data-param-key") || "") === String(key || "")) node.classList.add("param-field-focused");
          });
        }
        Array.prototype.forEach.call(fieldsBox.querySelectorAll(".field[data-param-key]"),function(el){
          const key = el.getAttribute("data-param-key") || "";
          el.addEventListener("mouseenter",function(){ activar(key); });
          el.addEventListener("click",function(){ activar(key); });
          Array.prototype.forEach.call(el.querySelectorAll("input,select,textarea"),function(control){
            control.addEventListener("focus",function(){ activar(key); });
          });
        });
        actualizarAyudaContextualParametros(modulo,{key:"inicio",label: obtenerTituloAyudaContextualParametros(modulo)});
      }

        title.textContent = info.titulo || field.label || "Ayuda";
        let html = "";
        if(info.descripcion) html += '<p>' + escapeHtml(info.descripcion) + '</p>';

          html += '<p><strong>Cuándo se usa:</strong></p><ul>' + info.uso.map(function(x){ return '<li>' + escapeHtml(x) + '</li>'; }).join("") + '</ul>';
        }
        if(info.ejemplos && info.ejemplos.length){
          html += '<p><strong>Ejemplos:</strong></p><ul>' + info.ejemplos.map(function(x){ return '<li><code>' + escapeHtml(x) + '</code></li>'; }).join("") + '</ul>';

      function obtenerAyudaDetalladaCatalogoDefinicion(field){

      function esCampoIdProtegidoParametro(modulo, cfg, field){
        const key = String(field && field.key || "").trim();
        if(!key) return false;
        cfg = cfg || PARAMETROS_V9_MODULOS[String(modulo || "")] || {};
        if(cfg.idField && key === cfg.idField) return true;
        if(field && field.readOnlyOnEdit) return true;
        return false;
      }

      function renderCampoModalParametro(field,item){
        const id = "paramCampo_" + field.key;
        const val = item[field.key];
        const full = field.full || field.type === "textarea" ? " full" : "";
        const req = field.required ? " *" : "";
        const moduloActualCampo = state.paramModuloActual || "parametros_globales";
        const cfgActualCampo = PARAMETROS_V9_MODULOS[moduloActualCampo] || PARAMETROS_V9_MODULOS.parametros_globales;
        const isEditValue = item && val !== undefined && val !== null && String(val) !== "";
        const lockedOnEdit = esCampoIdProtegidoParametro(moduloActualCampo, cfgActualCampo, field) && isEditValue;
        const lockedAttr = lockedOnEdit ? " disabled" : "";
        const lockedHelp = lockedOnEdit ? '<small class="param-field-help">Este ID queda bloqueado al editar para proteger la integridad de los datos y evitar romper referencias.</small>' : '';
        const fieldDataAttr = ' data-param-key="' + escapeHtml(field.key || "") + '"';
        if(field.type === "serviciosRelacionados"){
          return renderCampoServiciosRelacionadosParametro(field,item || {});
        }
        if(field.type === "textarea"){
          return '<div class="field' + full + '"' + fieldDataAttr + '>' + renderLabelCampoParametro(field,id,req) + '<textarea id="' + id + '" class="input"' + lockedAttr + '>' + escapeHtml(val || "") + '</textarea>' + renderAyudaCampoParametro(field) + lockedHelp + '</div>';
        }
        if(field.type === "checkbox"){
          const checked = normalizarBoolean(val === undefined ? true : val) ? "checked" : "";
          return '<div class="field"' + fieldDataAttr + '><label class="param-switch" title="' + escapeHtml(obtenerAyudaCampoParametro(field)) + '"><input id="' + id + '" type="checkbox" ' + checked + '> ' + escapeHtml(field.label) + '<span class="param-help-tip" title="' + escapeHtml(obtenerAyudaCampoParametro(field)) + '">?</span></label>' + renderAyudaCampoParametro(field) + '</div>';
        }
        if(field.type === "select" || field.type === "selectStatic"){
          const opts = field.type === "selectStatic" ? (field.options || []).map(function(o){ return '<option value="' + escapeHtml(o) + '" ' + (String(o) === String(val || "") ? 'selected' : '') + '>' + escapeHtml(o) + '</option>'; }).join("") : "";
          return '<div class="field' + full + '"' + fieldDataAttr + '>' + renderLabelCampoParametro(field,id,req) + '<select id="' + id + '" class="select"' + lockedAttr + '>' + opts + '</select>' + renderAyudaCampoParametro(field) + lockedHelp + '</div>';
        }
        return '<div class="field' + full + '"' + fieldDataAttr + '>' + renderLabelCampoParametro(field,id,req) + '<input id="' + id + '" class="input" type="' + (field.type === "number" ? "number" : "text") + '" value="' + escapeHtml(val || "") + '"' + lockedAttr + '>' + renderAyudaCampoParametro(field) + lockedHelp + '</div>';
      }

      function renderCampoServiciosRelacionadosParametro(field,item){
        const seleccionados = normalizarListaServiciosRelacionados(item ? item.servicios_relacionados || item.serviciosRelacionados || item.relacionados || "" : "");
        const calcId = item && item.calculadora_id ? item.calculadora_id : "";
        const servicioId = item && item.servicio_id ? item.servicio_id : "";
        const html = construirHtmlServiciosRelacionadosParametro(seleccionados, calcId, servicioId);
        return '<div class="field full param-related-services-field" data-param-key="servicios_relacionados">' +
          '<label>Servicios relacionados</label>' +
          '<div class="param-module-help" style="margin:0 0 10px;">Seleccione los servicios que se pueden incluir o están relacionados con este servicio.</div>' +
          '<div id="paramServiciosRelacionadosBox" class="addon-grid" style="grid-template-columns:repeat(2,minmax(0,1fr));">' + html + '</div>' +
          '<small class="param-field-help">Estos servicios aparecerán como opciones adicionales cuando este servicio sea la base de la propuesta.</small>' +
          '</div>';
      }

      function construirHtmlServiciosRelacionadosParametro(seleccionados, calcId, servicioId){
        const seleccion = new Set(normalizarListaServiciosRelacionados(seleccionados).map(function(x){ return String(x || "").trim().toUpperCase(); }));
        const calc = String(calcId || "").trim().toUpperCase();
        const actual = String(servicioId || "").trim().toUpperCase();
        const servicios = (state.parametrosModuloCache.servicios && state.parametrosModuloCache.servicios.data ? state.parametrosModuloCache.servicios.data : state.serviciosProductos || [])
          .filter(function(s){
            const sid = String(s.servicio_id || s.id || "").trim().toUpperCase();
            const scalc = String(s.calculadora_id || s.calculadora || "").trim().toUpperCase();
            if(!sid) return false;
            if(actual && sid === actual) return false;
            if(calc && scalc && scalc !== calc) return false;
            if(s.activo !== undefined && !normalizarBoolean(s.activo)) return false;
            return true;
          })
          .sort(function(a,b){
            const oa = Number(a.orden || 9999), ob = Number(b.orden || 9999);
            if(oa !== ob) return oa - ob;
            return String(a.nombre_servicio || a.nombre || a.servicio_id || "").localeCompare(String(b.nombre_servicio || b.nombre || b.servicio_id || ""));
          });

        if(!servicios.length){
          return '<div class="empty-inline">No hay otros servicios activos para relacionar.</div>';
        }

        return servicios.map(function(s){
          const sid = String(s.servicio_id || s.id || "").trim();
          const label = s.nombre_servicio || s.nombre || sid;
          const checked = seleccion.has(sid.toUpperCase()) ? ' checked' : '';
          return '<label class="addon-option">' +
            '<input type="checkbox" class="param-servicio-relacionado-check" value="' + escapeHtml(sid) + '"' + checked + '> ' +
            '<span>' + escapeHtml(label) + '</span>' +
            '</label>';
        }).join('');
      }

      function refrescarServiciosRelacionadosParametro(){
        const box = byId("paramServiciosRelacionadosBox");
        if(!box) return;
        const seleccionados = obtenerServiciosRelacionadosParametroSeleccionados();
        const calcId = byId("paramCampo_calculadora_id") ? byId("paramCampo_calculadora_id").value || "" : "";
        const servicioId = byId("paramCampo_servicio_id") ? byId("paramCampo_servicio_id").value || "" : "";
        box.innerHTML = construirHtmlServiciosRelacionadosParametro(seleccionados, calcId, servicioId);
      }

      function obtenerServiciosRelacionadosParametroSeleccionados(){
        return Array.prototype.slice.call(document.querySelectorAll("#paramServiciosRelacionadosBox .param-servicio-relacionado-check:checked"))
          .map(function(chk){ return String(chk.value || "").trim(); })
          .filter(Boolean);
      }

      function cerrarModalParametroGeneral(){
        if(byId("modalParametroGeneral")) byId("modalParametroGeneral").classList.remove("open");
      }

      function guardarParametroGeneral(){
        const modulo = state.paramModuloActual || "parametros_globales";
        const cfg = PARAMETROS_V9_MODULOS[modulo] || PARAMETROS_V9_MODULOS.parametros_globales;
        const idOriginal = byId("paramRegistroIdOriginal") ? byId("paramRegistroIdOriginal").value || "" : "";
        const registro = {};

        for(let i=0;i<cfg.fields.length;i++){
          const field = cfg.fields[i];
          const el = byId("paramCampo_" + field.key);
          if(field.type === "serviciosRelacionados"){
            registro[field.key] = serializarListaServiciosRelacionados(obtenerServiciosRelacionadosParametroSeleccionados());
            continue;
          }
          if(!el) continue;
          const wrap = el.closest(".field");
          if(wrap && wrap.classList.contains("hidden")){
            registro[field.key] = "";
            continue;
          }
          let value = field.type === "checkbox" ? el.checked : el.value;
          if(field.upper && typeof value === "string") value = value.trim().toUpperCase();
          if(field.required && !String(value || "").trim()){
            mostrarToast("Debe completar: " + field.label);
            return;
          }
          registro[field.key] = value;
        }

        if(idOriginal && !registro[cfg.idField]) registro[cfg.idField] = idOriginal;

        if(typeof google === "undefined" || !google.script || !google.script.run){
          guardarParametroGeneralLocal(modulo,cfg,registro,idOriginal);
          return;
        }

        setLoading("section-parametros", true);
        google.script.run
          .withSuccessHandler(function(res){
            setLoading("section-parametros", false);
            if(!res || !res.ok){
              mostrarToast((res && res.error) ? res.error : "No fue posible guardar el registro.");
              return;
            }
            cerrarModalParametroGeneral();
            mostrarToast(res.mensaje || "Registro guardado.");
            delete state.parametrosModuloCache[modulo];
            if(modulo === "calculadoras"){
              cargarCalculadoras(function(){ cargarModuloParametros(modulo,true); });
            }else{
              cargarModuloParametros(modulo,true);
            }
          })
          .withFailureHandler(function(error){
            setLoading("section-parametros", false);
            mostrarToast(error && error.message ? error.message : "No fue posible guardar el registro.");
          })
          .webGuardarModuloParametro({
            modulo:cfg.apiModulo || modulo,
            id_original:idOriginal,
            registro:registro,
            usuario_id_sesion:state.usuario ? state.usuario.usuario_id || "" : "",
            correo_sesion:state.usuario ? state.usuario.correo || "" : ""
          });
      }

      function guardarParametroGeneralLocal(modulo,cfg,registro,idOriginal){
        const cache = state.parametrosModuloCache[modulo] || {data:[]};
        if(idOriginal){
          const idx = cache.data.findIndex(function(x){ return obtenerIdRegistroModulo(cfg,x) === idOriginal; });
          if(idx >= 0) cache.data[idx] = Object.assign({}, cache.data[idx], registro);
        }else{
          cache.data.push(registro);
        }
        state.parametrosModuloCache[modulo] = cache;
        cerrarModalParametroGeneral();
        renderModuloParametros();
        mostrarToast("Registro actualizado localmente.");
      }

      function editarParametroRegistro(id){
        abrirModalParametroGeneral(id);
      }

      function cambiarEstadoParametroRegistro(id,activo){
        const modulo = state.paramModuloActual || "parametros_globales";
        const cfg = PARAMETROS_V9_MODULOS[modulo] || PARAMETROS_V9_MODULOS.parametros_globales;
        if(!cfg.editable) return;

        if(typeof google === "undefined" || !google.script || !google.script.run){
          const cache = state.parametrosModuloCache[modulo] || {data:[]};
          const item = cache.data.find(function(x){ return obtenerIdRegistroModulo(cfg,x) === id; });
          if(item) item.activo = activo;
          renderModuloParametros();
          return;
        }

        setLoading("section-parametros", true);
        google.script.run
          .withSuccessHandler(function(res){
            setLoading("section-parametros", false);
            if(!res || !res.ok){
              mostrarToast((res && res.error) ? res.error : "No fue posible cambiar el estado.");
              return;
            }
            mostrarToast(res.mensaje || "Estado actualizado.");
            delete state.parametrosModuloCache[modulo];
            if(modulo === "calculadoras"){
              cargarCalculadoras(function(){ cargarModuloParametros(modulo,true); });
            }else{
              cargarModuloParametros(modulo,true);
            }
          })
          .withFailureHandler(function(error){
            setLoading("section-parametros", false);
            mostrarToast(error && error.message ? error.message : "No fue posible cambiar el estado.");
          })
          .webCambiarEstadoModuloParametro({
            modulo:cfg.apiModulo || modulo,
            id:id,
            activo:activo,
            usuario_id_sesion:state.usuario ? state.usuario.usuario_id || "" : "",
            correo_sesion:state.usuario ? state.usuario.correo || "" : ""
          });
      }

      function eliminarParametroRegistro(id){
        const modulo = state.paramModuloActual || "parametros_globales";
        const cfg = PARAMETROS_V9_MODULOS[modulo] || PARAMETROS_V9_MODULOS.parametros_globales;
        if(!cfg.editable) return;

        if(modulo !== "elementos_tab" && modulo !== "campos_modelo"){
          mostrarToast("Por seguridad, esta acción solo está habilitada en Campos del Cotizador y Elementos del Tab.");
          return;
        }

        id = String(id || "").trim();
        if(!id){
          mostrarToast("No se recibió el ID del registro a borrar.");
          return;
        }

        const cache = state.parametrosModuloCache[modulo] || {data:[]};
        const item = (cache.data || []).find(function(x){ return obtenerIdRegistroModulo(cfg,x) === id; }) || {};
        const detalle = modulo === "campos_modelo"
          ? [item.label || "", item.servicio_id || "", item.modelo_cobro_id || ""].filter(Boolean).join(" / ")
          : [item.label_visible || "", item.campo_id || "", item.tab_id || "", item.servicio_id || ""].filter(Boolean).join(" / ");

        let mensaje = "";
        if(modulo === "campos_modelo"){
          mensaje = "¿Seguro que desea eliminar este campo del cotizador?\n\n" +
            "ID: " + id + (detalle ? "\n" + detalle : "") +
            "\n\nRegla de seguridad:\n" +
            "- Si el campo no está usado en Elementos del Tab, se elimina la fila.\n" +
            "- Si el campo ya está usado, se inactiva el campo y sus elementos relacionados para no romper cotizaciones ni compilación.\n\n" +
            "Después debe recompilar el cotizador.";
        } else {
          mensaje = "¿Seguro que desea borrar este elemento del tab?\n\n" +
            "ID: " + id + (detalle ? "\n" + detalle : "") +
            "\n\nEsta acción elimina la fila de la tabla Elementos_Tab_Cotizador. Después debe recompilar el cotizador.";
        }

        if(!window.confirm(mensaje)) return;

        if(typeof google === "undefined" || !google.script || !google.script.run){
          cache.data = (cache.data || []).filter(function(x){ return obtenerIdRegistroModulo(cfg,x) !== id; });
          state.parametrosModuloCache[modulo] = cache;
          renderModuloParametros();
          mostrarToast("Registro borrado localmente.");
          return;
        }

        setLoading("section-parametros", true);
        let deleteFinalizado = false;
        const deleteTimeout = window.setTimeout(function(){
          if(deleteFinalizado) return;
          deleteFinalizado = true;
          setLoading("section-parametros", false);
          mostrarToast("La acción está tardando demasiado. Refresque la pantalla y valide si el registro ya fue eliminado o inactivado. No presione borrar varias veces.");
        }, 45000);

        google.script.run
          .withSuccessHandler(function(res){
            if(deleteFinalizado) return;
            deleteFinalizado = true;
            window.clearTimeout(deleteTimeout);
            setLoading("section-parametros", false);
            if(!res || !res.ok){
              mostrarToast((res && res.error) ? res.error : "No fue posible borrar el registro.");
              return;
            }
            mostrarToast(res.mensaje || "Registro borrado.");
            delete state.parametrosModuloCache[modulo];
            cargarModuloParametros(modulo,true);
          })
          .withFailureHandler(function(error){
            if(deleteFinalizado) return;
            deleteFinalizado = true;
            window.clearTimeout(deleteTimeout);
            setLoading("section-parametros", false);
            mostrarToast(error && error.message ? error.message : "No fue posible borrar el registro.");
          })
          .webEliminarModuloParametro({
            modulo:cfg.apiModulo || modulo,
            id:id,
            usuario_id_sesion:state.usuario ? state.usuario.usuario_id || "" : "",
            correo_sesion:state.usuario ? state.usuario.correo || "" : ""
          });
      }

      function escapeJs(value){
        return String(value || "").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,'\\"');
      }

      function cambiarTabParametros(tab){
        const tabs = {
          formasPago:"paramPanelFormasPago",
          calculadora:"paramPanelCalculadora",
          servicios:"paramPanelServicios",
          reglas:"paramPanelReglas"
        };

        Object.keys(tabs).forEach(function(key){
          const panel = byId(tabs[key]);
          if(panel) panel.classList.toggle("active", key === tab);
        });

        const btns = {
          formasPago:"btnParamTabFormasPago",
          calculadora:"btnParamTabCalculadora",
          servicios:"btnParamTabServicios",
          reglas:"btnParamTabReglas"
        };

        Object.keys(btns).forEach(function(key){
          const btn = byId(btns[key]);
          if(btn) btn.classList.toggle("active", key === tab);
        });

        if(tab === "servicios"){
          prepararCombosServiciosProductos();
          if(!state.serviciosProductos.length){
            cargarServiciosProductos();
          }else{
            renderServiciosProductos();
          }
        }

        if(tab === "formasPago"){
          prepararCombosFormasPago();
          if(!state.formasPago.length){
            cargarFormasPago();
          }else{
            renderFormasPago();
          }
        }
      }

      function refrescarParametrosActivos(){
        if(byId("paramPanelServicios") && byId("paramPanelServicios").classList.contains("active")){
          cargarServiciosProductos();
          return;
        }
        if(byId("paramPanelFormasPago") && byId("paramPanelFormasPago").classList.contains("active")){
          cargarFormasPago();
          return;
        }
        mostrarToast("Esta pantalla todavía no tiene actualización disponible.");
      }

      function cargarServiciosProductos(){
        prepararCombosServiciosProductos();

        const tbody = byId("paramServiciosBody");
        if(tbody){
          tbody.innerHTML = '<tr><td colspan="8">Cargando servicios / productos...</td></tr>';
        }

        if(typeof google === "undefined" || !google.script || !google.script.run){
          state.serviciosProductos = [];
          renderServiciosProductos();
          return;
        }

        setLoading("section-parametros", true);

        google.script.run
          .withSuccessHandler(function(res){
            try{
              if(!res || !res.ok){
                throw new Error((res && res.error) ? res.error : "No fue posible cargar servicios / productos.");
              }

              state.serviciosProductos = normalizarServiciosProductos(res.servicios || res.servicios_productos || res.data || []);
              state.modelosCobroParametros = normalizarModelosCobro((res.catalogos && res.catalogos.modelos_cobro) || res.modelos_cobro || []);
              if(!state.catalogosParametros) state.catalogosParametros = {};
              state.catalogosParametros.servicios = state.serviciosProductos;
              state.catalogosParametros.modelos_cobro = state.modelosCobroParametros;
              prepararCombosServiciosProductos();
              prepararCombosFormasPago();
              renderServiciosProductos();
            }catch(error){
              state.serviciosProductos = [];
              renderServiciosProductos();
              mostrarToast(error.message || "No fue posible cargar servicios / productos.");
            }finally{
              setLoading("section-parametros", false);
            }
          })
          .withFailureHandler(function(error){
            setLoading("section-parametros", false);
            state.serviciosProductos = [];
            renderServiciosProductos();
            mostrarToast(error && error.message ? error.message : "API de Servicios / Productos pendiente.");
          })
          .webListarServiciosProductosParametros({
            usuario_id_sesion:state.usuario ? state.usuario.usuario_id || "" : "",
            correo_sesion:state.usuario ? state.usuario.correo || "" : ""
          });
      }

      function normalizarServiciosProductos(items){
        return (items || []).map(function(item){
          const calculadoraId = String(item.calculadora_id || item.calculadora || "").trim().toUpperCase();
          const servicioId = String(item.servicio_id || item.id || item.servicio || "").trim().toUpperCase();
          const modeloId = String(item.modelo_cobro_default || item.modelo_cobro_id || item.modelo || "").trim().toUpperCase();
          return {
            id:servicioId,
            servicio_id:servicioId,
            calculadora:calculadoraId,
            calculadora_id:calculadoraId,
            calculadoraNombre:item.calculadora_nombre || item.nombre_calculadora || obtenerNombreCalculadora(calculadoraId),
            nombre:item.nombre_servicio || item.nombre || item.servicio || "",
            nombre_servicio:item.nombre_servicio || item.nombre || item.servicio || "",
            descripcion:item.descripcion || item.Descripcion || "",
            modelo_cobro_default:modeloId,
            nombre_modelo:item.nombre_modelo || item.modelo_nombre || "",
            servicios_relacionados:normalizarListaServiciosRelacionados(item.servicios_relacionados || item.serviciosRelacionados || item.relacionados || ""),
            orden:Number(item.orden || item.Orden || 999),
            activo:normalizarBoolean(item.activo !== undefined ? item.activo : item.Activo)
          };
        });
      }

      function normalizarListaServiciosRelacionados(valor){
        if(Array.isArray(valor)){
          return valor.map(function(x){ return String(x || "").trim().toUpperCase(); }).filter(Boolean);
        }
        return String(valor || "").split(/[,;|\n]+/).map(function(x){ return String(x || "").trim().toUpperCase(); }).filter(Boolean);
      }

      function serializarListaServiciosRelacionados(lista){
        return (lista || []).map(function(x){ return String(x || "").trim().toUpperCase(); }).filter(Boolean).filter(function(x,idx,arr){ return arr.indexOf(x) === idx; }).join(",");
      }

      function obtenerServiciosRelacionadosSeleccionados(){
        const out = [];
        document.querySelectorAll(".js-servicio-relacionado:checked").forEach(function(chk){
          const id = String(chk.value || "").trim().toUpperCase();
          if(id && out.indexOf(id) < 0) out.push(id);
        });
        return out;
      }

      function renderServiciosRelacionadosServicio(seleccionados){
        const box = byId("servicioRelacionadosBox");
        if(!box) return;
        const calc = byId("servicioCalculadora") ? String(byId("servicioCalculadora").value || "").trim().toUpperCase() : "";
        const servicioActual = byId("servicioId") ? String(byId("servicioId").value || "").trim().toUpperCase() : "";
        const seleccion = normalizarListaServiciosRelacionados(seleccionados || []);
        const servicios = (state.serviciosProductos || []).filter(function(s){
          if(calc && String(s.calculadora || "").trim().toUpperCase() !== calc) return false;
          if(servicioActual && String(s.servicio_id || s.id || "").trim().toUpperCase() === servicioActual) return false;
          return !!s.activo;
        }).sort(function(a,b){ return Number(a.orden || 999) - Number(b.orden || 999); });

        if(!servicios.length){
          box.innerHTML = '<div class="help">No hay otros servicios activos para relacionar.</div>';
          return;
        }

        box.innerHTML = servicios.map(function(s){
          const id = String(s.servicio_id || s.id || "").trim().toUpperCase();
          const checked = seleccion.indexOf(id) >= 0 ? " checked" : "";
          return '<label class="addon-item" style="align-items:flex-start;"><input type="checkbox" class="js-servicio-relacionado" value="' + escapeHtml(id) + '"' + checked + '> <span><strong>' + escapeHtml(s.nombre || s.nombre_servicio || id) + '</strong><small style="display:block;color:#667085;margin-top:2px;">' + escapeHtml(id) + '</small></span></label>';
        }).join("");
      }

      function normalizarModelosCobro(items){
        return (items || []).map(function(item){
          const id = String(item.modelo_cobro_id || item.id || item.modelo || "").trim().toUpperCase();
          return {
            value:id,
            label:item.nombre_modelo || item.nombre || id,
            modelo_cobro_id:id,
            nombre_modelo:item.nombre_modelo || item.nombre || id
          };
        }).filter(function(item){ return item.value; });
      }

      function prepararCombosServiciosProductos(){
        const calcFiltro = byId("paramSvcCalculadora");
        const actualCalc = calcFiltro ? calcFiltro.value || "" : "";
        llenarSelect(calcFiltro, obtenerCalculadorasParametros(), "Todas", actualCalc);

        const modalCalc = byId("servicioCalculadora");
        const modalActual = modalCalc ? modalCalc.value || "" : "";
        const calculadoras = obtenerCalculadorasParametros();
        llenarSelect(modalCalc, calculadoras, "", modalActual || (calculadoras[0] ? obtenerValorOpcion(calculadoras[0]) : ""));

        const modeloSelect = byId("servicioModeloCobro");
        const modeloActual = modeloSelect ? modeloSelect.value || "" : "";
        llenarSelect(modeloSelect, obtenerModelosCobroParametros(), "Seleccione modelo", modeloActual);
      }

      function obtenerModelosCobroParametros(){
        const mapa = {};
        (state.modelosCobroParametros || []).forEach(function(m){
          const id = String(m.value || m.modelo_cobro_id || "").trim().toUpperCase();
          if(!id) return;
          mapa[id] = m.label || m.nombre_modelo || id;
        });
        const catalogo = state.catalogosParametros && state.catalogosParametros.modelos_cobro ? state.catalogosParametros.modelos_cobro : [];
        (catalogo || []).forEach(function(m){

      function limpiarFiltrosServiciosProductos(){
        if(byId("paramSvcCalculadora")) byId("paramSvcCalculadora").value = "";
        if(byId("paramSvcEstado")) byId("paramSvcEstado").value = "ACTIVO";
        if(byId("paramSvcBusqueda")) byId("paramSvcBusqueda").value = "";
        renderServiciosProductos();

      function obtenerServiciosProductosFiltrados(){
        const calc = byId("paramSvcCalculadora") ? byId("paramSvcCalculadora").value || "" : "";
        const estado = byId("paramSvcEstado") ? byId("paramSvcEstado").value || "" : "";
        const busqueda = byId("paramSvcBusqueda") ? normalizarTexto(byId("paramSvcBusqueda").value || "") : "";

        return (state.serviciosProductos || []).filter(function(s){
          const okCalc = !calc || s.calculadora === calc;
          const okEstado = !estado || (estado === "ACTIVO" && s.activo) || (estado === "INACTIVO" && !s.activo);
          const texto = normalizarTexto([s.id,s.calculadora,s.calculadoraNombre,s.nombre,s.descripcion,s.modelo_cobro_default,s.nombre_modelo].join(" "));
          const okBusqueda = !busqueda || texto.indexOf(busqueda) >= 0;
          return okCalc && okEstado && okBusqueda;
        }).sort(function(a,b){
          if(String(a.calculadora) !== String(b.calculadora)) return String(a.calculadora).localeCompare(String(b.calculadora));
          return Number(a.orden || 999) - Number(b.orden || 999);
        });
      }

      function renderServiciosProductos(){
        const tbody = byId("paramServiciosBody");
        const empty = byId("paramServiciosEmpty");
        if(!tbody) return;

        const items = obtenerServiciosProductosFiltrados();
        if(!items.length){
          tbody.innerHTML = '<tr><td colspan="8">No hay servicios / productos para los filtros seleccionados.</td></tr>';
          if(empty) empty.style.display = "block";
          return;
        }

        if(empty) empty.style.display = "none";

        tbody.innerHTML = items.map(function(s){
          const id = encodeURIComponent(s.id || "");
          const modeloNombre = s.nombre_modelo || obtenerNombreModeloCobro(s.modelo_cobro_default) || s.modelo_cobro_default || "";
          return '<tr>' +
            '<td>' + escapeHtml(s.orden || "") + '</td>' +
            '<td><strong>' + escapeHtml(s.id || "") + '</strong></td>' +
            '<td>' + escapeHtml(s.calculadoraNombre || obtenerNombreCalculadora(s.calculadora) || "") + '</td>' +
            '<td><strong>' + escapeHtml(s.nombre || "") + '</strong></td>' +
            '<td>' + escapeHtml(modeloNombre) + '</td>' +
            '<td>' + escapeHtml(s.descripcion || "") + ((s.servicios_relacionados || []).length ? '<br><small class="help"><strong>Relacionados:</strong> ' + escapeHtml((s.servicios_relacionados || []).join(', ')) + '</small>' : '') + '</td>' +
            '<td>' + (s.activo ? '<span class="badge badge-aceptada">Activo</span>' : '<span class="badge badge-vencida">Inactivo</span>') + '</td>' +
            '<td><div class="actions">' +
              '<button class="mini mini-primary" type="button" onclick="CotizaApp.editarServicioProducto(decodeURIComponent(\'' + id + '\'))">Editar</button>' +
              (s.activo
                ? '<button class="mini" type="button" onclick="CotizaApp.cambiarEstadoServicioProducto(decodeURIComponent(\'' + id + '\'),false)">Desactivar</button>'
                : '<button class="mini" type="button" onclick="CotizaApp.cambiarEstadoServicioProducto(decodeURIComponent(\'' + id + '\'),true)">Activar</button>') +
            '</div></td>' +
          '</tr>';
        }).join("");

      function obtenerNombreModeloCobro(modeloId){
        const id = String(modeloId || "").trim().toUpperCase();
        if(!id) return "";
        const modelos = obtenerModelosCobroParametros();
        const modelo = modelos.find(function(m){ return String(m.value || "").trim().toUpperCase() === id; });

          const item = (state.serviciosProductos || []).find(function(s){ return String(s.id) === String(id); });

      function guardarServicioProducto(){
        const idOriginal = byId("servicioIdOriginal") ? byId("servicioIdOriginal").value || "" : "";
        const servicioId = byId("servicioId") ? String(byId("servicioId").value || "").trim().toUpperCase() : "";
        const calculadoraId = byId("servicioCalculadora") ? String(byId("servicioCalculadora").value || "").trim().toUpperCase() : "";
        const nombre = byId("servicioNombre") ? (byId("servicioNombre").value || "").trim() : "";
        const modelo = byId("servicioModeloCobro") ? String(byId("servicioModeloCobro").value || "").trim().toUpperCase() : "";

        const payload = {
          id:idOriginal || servicioId,
          servicio_id:servicioId,
          servicio_id_original:idOriginal,
          calculadora_id:calculadoraId,
          nombre_servicio:nombre,
          descripcion:byId("servicioDescripcion") ? (byId("servicioDescripcion").value || "").trim() : "",
          modelo_cobro_default:modelo,
          servicios_relacionados:serializarListaServiciosRelacionados(obtenerServiciosRelacionadosSeleccionados()),
          orden:byId("servicioOrden") ? Number(byId("servicioOrden").value || 0) : 0,
          activo:byId("servicioActivo") ? byId("servicioActivo").checked : true,
          usuario_id_sesion:state.usuario ? state.usuario.usuario_id || "" : "",
          correo_sesion:state.usuario ? state.usuario.correo || "" : ""
        };

        if(!payload.calculadora_id){ mostrarToast("Debe seleccionar un cotizador."); return; }
        if(!payload.servicio_id){ mostrarToast("Debe indicar el ID del servicio / producto."); return; }
        if(!payload.nombre_servicio){ mostrarToast("Debe indicar el nombre del servicio / producto."); return; }
        if(!payload.modelo_cobro_default){ mostrarToast("Debe seleccionar el modelo de cobro default."); return; }
        if(!payload.orden || payload.orden < 1){ mostrarToast("Debe indicar un orden válido."); return; }

        if(typeof google === "undefined" || !google.script || !google.script.run){
          mostrarToast("Esta acción debe ejecutarse desde Cotiza publicado en Apps Script.");
          return;
        }

        setLoading("section-parametros", true);
        google.script.run
          .withSuccessHandler(function(res){
            setLoading("section-parametros", false);
            if(res && res.ok){
              cerrarModalServicioProducto();
              mostrarToast(idOriginal ? "Servicio / producto actualizado." : "Servicio / producto creado.");
              cargarServiciosProductos();
            }else{
              mostrarToast((res && res.error) ? res.error : "No fue posible guardar el servicio / producto.");
            }
          })
          .withFailureHandler(function(error){
            setLoading("section-parametros", false);
            mostrarToast(error && error.message ? error.message : "Error guardando servicio / producto.");
          })
          .webGuardarServicioProductoParametro(payload);
      }

        setLoading("section-parametros", true);

      function normalizarFormasPago(items){
        return (items || []).map(function(item){
          const calculadoraId = String(item.calculadora_id || item.calculadora || item.Calculadora || item.nombre_calculadora || "").trim().toUpperCase();
          const servicioId = String(item.servicio_id || item.servicio || item.Servicio || item.nombre_servicio || "").trim().toUpperCase();
          return {
            id:item.id || item.ID || item.forma_pago_id || item.codigo || "",
            forma_pago_id:item.forma_pago_id || item.id || item.ID || item.codigo || "",
            calculadora:calculadoraId,
            calculadora_id:calculadoraId,
            calculadoraNombre:item.calculadora_nombre || item.nombre_calculadora || obtenerNombreCalculadora(calculadoraId),
            servicio:servicioId,
            servicio_id:servicioId,
            servicioNombre:item.nombre_servicio || item.servicio_nombre || "",
            modelo_cobro_id:item.modelo_cobro_id || item.modelo_cobro || "",
            nombreModelo:item.nombre_modelo || item.modelo_nombre || "",
            nombre:item.nombre || item.Nombre || item.forma_pago || item.FormaPago || item.nombre_forma_pago || "",
            nombre_forma_pago:item.nombre_forma_pago || item.nombre || item.Nombre || item.forma_pago || item.FormaPago || "",
            descripcion:item.descripcion || item.Descripcion || item.detalle || "",
            texto_comercial:item.texto_comercial || item.textoComercial || item.texto || "",
            orden:Number(item.orden || item.Orden || 999),
            activo:normalizarBoolean(item.activo !== undefined ? item.activo : item.Activo)
          };
        });
      }

      function prepararCombosFormasPago(){
        const calcFiltro = byId("paramFpCalculadora");
        const servicioFiltro = byId("paramFpServicio");
        const actualCalc = calcFiltro ? calcFiltro.value || "" : "";
        const actualServicio = servicioFiltro ? servicioFiltro.value || "" : "";

        const calculadoras = obtenerCalculadorasParametros();
        llenarSelect(calcFiltro, calculadoras, "Todas", actualCalc);

        const calcSeleccionada = calcFiltro ? calcFiltro.value || "" : actualCalc;
        const servicios = obtenerServiciosParametros(calcSeleccionada);
        llenarSelect(servicioFiltro, servicios, "Todos", actualServicio);

        const modalCalc = byId("formaPagoCalculadora");
        const modalCalcActual = modalCalc ? modalCalc.value || "" : "";
        llenarSelect(modalCalc, calculadoras, "", modalCalcActual || (calculadoras[0] ? obtenerValorOpcion(calculadoras[0]) : ""));
        actualizarServiciosModalFormaPago();
      }

      function obtenerCalculadorasParametros(){
        const mapa = {};

        (state.calculadoras || []).forEach(function(c){
          const id = String(c.calculadora_id || "").trim().toUpperCase();
          if(!id) return;
          mapa[id] = c.nombre_calculadora || id;
        });

        const catalogo = state.catalogosParametros && state.catalogosParametros.calculadoras ? state.catalogosParametros.calculadoras : [];
        (catalogo || []).forEach(function(c){
          const id = String(c.calculadora_id || c.id || c || "").trim().toUpperCase();
          if(!id) return;
          mapa[id] = c.nombre_calculadora || c.nombre || mapa[id] || id;
        });

        (state.formasPago || []).forEach(function(fp){
          const id = String(fp.calculadora_id || fp.calculadora || "").trim().toUpperCase();
          if(!id) return;
          mapa[id] = fp.calculadoraNombre || mapa[id] || id;
        });

        if(!Object.keys(mapa).length) mapa.SESUITE = "Automatización";

        return Object.keys(mapa).sort(function(a,b){ return String(mapa[a]).localeCompare(String(mapa[b])); }).map(function(id){
          return {value:id, label:mapa[id] || id};
        });
      }

      function obtenerServiciosParametros(calculadora){
        const calc = String(calculadora || "").trim().toUpperCase();
        const mapa = {};

        (state.serviciosProductos || []).forEach(function(s){
          if(!s.activo) return;
          const calcId = String(s.calculadora_id || s.calculadora || "").trim().toUpperCase();
          const id = String(s.servicio_id || s.id || s.servicio || "").trim().toUpperCase();
          if(!id) return;
          if(calc && calcId !== calc) return;
          mapa[id] = s.nombre_servicio || s.nombre || id;
        });

        const catalogoServicios = state.catalogosParametros && state.catalogosParametros.servicios ? state.catalogosParametros.servicios : [];
        (catalogoServicios || []).forEach(function(s){
          const calcId = String(s.calculadora_id || s.calculadora || "").trim().toUpperCase();
          const id = String(s.servicio_id || s.id || s.servicio || "").trim().toUpperCase();
          if(!id) return;
          if(calc && calcId && calcId !== calc) return;
          mapa[id] = s.nombre_servicio || s.nombre || mapa[id] || id;
        });

        return Object.keys(mapa).sort(function(a,b){ return String(mapa[a]).localeCompare(String(mapa[b])); }).map(function(id){
          return {value:id, label:mapa[id] || id};
        });
      }

      function obtenerValorOpcion(opcion){
        if(opcion && typeof opcion === "object") return String(opcion.value || "");
        return String(opcion || "");
      }

      function obtenerEtiquetaOpcion(opcion){
        if(opcion && typeof opcion === "object") return String(opcion.label || opcion.value || "");
        return String(opcion || "");
      }

      function llenarSelect(select, valores, etiquetaVacia, valorActual){
        if(!select) return;
        select.innerHTML = "";

        if(etiquetaVacia !== ""){
          const option = document.createElement("option");
          option.value = "";
          option.textContent = etiquetaVacia;
          select.appendChild(option);
        }

        (valores || []).forEach(function(valor){
          const option = document.createElement("option");
          option.value = obtenerValorOpcion(valor);
          option.textContent = obtenerEtiquetaOpcion(valor);
          select.appendChild(option);
        });

        if(valorActual){
          select.value = String(valorActual).trim().toUpperCase();
        }
      }

      function obtenerNombreCalculadora(calculadoraId){
        const id = String(calculadoraId || "").trim().toUpperCase();
        if(!id) return "";
        const calc = (state.calculadoras || []).find(function(c){
          return String(c.calculadora_id || "").trim().toUpperCase() === id;
        });
        return calc ? (calc.nombre_calculadora || id) : id;
      }

      function obtenerNombreServicio(servicioId, calculadoraId){
        const id = String(servicioId || "").trim().toUpperCase();
        const calc = String(calculadoraId || "").trim().toUpperCase();
        if(!id) return "";

        const catalogoServicios = state.catalogosParametros && state.catalogosParametros.servicios ? state.catalogosParametros.servicios : [];
        const serv = (catalogoServicios || []).find(function(s){
          const sid = String(s.servicio_id || s.id || s.servicio || "").trim().toUpperCase();
          const cid = String(s.calculadora_id || s.calculadora || "").trim().toUpperCase();
          return sid === id && (!calc || !cid || cid === calc);
        });

        if(serv) return serv.nombre_servicio || serv.nombre || id;

        const fp = (state.formasPago || []).find(function(item){
          return String(item.servicio_id || item.servicio || "").trim().toUpperCase() === id &&
                 (!calc || String(item.calculadora_id || item.calculadora || "").trim().toUpperCase() === calc);
        });

        return fp && fp.servicioNombre ? fp.servicioNombre : id;
      }

      function limpiarFiltrosFormasPago(){
        if(byId("paramFpCalculadora")) byId("paramFpCalculadora").value = "";
        prepararCombosFormasPago();
        if(byId("paramFpServicio")) byId("paramFpServicio").value = "";
        if(byId("paramFpEstado")) byId("paramFpEstado").value = "ACTIVO";
        if(byId("paramFpBusqueda")) byId("paramFpBusqueda").value = "";
        renderFormasPago();
      }

      function obtenerFormasPagoFiltradas(){
        const calc = byId("paramFpCalculadora") ? byId("paramFpCalculadora").value || "" : "";
        const servicio = byId("paramFpServicio") ? byId("paramFpServicio").value || "" : "";
        const estado = byId("paramFpEstado") ? byId("paramFpEstado").value || "" : "";
        const busqueda = byId("paramFpBusqueda") ? normalizarTexto(byId("paramFpBusqueda").value || "") : "";

        return (state.formasPago || []).filter(function(fp){
          const okCalc = !calc || fp.calculadora === calc;
          const okServicio = !servicio || fp.servicio === servicio;
          const okEstado = !estado || (estado === "ACTIVO" && fp.activo) || (estado === "INACTIVO" && !fp.activo);
          const texto = normalizarTexto([fp.id,fp.calculadora,fp.calculadoraNombre,fp.servicio,fp.servicioNombre,fp.nombre,fp.descripcion,fp.texto_comercial].join(" "));
          const okBusqueda = !busqueda || texto.indexOf(busqueda) >= 0;
          return okCalc && okServicio && okEstado && okBusqueda;
        }).sort(function(a,b){
          if(String(a.calculadora) !== String(b.calculadora)) return String(a.calculadora).localeCompare(String(b.calculadora));
          if(String(a.servicio) !== String(b.servicio)) return String(a.servicio).localeCompare(String(b.servicio));
          return Number(a.orden || 999) - Number(b.orden || 999);
        });
      }

      function renderFormasPago(){
        const tbody = byId("paramFormasPagoBody");
        const empty = byId("paramFormasPagoEmpty");
        if(!tbody) return;

        const items = obtenerFormasPagoFiltradas();

        if(!items.length){
          tbody.innerHTML = '<tr><td colspan="8">No hay formas de pago para los filtros seleccionados.</td></tr>';
          if(empty) empty.style.display = "block";
          return;
        }

        if(empty) empty.style.display = "none";

        tbody.innerHTML = items.map(function(fp){
          const id = encodeURIComponent(fp.id || "");
          return '<tr>' +
            '<td>' + escapeHtml(fp.orden || "") + '</td>' +
            '<td><strong>' + escapeHtml(fp.id || "") + '</strong></td>' +

      function guardarFormaPago(){
        const idEditar = byId("formaPagoIdEditar") ? byId("formaPagoIdEditar").value || "" : "";
        const calculadoraId = byId("formaPagoCalculadora") ? String(byId("formaPagoCalculadora").value || "").trim().toUpperCase() : "";
        const servicioId = byId("formaPagoServicio") ? String(byId("formaPagoServicio").value || "").trim().toUpperCase() : "";
        const nombreFormaPago = byId("formaPagoNombre") ? (byId("formaPagoNombre").value || "").trim() : "";

        const payload = {
          id:idEditar,
          forma_pago_id:idEditar,
          calculadora_id:calculadoraId,
          calculadora:calculadoraId,
          servicio_id:servicioId,
          servicio:servicioId,
          nombre_forma_pago:nombreFormaPago,
          nombre:nombreFormaPago,
          descripcion:byId("formaPagoDescripcion") ? (byId("formaPagoDescripcion").value || "").trim() : "",
          texto_comercial:byId("formaPagoTextoComercial") ? (byId("formaPagoTextoComercial").value || "").trim() : "",
          orden:byId("formaPagoOrden") ? Number(byId("formaPagoOrden").value || 0) : 0,
          activo:byId("formaPagoActivo") ? byId("formaPagoActivo").checked : true,
          usuario_id_sesion:state.usuario ? state.usuario.usuario_id || "" : "",
          correo_sesion:state.usuario ? state.usuario.correo || "" : ""
        };

        if(!payload.calculadora){ mostrarToast("Debe seleccionar un cotizador."); return; }
        if(!payload.servicio){ mostrarToast("Debe seleccionar un servicio."); return; }
        if(!payload.nombre){ mostrarToast("Debe ingresar el nombre de la forma de pago."); return; }
        if(!payload.orden || payload.orden < 1){ mostrarToast("Debe indicar un orden válido."); return; }

        if(typeof google === "undefined" || !google.script || !google.script.run){
          guardarFormaPagoLocal(payload);
          return;
        }

        setLoading("section-parametros", true);
        google.script.run
          .withSuccessHandler(function(res){
            setLoading("section-parametros", false);
            if(res && res.ok){
              cerrarModalFormaPago();
              mostrarToast(idEditar ? "Forma de pago actualizada." : "Forma de pago creada.");
              cargarFormasPago();
            }else{
              guardarFormaPagoLocal(payload);
              mostrarToast((res && res.error) ? res.error : "API pendiente. Se guardó localmente para la prueba visual.");
            }
          })
          .withFailureHandler(function(error){
            setLoading("section-parametros", false);
            guardarFormaPagoLocal(payload);
            mostrarToast(error && error.message ? error.message : "API pendiente. Se guardó localmente para la prueba visual.");
          })
          .webGuardarFormaPagoParametro(payload);
      }

      function guardarFormaPagoLocal(payload){
        if(payload.id){
          const idx = state.formasPago.findIndex(function(fp){ return String(fp.id) === String(payload.id); });
          if(idx >= 0) state.formasPago[idx] = Object.assign({}, state.formasPago[idx], payload);
        }else{
          payload.id = generarIdFormaPago();
          state.formasPago.push(payload);
        }
        prepararCombosFormasPago();
        renderFormasPago();
        cerrarModalFormaPago();
      }

        if(!id) return;

        if(typeof google === "undefined" || !google.script || !google.script.run){
          cambiarEstadoFormaPagoLocal(id, activo);
          return;
        }

        setLoading("section-parametros", true);
        google.script.run
          .withSuccessHandler(function(res){
            setLoading("section-parametros", false);

              mostrarToast(activo ? "Forma de pago activada." : "Forma de pago desactivada.");
              cargarFormasPago();
            }else{
              cambiarEstadoFormaPagoLocal(id, activo);
            }
          })
          .withFailureHandler(function(){
            setLoading("section-parametros", false);
            cambiarEstadoFormaPagoLocal(id, activo);
          })
          .webCambiarEstadoFormaPagoParametro({
            id:id,

          });

      function cambiarEstadoFormaPagoLocal(id, activo){
        const item = (state.formasPago || []).find(function(fp){ return String(fp.id) === String(id); });
        if(!item) return;
        item.activo = activo;
        renderFormasPago();
        mostrarToast(activo ? "Forma de pago activada localmente." : "Forma de pago desactivada localmente.");
      }

      function generarIdFormaPago(){
        let max = 0;
        (state.formasPago || []).forEach(function(fp){
          const n = Number(String(fp.id || "").replace(/\D/g,""));
          if(n > max) max = n;
        });
        return "FP-" + String(max + 1).padStart(3,"0");
      }

      function normalizarBoolean(value){
        if(value === true || value === false) return value;
        const t = normalizarTexto(value);
        return t === "true" || t === "si" || t === "sí" || t === "activo" || t === "publicado" || t === "1" || t === "x";
      }

      function badgeEstado(estado){
        const clase = "badge-" + slugEstado(estado);
        return '<span class="badge ' + clase + '">' + escapeHtml(estado || "Sin estado") + '</span>';
      }

      function slugEstado(estado){
        return String(estado || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g,"")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g,"-")
          .replace(/^-+|-+$/g,"");
      }

      function formatoMoneda(valor, moneda){
        const n = Number(valor || 0);
        const currency = moneda || "USD";

        try{
          return new Intl.NumberFormat("es-CR", {
            style:"currency",
            currency:currency,
            minimumFractionDigits:2,
            maximumFractionDigits:2
          }).format(n);
        }catch(error){
          return "$" + n.toLocaleString("es-CR", {
            minimumFractionDigits:2,
            maximumFractionDigits:2
          });
        }
      }

      function formatoNumero(valor){
        return Number(valor || 0).toLocaleString("es-CR");
      }

      async function solicitarCatalogosDesigner(payload){
        const params = new URLSearchParams();
        Object.keys(payload || {}).forEach(function(key){
          const value = payload[key];
          if(value !== undefined && value !== null && value !== "") params.set(key, String(value));
        });
        const resp = await fetchAutenticado("/api/catalogos/designer?" + params.toString(), {
          method:"GET",
          headers:{"Accept":"application/json"}
        });
        let data = null;
        try { data = await resp.json(); } catch(e) { data = null; }
        if(!resp.ok || !data || !data.ok){
          throw new Error((data && data.error) || "No fue posible consultar los catálogos.");
        }
        return data;
      }

      async function guardarCatalogosDesigner(endpoint, registro){
        const resp = await fetchAutenticado(endpoint, {
          method:"POST",
          headers:{"Accept":"application/json","Content-Type":"application/json"},
          body:JSON.stringify(registro || {})
        });
        let data = null;
        try { data = await resp.json(); } catch(e) { data = null; }
        if(!resp.ok || !data || !data.ok){
          throw new Error((data && data.error) || "No fue posible guardar la información del catálogo.");
        }
        return data;
      }

      async function eliminarCatalogosDesigner(endpoint){
        const resp = await fetchAutenticado(endpoint, {method:"DELETE", headers:{"Accept":"application/json"}});
        let data = null;
        try { data = await resp.json(); } catch(e) { data = null; }
        if(!resp.ok || !data || !data.ok){
          throw new Error((data && data.error) || "No fue posible eliminar el registro.");
        }
        return data;
      }

      function cargarDesignerCatalogos(force){
        const d = state.disenadorCotiza || {};
        const catalogoPendiente = String(d.catalogoSeleccionado || "").trim().toUpperCase();
        state.disenadorCotiza = d;

        // V49: carga progresiva. Al entrar a Catálogos solo se lee la definición
        // de catálogos. Los valores y relaciones se leen al seleccionar un catálogo.
        if(!force && d.catalogos && d.catalogos.length){
          ocultarDesignerEstadoInline();
          renderDesignerCatalogos();
          return;
        }

        mostrarDesignerEstadoInline("Cargando lista de catálogos...");
        setDesignerLoading(true, "Cargando catálogos", "Cotiza está leyendo solo la lista de catálogos. Los valores se cargarán al seleccionar uno.");

        const lista = byId("designerCatalogosLista");
        if(lista) lista.innerHTML = '<div class="designer-empty">Cargando catálogos...</div>';
        const valoresBody = byId("designerCatalogoValoresBody");
        if(valoresBody) valoresBody.innerHTML = '<tr><td colspan="7">Seleccione un catálogo para cargar sus valores.</td></tr>';

        function terminarCarga(){
          setLoading("section-parametros", false);
          setDesignerLoading(false);
        }

        function normalizarRespuestaCatalogosDesigner(res){
          if(!res) return null;
          if(typeof res === "string"){
            try { return JSON.parse(res); } catch(e) {
              return { ok:false, success:false, error:"El API de catálogos devolvió texto no válido." };
            }
          }
          if(res.resultado) return normalizarRespuestaCatalogosDesigner(res.resultado);
          return res;
        }

        setLoading("section-parametros", true);
        solicitarCatalogosDesigner({modo:"solo_catalogos", mostrarSistema:true})
          .then(function(res){
            terminarCarga();
            res = normalizarRespuestaCatalogosDesigner(res);

            if(!res || !(res.ok || res.success)){
              const msg = (res && (res.error || res.mensaje)) ? (res.error || res.mensaje) : "No fue posible cargar catálogos.";
              d.catalogos = [];
              d.valores = [];
              d.relaciones = [];
              d.catalogoSeleccionado = "";
              state.disenadorCotiza = d;
              renderDesignerCatalogos();
              mostrarDesignerEstadoInline(msg, true);
              mostrarToast(msg);
              return;
            }

            const catalogos = res.catalogos || res.catalogos_definicion || res.data || res.filas || res.rows || [];
            d.catalogos = normalizarDataModuloParametros(Array.isArray(catalogos) ? catalogos : []);
            d.valores = force ? [] : (d.valores || []);
            d.relaciones = force ? [] : (d.relaciones || []);
            const catalogoRecargado = catalogoPendiente
              ? d.catalogos.find(function(cat){
                  return String(cat.catalogo_id || "").trim().toUpperCase() === catalogoPendiente;
                })
              : null;
            d.catalogoSeleccionado = catalogoRecargado ? catalogoPendiente : "";
            if(catalogoRecargado && clasificarTipoCatalogoDesigner(catalogoRecargado) === "SISTEMA"){
              d.mostrarCatalogosSistema = true;
            }
            d.valorSeleccionado = "";
            state.disenadorCotiza = d;

            const mostrarSistema = byId("designerMostrarCatalogosSistema");
            if(mostrarSistema) mostrarSistema.checked = !!d.mostrarCatalogosSistema;

            if(!d.catalogos.length){
              mostrarDesignerEstadoInline("El API respondió correctamente, pero no devolvió catálogos para mostrar. Revise alcance COTIZADOR/GLOBAL o registros activos.", true);
            }else{
              ocultarDesignerEstadoInline();
            }

            renderDesignerCatalogos();
          })
          .catch(function(error){
            terminarCarga();
            const msg = error && error.message ? error.message : "No fue posible cargar la lista de catálogos.";
            mostrarDesignerEstadoInline(msg, true);
            mostrarToast(msg);
          });
      }

      function obtenerCatalogosVisiblesDesigner(){
        const d = state.disenadorCotiza || {};
        const mostrarSistema = !!d.mostrarCatalogosSistema;
        return (d.catalogos || []).filter(function(cat){
          const tipo = clasificarTipoCatalogoDesigner(cat);
          return tipo === "COTIZADOR" || (mostrarSistema && tipo === "SISTEMA");
        });
      }

      function renderDesignerCatalogos(){
        const d = state.disenadorCotiza || {};
        const visibles = obtenerCatalogosVisiblesDesigner();
        const seleccionado = String(d.catalogoSeleccionado || "").toUpperCase();
        const seleccionadoVisible = visibles.some(function(c){ return String(c.catalogo_id || "").toUpperCase() === seleccionado; });

        // V49: no se selecciona automáticamente el primer catálogo, para evitar
        // cargar valores hasta que el usuario haga clic.
        if(seleccionado && !seleccionadoVisible){
          d.catalogoSeleccionado = "";
          d.valorSeleccionado = "";
          state.disenadorCotiza = d;
        }

        renderDesignerCatalogosLista();
        renderDesignerValoresCatalogo();
        cargarPropiedadesCatalogoSeleccionado();
        llenarDesignerCatalogoPadreOptions();
